<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel 5S | KRAEM BI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; 
            --text: #0f172a; --text-secondary: #64748b;
            --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }

        /* Filtros con Rango de Fechas */
        .filter-bar { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; background: var(--card); padding: 20px; 
            border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 25px;
        }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--primary); }
        select, input { padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 14px; background: #fff; }

        /* KPI Global */
        .main-stats { display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-bottom: 25px; }
        .global-card {
            background: linear-gradient(135deg, var(--primary), #4f46e5); color: white;
            padding: 30px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        .global-card div { font-size: 4rem; font-weight: 900; margin: 10px 0; }

        /* Grid 5S */
        .s-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        .s-card { 
            background: var(--card); padding: 20px; border-radius: 16px; 
            text-align: center; border: 1px solid #e2e8f0; border-top: 4px solid #ddd;
        }
        .s-card .jap-name { display: block; font-size: 14px; color: var(--primary); font-weight: 700; }
        .s-card .esp-name { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; }
        .s-card .percentage { font-size: 1.8rem; font-weight: 800; }

        .grid-charts { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin: 25px 0; }
        .chart-box { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0; }

        .obs-container { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0; }
        .obs-list { max-height: 350px; overflow-y: auto; }
        .obs-item { padding: 15px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 15px; }
        .obs-tag { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 900; color: white; min-width: 90px; text-align: center; }

        .btn-action { background: var(--primary); color: white; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 700; border: none; cursor: pointer; }

        @media (max-width: 1024px) { .main-stats { grid-template-columns: 1fr; } .s-grid { grid-template-columns: repeat(3, 1fr); } .grid-charts { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header-panel">
    <div>
        <h2 style="margin:0;"><i class="fas fa-chart-pie"></i> PANEL ESTRATÉGICO 5'S</h2>
        <p style="margin:5px 0 0; color: var(--text-secondary); font-size: 14px;">Métricas de Orden, Limpieza y Disciplina</p>
    </div>
    <div style="display: flex; gap: 10px;">
        <button onclick="loadData()" class="btn-action"><i class="fas fa-sync"></i> Actualizar</button>
        <a href="dashboard.html" class="btn-action" style="background: #64748b;"><i class="fas fa-home"></i> Inicio</a>
    </div>
</div>

<div class="filter-bar">
    <div class="filter-group">
        <label>Desde</label>
        <input type="date" id="f-inicio">
    </div>
    <div class="filter-group">
        <label>Hasta</label>
        <input type="date" id="f-fin">
    </div>
    <div class="filter-group">
        <label>Área</label>
        <select id="f-area" onchange="loadData()"><option value="">Todas</option></select>
    </div>
    <div class="filter-group">
        <label>Máquina</label>
        <select id="f-maquina" onchange="loadData()"><option value="">Todas</option></select>
    </div>
    <div class="filter-group">
        <label>Operador</label>
        <select id="f-operador" onchange="loadData()"><option value="">Todos</option></select>
    </div>
</div>

<div class="main-stats">
    <div class="global-card">
        <h2>Puntaje Global 5'S</h2>
        <div id="val-global">0%</div>
        <p id="total-auditorias" style="margin:0; opacity: 0.8;">Esperando datos...</p>
    </div>

    <div class="s-grid">
        <div class="s-card" id="card-s1"><span class="jap-name">SEIRI</span><span class="esp-name">(Clasificar)</span><div class="percentage" id="val-s1">0%</div></div>
        <div class="s-card" id="card-s2"><span class="jap-name">SEITON</span><span class="esp-name">(Ordenar)</span><div class="percentage" id="val-s2">0%</div></div>
        <div class="s-card" id="card-s3"><span class="jap-name">SEISO</span><span class="esp-name">(Limpiar)</span><div class="percentage" id="val-s3">0%</div></div>
        <div class="s-card" id="card-s4"><span class="jap-name">SEIKETSU</span><span class="esp-name">(Estandarizar)</span><div class="percentage" id="val-s4">0%</div></div>
        <div class="s-card" id="card-s5"><span class="jap-name">SHITSUKE</span><span class="esp-name">(Disciplina)</span><div class="percentage" id="val-s5">0%</div></div>
    </div>
</div>

<div class="grid-charts">
    <div class="chart-box"><h3>Perfil Comparativo</h3><canvas id="radarChart"></canvas></div>
    <div class="chart-box"><h3>Tendencia de Cumplimiento</h3><canvas id="lineChart"></canvas></div>
</div>

<div class="obs-container">
    <h3><i class="fas fa-clipboard-list"></i> Hallazgos y Observaciones</h3>
    <div class="obs-list" id="obs-list"></div>
</div>

<script>
let lineChart, radarChart;

async function init() {
    // Configurar fechas por defecto (del 1ero de este mes a hoy)
    const hoy = new Date();
    const primero = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    document.getElementById('f-inicio').value = primero.toISOString().split('T')[0];
    document.getElementById('f-fin').value = hoy.toISOString().split('T')[0];

    // Cargar Selectores
    const { data: areas } = await client.from('rh_areas').select('*').order('nombre');
    const { data: emps } = await client.from('rh_empleados').select('id, nombre_completo').order('nombre_completo');
    
    const aSel = document.getElementById('f-area');
    areas?.forEach(a => aSel.innerHTML += `<option value="${a.id}">${a.nombre}</option>`);
    
    const oSel = document.getElementById('f-operador');
    emps?.forEach(e => oSel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`);

    const mSel = document.getElementById('f-maquina');
    for(let i=1; i<=26; i++) mSel.innerHTML += `<option value="${i}">${i}</option>`;

    loadData();
}

async function loadData() {
    const inicio = document.getElementById('f-inicio').value;
    const fin = document.getElementById('f-fin').value;
    const area = document.getElementById('f-area').value;
    const maquina = document.getElementById('f-maquina').value;
    const operador = document.getElementById('f-operador').value;

    // Ajustar fin para incluir todo el día
    let fFin = new Date(fin);
    fFin.setHours(23,59,59);

    let query = client.from('rh_evaluaciones_5s').select('*, rh_areas(nombre), rh_empleados!empleado_id(nombre_completo)')
        .gte('created_at', inicio)
        .lte('created_at', fFin.toISOString())
        .order('created_at', { ascending: true });

    if(area) query = query.eq('area_id', area);
    if(maquina) query = query.eq('maquina_id', maquina);
    if(operador) query = query.eq('empleado_id', operador);

    const { data } = await query;
    processDashboard(data || []);
}

function processDashboard(data) {
    if(data.length === 0) {
        document.getElementById('val-global').innerText = "0%";
        document.getElementById('obs-list').innerHTML = "<p style='text-align:center; padding:20px;'>Sin datos en este rango.</p>";
        return;
    }

    const s_values = [0, 0, 0, 0, 0]; 
    const s_counts = [0, 0, 0, 0, 0];
    let obsHtml = "";
    let totalPuntuacion = 0;

    data.forEach(audit => {
        totalPuntuacion += audit.puntuacion;
        const resp = audit.respuestas_json;
        Object.entries(resp).forEach(([key, val]) => {
            const sIndex = parseInt(key.split('_')[0]);
            if(sIndex >= 0 && sIndex <= 4) { s_values[sIndex] += val; s_counts[sIndex]++; }
        });

        if(audit.observaciones) {
            Object.entries(audit.observaciones).forEach(([sKey, text]) => {
                if(text?.trim()) {
                    const sNum = sKey.replace('s', '');
                    const sNombre = ["Clasificar", "Ordenar", "Limpiar", "Estandarizar", "Disciplina"][sNum-1];
                    obsHtml += `
                        <div class="obs-item">
                            <span class="obs-tag" style="background:${getSColor(sNum)}">S${sNum} ${sNombre}</span>
                            <div style="flex:1;">
                                <strong>${audit.rh_empleados?.nombre_completo}</strong> - <small>${new Date(audit.created_at).toLocaleDateString()}</small><br>
                                <span style="font-size:13px; color:var(--text-secondary);">${text}</span>
                            </div>
                        </div>`;
                }
            });
        }
    });

    document.getElementById('val-global').innerText = Math.round(totalPuntuacion / data.length) + "%";
    document.getElementById('total-auditorias').innerText = `${data.length} Auditorías encontradas`;

    const s_averages = s_values.map((v, i) => Math.round((v / (s_counts[i] || 1)) * 100));
    s_averages.forEach((avg, i) => {
        const el = document.getElementById(`val-s${i+1}`);
        el.innerText = avg + "%";
        el.parentElement.style.borderTopColor = avg < 70 ? 'var(--danger)' : (avg < 90 ? 'var(--warning)' : 'var(--success)');
    });

    document.getElementById('obs-list').innerHTML = obsHtml;
    updateCharts(data, s_averages);
}

function getSColor(num) { return ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981'][num-1]; }

function updateCharts(data, s_averages) {
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
            labels: ['S1 Clasificar', 'S2 Ordenar', 'S3 Limpiar', 'S4 Estandarizar', 'S5 Disciplina'],
            datasets: [{ label: '% Cumplimiento', data: s_averages, backgroundColor: 'rgba(37, 99, 235, 0.2)', borderColor: '#2563eb' }]
        },
        options: { scales: { r: { min: 0, max: 100, ticks: { display: false } } } }
    });

    if(lineChart) lineChart.destroy();
    lineChart = new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: {
            labels: data.map(d => new Date(d.created_at).toLocaleDateString()),
            datasets: [{ label: 'Puntaje Total', data: data.map(d => d.puntuacion), borderColor: '#22c55e', fill: true, tension: 0.3 }]
        },
        options: { scales: { y: { min: 0, max: 100 } } }
    });
}

window.onload = init;
</script>
</body>
</html>
