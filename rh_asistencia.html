<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRAEM | Control de Asistencia</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; 
            --text: #1e293b; --success: #22c55e; --warning: #f59e0b; 
            --danger: #ef4444; --border: #e2e8f0; --purple: #7c3aed;
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; padding-bottom: 140px; }

        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { 
            text-decoration: none; color: #64748b; background: white; 
            padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
            font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px;
        }

        /* Contenedor del Selector de Fecha Operativa */
        .date-picker-box {
            background: white; padding: 12px 16px; border-radius: 12px;
            border: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 15px;
        }
        .input-date-control {
            border: 1px solid var(--border); padding: 8px 12px;
            border-radius: 8px; font-weight: bold; color: var(--text);
            font-family: 'Inter', sans-serif; outline: none; cursor: pointer;
        }
        .input-date-control:focus { border-color: var(--accent); }

        .areas-filter, .turnos-filter { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0 10px; scrollbar-width: none; }
        .areas-filter::-webkit-scrollbar, .turnos-filter::-webkit-scrollbar { display: none; }
        .area-chip, .turno-chip { white-space: nowrap; padding: 8px 16px; background: white; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 600; color: #64748b; cursor: pointer; transition: 0.2s; }
        .area-chip.active, .turno-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
        .filter-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #64748b; margin: 10px 0 4px 4px; display: block; letter-spacing: 0.5px; }

        .tabs-container { display: flex; background: white; border: 1px solid var(--border); margin: 15px 0; border-radius: 12px; overflow: hidden; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; font-size: 13px; color: #64748b; transition: 0.3s; }
        .tab.active { color: var(--accent); background: #eff6ff; border-bottom: 3px solid var(--accent); }

        .attendance-card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 15px; margin-bottom: 10px; }
        .card-saved { border-left: 5px solid var(--success); background: #f0fdf4; }
        .card-extra { border-left: 5px solid var(--purple); background: #faf5ff; }
        .emp-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .emp-info { display: flex; align-items: center; gap: 12px; }
        .emp-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
        .emp-details h4 { margin: 0; font-size: 14px; }
        .emp-details p { margin: 2px 0 0; font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase; }
        
        .dynamic-controls { width: 100%; display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); justify-content: flex-end; }
        .input-sub { padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 12px; font-weight: bold; outline: none; color: var(--text); }

        .status-buttons { display: flex; gap: 5px; }
        .btn-status { width: 35px; height: 35px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: bold; }
        .active-P { background: var(--success) !important; color: white !important; border-color: var(--success); }
        .active-R { background: var(--warning) !important; color: white !important; border-color: var(--warning); }
        .active-F { background: var(--danger) !important; color: white !important; border-color: var(--danger); }

        .status-badge { padding: 5px 12px; border-radius: 6px; color: white; font-weight: bold; font-size: 11px; display: inline-flex; flex-direction: column; align-items: flex-end; }
        .status-sub-lbl { font-size: 9px; opacity: 0.9; font-weight: normal; margin-top: 2px; }
        .bg-P { background: var(--success); } .bg-R { background: var(--warning); } .bg-F { background: var(--danger); }

        .input-extra { width: 60px; padding: 8px; border-radius: 8px; border: 2px solid var(--purple); text-align: center; font-weight: bold; font-size: 16px; outline: none; }
        .footer-save { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; border-top: 1px solid var(--border); text-align: center; z-index: 100; }
        .btn-final { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; max-width: 400px; }
        .notice-badge { font-size: 10px; background: #fee2e2; color: #ef4444; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-top: 4px; display: inline-block;}
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="dashboard.html" class="btn-back"><i class="fas fa-th-large"></i> Dashboard</a>
        <div style="text-align: right;">
            <h2 style="margin:0; font-size:16px;">Pase de Lista</h2>
        </div>
    </div>

    <div class="date-picker-box">
        <div>
            <span style="font-size: 11px; font-weight: 800; color: #64748b; display:block; text-transform:uppercase;">Día de Trabajo (Operativo)</span>
            <span id="fecha-texto-largo" style="font-size: 14px; font-weight: bold; color: var(--accent);"></span>
        </div>
        <input type="date" id="fecha-operativa" class="input-date-control" onchange="cambiarFechaManual(this.value)">
    </div>

    <span class="filter-label"><i class="fas fa-layer-group"></i> Área de Trabajo</span>
    <div class="areas-filter" id="areas-container">
        <div class="area-chip active" onclick="filtrarArea('TODOS', this)">TODOS</div>
    </div>

    <span class="filter-label"><i class="fas fa-clock"></i> Turno</span>
    <div class="turnos-filter" id="turnos-container">
        <div class="turno-chip active" onclick="filtrarTurno('TODOS', this)">TODOS</div>
    </div>

    <div class="tabs-container">
        <div class="tab active" id="tab-asis" onclick="cambiarTab('asistencia')"><i class="fas fa-user-check"></i> ASISTENCIA</div>
        <div class="tab" id="tab-ext" onclick="cambiarTab('extra')"><i class="fas fa-bolt"></i> TIEMPO EXTRA</div>
    </div>

    <div id="lista-empleados">
        <div style="text-align:center; padding:50px; color:#94a3b8;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
        </div>
    </div>
</div>

<div class="footer-save">
    <button class="btn-final" id="btn-save" onclick="guardarCambios()">
        <i class="fas fa-save"></i> GUARDAR CAMBIOS DEL DÍA
    </button>
</div>

<script>
    let modo = 'asistencia';
    let areaSeleccionada = 'TODOS';
    let turnoSeleccionado = 'TODOS'; 
    let empleados = [];
    let áreas = [];
    let turnosMaster = [];
    let solicitudes = [];
    let asistenciaLocal = {}; 
    let fechaTrabajoGlobal = ""; 

    // UUID específico del Turno 2 en tu Base de Datos
    const ID_TURNO_2 = '57128cef-7a49-40c9-b6af-d82ac82c20ab';

    function calcularFechaOperativaInicial() {
        const ahora = new Date();
        const horaActual = ahora.getHours();
        if (horaActual >= 0 && horaActual < 6) {
            ahora.setDate(ahora.getDate() - 1);
        }
        return ahora.toISOString().split('T')[0];
    }

    async function cargarDatos() {
        if (!fechaTrabajoGlobal) {
            fechaTrabajoGlobal = calcularFechaOperativaInicial();
        }
        
        document.getElementById('fecha-operativa').value = fechaTrabajoGlobal;
        
        const [year, month, day] = fechaTrabajoGlobal.split('-');
        const dateObj = new Date(year, month - 1, day);
        document.getElementById('fecha-texto-largo').innerText = dateObj.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });

        try {
            const [resEmp, resAreas, resTurnos, resSol, resAsis] = await Promise.all([
                client.from('rh_empleados').select('id, nombre_completo, foto_url, area_general_id, turno_id, rh_puestos(nombre)').eq('estatus', 'ACTIVO').order('nombre_completo'),
                client.from('areas_generales').select('*').order('nombre'),
                client.from('rh_turnos').select('*').order('nombre'),
                client.from('rh_solicitudes').select('empleado_id, tipo').eq('estatus', 'APROBADO').lte('fecha_inicio', fechaTrabajoGlobal).gte('fecha_fin', fechaTrabajoGlobal),
                client.from('rh_asistencia_diaria').select('*').eq('fecha', fechaTrabajoGlobal)
            ]);

            empleados = resEmp.data || [];
            áreas = resAreas.data || [];
            turnosMaster = resTurnos.data || [];
            solicitudes = resSol.data || [];

            const areasContainer = document.getElementById('areas-container');
            areasContainer.innerHTML = `<div class="area-chip ${areaSeleccionada === 'TODOS' ? 'active' : ''}" onclick="filtrarArea('TODOS', this)">TODOS</div>`;
            áreas.forEach(a => {
                areasContainer.innerHTML += `<div class="area-chip ${String(areaSeleccionada).trim() === String(a.id).trim() ? 'active' : ''}" onclick="filtrarArea('${a.id}', this)">${a.nombre}</div>`;
            });

            // CORRECCIÓN: Quitamos el mapeo de caracteres manuales ('1' o '2') para usar directamente los UUIDs limpios
            const turnosContainer = document.getElementById('turnos-container');
            turnosContainer.innerHTML = `<div class="turno-chip ${turnoSeleccionado === 'TODOS' ? 'active' : ''}" onclick="filtrarTurno('TODOS', this)">TODOS</div>`;
            turnosMaster.forEach(t => {
                turnosContainer.innerHTML += `<div class="turno-chip ${String(turnoSeleccionado).trim() === String(t.id).trim() ? 'active' : ''}" onclick="filtrarTurno('${t.id}', this)">${t.nombre}</div>`;
            });

            asistenciaLocal = {};
            resAsis.data.forEach(a => {
                asistenciaLocal[a.empleado_id] = { 
                    estado: a.estado, 
                    horas_extra: a.horas_extra || 0,
                    hora_llegada: a.hora_llegada || '',
                    motivo: a.motivo || '',
                    en_db: true 
                };
            });

            render();
        } catch (err) {
            console.error("Error general:", err);
        }
    }

    function cambiarFechaManual(nuevaFecha) {
        fechaTrabajoGlobal = nuevaFecha;
        renderLoading();
        cargarDatos();
    }

    function renderLoading() {
        document.getElementById('lista-empleados').innerHTML = `<div style="text-align:center; padding:50px; color:#94a3b8;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>`;
    }

    function filtrarArea(id, element) {
        areaSeleccionada = id;
        document.querySelectorAll('.area-chip').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        render();
    }

    function filtrarTurno(id, element) {
        turnoSeleccionado = id;
        document.querySelectorAll('.turno-chip').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        render();
    }

    function cambiarTab(nuevoModo) {
        modo = nuevoModo;
        document.getElementById('tab-asis').classList.toggle('active', modo === 'asistencia');
        document.getElementById('tab-ext').classList.toggle('active', modo === 'extra');
        render();
    }

    function render() {
        const container = document.getElementById('lista-empleados');
        container.innerHTML = '';

        const [y, m, d] = fechaTrabajoGlobal.split('-');
        const diaSemana = new Date(y, m - 1, d).getDay();

        // CORRECCIÓN: El filtrado de datos ahora hace una comparación estricta de cadenas UUID sin fallos de conversión
        const filtrados = empleados.filter(e => {
            const cumpleArea = areaSeleccionada === 'TODOS' || String(e.area_general_id).trim() === String(areaSeleccionada).trim();
            const cumpleTurno = turnoSeleccionado === 'TODOS' || String(e.turno_id).trim() === String(turnoSeleccionado).trim();
            return cumpleArea && cumpleTurno;
        });

        if (filtrados.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8; font-size:13px;">No hay operadores activos en este sector/turno.</div>`;
            return;
        }

        filtrados.forEach(emp => {
            const sol = solicitudes.find(s => s.empleado_id === emp.id);
            const data = asistenciaLocal[emp.id] || { estado: '', horas_extra: 0, hora_llegada: '', motivo: '', en_db: false };

            if (modo === 'extra' && (data.estado === 'F' || !data.estado)) return;

            const card = document.createElement('div');
            card.className = `attendance-card ${data.en_db ? 'card-saved' : ''} ${modo === 'extra' && data.horas_extra > 0 ? 'card-extra' : ''}`;

            let controles = '';
            let controlesDinamicos = '';
            
            // CORRECCIÓN: Cambiado para buscar exactamente la coincidencia limpia del UUID o el texto del Turno 2
            const esTurno2 = String(emp.turno_id).trim() === ID_TURNO_2 || (emp.turno_id && String(emp.turno_id).includes('2'));
            const esViernesDeTurno2 = esTurno2 && diaSemana === 5;

            if (modo === 'asistencia') {
                if (sol) {
                    controles = `<span class="status-badge" style="background:#64748b;"><i class="fas fa-lock"></i> ${sol.tipo}</span>`;
                } else if (data.en_db) {
                    let subInfo = '';
                    if(data.estado === 'R' && data.hora_llegada) subInfo = `<span class="status-sub-lbl">${data.hora_llegada} hrs</span>`;
                    if(data.estado === 'F' && data.motivo) subInfo = `<span class="status-sub-lbl">${data.motivo}</span>`;

                    controles = `
                        <div style="display:flex; gap:10px; align-items:center;">
                            <span class="status-badge bg-${data.estado}">
                                ${data.estado === 'P' ? 'PRESENTE' : data.estado === 'R' ? 'RETARDO' : 'FALTA'}
                                ${subInfo}
                            </span>
                            <button class="btn-delete" onclick="borrarRegistro('${emp.id}')" style="border:none; background:none; color:var(--danger); cursor:pointer; font-size:16px;">
                                <i class="fas fa-undo"></i>
                            </button>
                        </div>`;
                } else {
                    controles = `
                        <div class="status-buttons">
                            <button class="btn-status ${data.estado === 'P' ? 'active-P' : ''}" onclick="updateLocal('${emp.id}', 'P')">P</button>
                            <button class="btn-status ${data.estado === 'R' ? 'active-R' : ''}" onclick="updateLocal('${emp.id}', 'R')">R</button>
                            <button class="btn-status ${data.estado === 'F' ? 'active-F' : ''}" onclick="updateLocal('${emp.id}', 'F')">F</button>
                        </div>`;

                    if (data.estado === 'R') {
                        controlesDinamicos = `
                            <div class="dynamic-controls">
                                <label style="font-size:11px; font-weight:bold; align-self:center; color:var(--warning)">Hora Llegada:</label>
                                <input type="time" class="input-sub" value="${data.hora_llegada || ''}" onchange="updateSubCampos('${emp.id}', 'hora_llegada', this.value)">
                            </div>`;
                    } else if (data.estado === 'F') {
                        controlesDinamicos = `
                            <div class="dynamic-controls">
                                <label style="font-size:11px; font-weight:bold; align-self:center; color:var(--danger)">Tipo Falta:</label>
                                <select class="input-sub" onchange="updateSubCampos('${emp.id}', 'motivo', this.value)">
                                    <option value="">Seleccione...</option>
                                    <option value="FALTA INJUSTIFICADA" ${data.motivo === 'FALTA INJUSTIFICADA' ? 'selected' : ''}>Falta Injustificada</option>
                                    <option value="VACACIONES" ${data.motivo === 'VACACIONES' ? 'selected' : ''}>Vacaciones</option>
                                    <option value="SUSPENSION" ${data.motivo === 'SUSPENSION' ? 'selected' : ''}>Suspensión</option>
                                    <option value="INCAPACIDAD" ${data.motivo === 'INCAPACIDAD' ? 'selected' : ''}>Incapacidad</option>
                                    <option value="PERMISO C/GOCE" ${data.motivo === 'PERMISO C/GOCE' ? 'selected' : ''}>Permiso con Goce</option>
                                    <option value="PERMISO S/GOCE" ${data.motivo === 'PERMISO S/GOCE' ? 'selected' : ''}>Permiso sin Goce</option>
                                </select>
                            </div>`;
                    }
                }
            } else {
                if (esViernesDeTurno2) {
                    controles = `
                        <div style="text-align:right;">
                            <span style="font-size:11px; font-weight:bold; color:var(--warning);"><i class="fas fa-info-circle"></i> Extensión Regular</span>
                            <br><small style="font-size:9px; color:#64748b;">Salida obligatoria 7:30 AM</small>
                        </div>`;
                } else {
                    controles = `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="number" class="input-extra" value="${data.horas_extra}" onchange="updateExtra('${emp.id}', this.value)" step="0.5" min="0">
                            <span style="font-size:10px; font-weight:bold; color:var(--purple);">HRS</span>
                        </div>`;
                }
            }

            card.innerHTML = `
                <div class="emp-row">
                    <div class="emp-info">
                        <img src="${emp.foto_url || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="emp-img">
                        <div class="emp-details">
                            <h4>${emp.nombre_completo}</h4>
                            <p>${emp.rh_puestos?.nombre || 'OPERATIVO'} 
                                ${esTurno2 ? '<span style="color:var(--purple); font-weight:800;">[T2]</span>' : ''}
                            </p>
                            ${esViernesDeTurno2 && modo === 'asistencia' ? '<span class="notice-badge">Jornada de Viernes (Termina Sábado 7:30 AM)</span>' : ''}
                        </div>
                    </div>
                    ${controles}
                </div>
                ${controlesDinamicos}`;
            container.appendChild(card);
        });
    }

    function updateLocal(id, est) {
        if(!asistenciaLocal[id]) asistenciaLocal[id] = { estado: '', horas_extra: 0, hora_llegada: '', motivo: '', en_db: false };
        asistenciaLocal[id].estado = est;
        if(est === 'P') { asistenciaLocal[id].hora_llegada = ''; asistenciaLocal[id].motivo = ''; }
        render();
    }

    function updateSubCampos(id, campo, valor) {
        if(!asistenciaLocal[id]) return;
        asistenciaLocal[id][campo] = valor;
    }

    function updateExtra(id, valor) {
        if(!asistenciaLocal[id]) asistenciaLocal[id] = { estado: 'P', horas_extra: 0, en_db: false };
        asistenciaLocal[id].horas_extra = parseFloat(valor) || 0;
    }

    async function borrarRegistro(id) {
        if(!confirm("¿Resetear registro de asistencia de esta fecha?")) return;
        await client.from('rh_asistencia_diaria').delete().eq('empleado_id', id).eq('fecha', fechaTrabajoGlobal);
        delete asistenciaLocal[id];
        render();
    }

    async function guardarCambios() {
        const btn = document.getElementById('btn-save');
        let validacionOk = true;

        const [y, m, d] = fechaTrabajoGlobal.split('-');
        const diaSemana = new Date(y, m - 1, d).getDay();
        
        const batch = Object.keys(asistenciaLocal)
            .filter(id => asistenciaLocal[id].estado)
            .map(id => {
                const item = asistenciaLocal[id];
                const emp = empleados.find(e => e.id === id);
                
                if(item.estado === 'R' && !item.hora_llegada && !item.en_db) {
                    alert("Por favor ingresa la hora de llegada para los retardos.");
                    validacionOk = false;
                }
                if(item.estado === 'F' && !item.motivo && !item.en_db) {
                    alert("Por favor selecciona la incidencia/motivo para las faltas.");
                    validacionOk = false;
                }

                const esTurno2 = String(emp?.turno_id).trim() === ID_TURNO_2 || String(emp?.turno_id).includes('2');
                let hExtra = item.horas_extra || 0;
                if (esTurno2 && diaSemana === 5) {
                    hExtra = 0; 
                }

                return {
                    empleado_id: id,
                    fecha: fechaTrabajoGlobal,
                    estado: item.estado,
                    hora_llegada: item.hora_llegada || null,
                    motivo: item.motivo || 'N/A',
                    horas_extra: hExtra
                };
            });

        if (!validacionOk) return;
        if (batch.length === 0) return alert("No hay pases de lista nuevos para guardar.");

        btn.disabled = true;
        const { error } = await client.from('rh_asistencia_diaria').upsert(batch, { onConflict: 'empleado_id, fecha' });

        if (!error) {
            alert("✅ Registro operativo guardado con éxito.");
            cargarDatos();
        } else {
            alert("Error: " + error.message);
        }
        btn.disabled = false;
    }

    document.addEventListener('DOMContentLoaded', cargarDatos);
</script>
</body>
</html>
