<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAEM | Catálogo de Clientes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
  <script src="kraem_nav.js"></script>
  <script src="ingenieria_i18n.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#f8fafc; --card:#ffffff; --text:#1e293b;
  --muted:#64748b; --border:#e2e8f0; --success:#22c55e; --danger:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);font-family:'Segoe UI',sans-serif;color:var(--text)}
.container{max-width:1400px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:20px}
.title-box{display:flex;align-items:center;gap:15px}
.title-box h1{margin:0;font-size:26px}
.title-box p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.04);margin-bottom:20px}
.section-title{font-size:16px;font-weight:700;margin:0 0 15px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.group{display:flex;flex-direction:column}
label{font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;text-transform:uppercase}
input,select,textarea{padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;background:white;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
.btn{border:none;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:13px;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:white}
.btn-secondary{background:#e2e8f0;color:#334155}
.btn-success{background:var(--success);color:white}
.btn-danger-soft{background:#fee2e2;color:#991b1b}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:950px}
th{background:#f1f5f9;color:#475569;font-size:11px;text-transform:uppercase;text-align:left;padding:12px}
td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:hover td{background:#f8fafc}
.badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}
.st-act{background:#dcfce7;color:#166534}
.st-inact{background:#fee2e2;color:#991b1b}
.muted{color:var(--muted);font-size:11px}
.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:768px){.filters{grid-template-columns:1fr}body{padding:10px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-box">
      <button class="btn btn-secondary" onclick="location.href='dashboard.html'"><i class="fas fa-arrow-left"></i> Menú</button>
      <div>
        <div style="display:flex;align-items:baseline;gap:6px">
          <span style="font-size:18px;font-weight:900">KRAEM</span>
          <span style="font-size:9.5px;font-weight:800;color:var(--primary);background:rgba(37,99,235,0.12);padding:2px 6px;border-radius:4px;text-transform:uppercase">by APEX SYSTEM</span>
        </div>
        <h1 style="margin:2px 0 0;font-size:24px"><i class="fas fa-building" style="color:var(--primary)"></i> Catálogo de Clientes Finales</h1>
        <p>Clientes, plantas destino, RFC fiscal y días de tránsito (base para Forecast, Embarques y WMS)</p>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <a href="catalogo_proveedores.html" class="btn btn-secondary"><i class="fas fa-truck-field"></i> Directorio Proveedores</a>
      <button class="btn btn-primary" onclick="nuevo()"><i class="fas fa-plus"></i> Nuevo Cliente</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><i class="fas fa-address-card"></i> <span id="formTitle">Nuevo Cliente</span></div>
    <div class="form-grid">
      <div class="group"><label>Código Cliente *</label><input id="f_codigo" placeholder="Ej. SEOYON-MTY" style="text-transform:uppercase"></div>
      <div class="group" style="grid-column:span 2"><label>Nombre Comercial / Razón Social *</label><input id="f_nombre" placeholder="Ej. Seoyon E-Hwa Monterrey S.A. de C.V."></div>
      <div class="group"><label>RFC / Tax ID</label><input id="f_rfc" placeholder="Ej. SEH150312XX1" style="text-transform:uppercase"></div>
      <div class="group"><label>Planta / Destino</label><input id="f_planta" placeholder="Ej. Planta Pesquería"></div>
      <div class="group"><label>Contacto Principal</label><input id="f_contacto" placeholder="Nombre del contacto"></div>
      <div class="group"><label>Teléfono</label><input id="f_tel" placeholder="(81) ..."></div>
      <div class="group"><label>Correo Electrónico</label><input id="f_email" type="email" placeholder="contacto@cliente.com"></div>
      <div class="group"><label>Días de Tránsito (Embarque)</label><input id="f_dias" type="number" min="0" value="1"></div>
      <div class="group" style="grid-column:1/-1"><label>Observaciones / Ventanas de Entrega</label><textarea id="f_obs" rows="2"></textarea></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:15px">
      <button class="btn btn-primary" id="btnGuardar" onclick="guardar()"><i class="fas fa-save"></i> Guardar Cliente</button>
      <button class="btn btn-secondary" onclick="limpiar()"><i class="fas fa-eraser"></i> Limpiar</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><i class="fas fa-list"></i> Clientes Registrados</div>
    <div class="filters">
      <input id="q" placeholder="🔍 Buscar código, nombre, planta o contacto..." oninput="render()">
      <select id="fAct" onchange="render()">
        <option value="true">Solo activos</option>
        <option value="false">Solo inactivos</option>
        <option value="">Todos</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Código</th><th>Nombre</th><th>Planta</th><th>Contacto</th><th>Teléfono / Email</th><th>Tránsito</th><th>Estatus</th><th style="text-align:right">Acciones</th></tr>
        </thead>
        <tbody id="body"><tr><td colspan="8" class="empty">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let lista = [], editId = null;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => document.getElementById(id).value.trim();

async function cargar(){
  const body = document.getElementById('body');
  const { data, error } = await client.from('clientes').select('*').order('nombre');
  if (error) {
    body.innerHTML = `<tr><td colspan="8" class="empty" style="color:var(--danger)">
      ⚠️ Ejecuta primero <b>ingenieria_fase2_sap.sql</b> en el SQL Editor de Supabase.<br><br>Detalle: ${esc(error.message)}</td></tr>`;
    return;
  }
  lista = data || [];
  render();
}

function render(){
  const q = val('q').toUpperCase();
  const act = val('fAct');
  const rows = lista.filter(c => {
    const txt = `${c.codigo||''} ${c.nombre||''} ${c.rfc||''} ${c.planta||''} ${c.contacto||''}`.toUpperCase();
    return (!q || txt.includes(q)) && (act === '' || String(c.activo !== false) === act);
  });
  const body = document.getElementById('body');
  if (!rows.length) { body.innerHTML = `<tr><td colspan="8" class="empty">Sin clientes registrados.</td></tr>`; return; }

  body.innerHTML = rows.map(c => `
    <tr style="${c.activo === false ? 'opacity:.55' : ''}">
      <td><b>${esc(c.codigo)}</b></td>
      <td><b>${esc(c.nombre)}</b>${c.rfc ? ` <span class="badge" style="background:rgba(59,130,246,0.15);color:#60a5fa;font-size:10px">${esc(c.rfc)}</span>` : ''}${c.observaciones ? `<div class="muted">${esc(c.observaciones)}</div>` : ''}</td>
      <td>${esc(c.planta || '-')}</td>
      <td>${esc(c.contacto || '-')}</td>
      <td>${esc(c.telefono || '-')}<div class="muted">${esc(c.email || '')}</div></td>
      <td>${c.dias_transito ?? 1} día(s)</td>
      <td><span class="badge ${c.activo !== false ? 'st-act' : 'st-inact'}">${c.activo !== false ? 'ACTIVO' : 'INACTIVO'}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-sm btn-secondary" onclick="editar(${c.id})"><i class="fas fa-pen"></i></button>
        <button class="btn btn-sm ${c.activo === false ? 'btn-success' : 'btn-danger-soft'}" onclick="toggle(${c.id}, ${c.activo !== false})">
          <i class="fas ${c.activo === false ? 'fa-check' : 'fa-ban'}"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

function nuevo(){ limpiar(); window.scrollTo({top:0, behavior:'smooth'}); document.getElementById('f_codigo').focus(); }

function limpiar(){
  editId = null;
  document.getElementById('formTitle').textContent = 'Nuevo Cliente';
  ['f_codigo','f_nombre','f_rfc','f_planta','f_contacto','f_tel','f_email','f_obs'].forEach(k => {
    const el = document.getElementById(k);
    if (el) el.value = '';
  });
  document.getElementById('f_dias').value = 1;
}

function editar(id){
  const c = lista.find(x => x.id === id);
  if (!c) return;
  editId = c.id;
  document.getElementById('formTitle').textContent = 'Editar Cliente: ' + c.codigo;
  document.getElementById('f_codigo').value = c.codigo || '';
  document.getElementById('f_nombre').value = c.nombre || '';
  if (document.getElementById('f_rfc')) document.getElementById('f_rfc').value = c.rfc || '';
  document.getElementById('f_planta').value = c.planta || '';
  document.getElementById('f_contacto').value = c.contacto || '';
  document.getElementById('f_tel').value = c.telefono || '';
  document.getElementById('f_email').value = c.email || '';
  document.getElementById('f_dias').value = c.dias_transito ?? 1;
  document.getElementById('f_obs').value = c.observaciones || '';
  window.scrollTo({top:0, behavior:'smooth'});
}

async function guardar(){
  const codigo = val('f_codigo').toUpperCase();
  const nombre = val('f_nombre');
  if (!codigo || !nombre) return alert('Código y nombre del cliente son obligatorios.');

  const payload = {
    codigo, nombre,
    rfc: (document.getElementById('f_rfc') ? val('f_rfc').toUpperCase() : null) || null,
    planta: val('f_planta') || null,
    contacto: val('f_contacto') || null,
    telefono: val('f_tel') || null,
    email: val('f_email') || null,
    dias_transito: Number(document.getElementById('f_dias').value) || 0,
    observaciones: val('f_obs') || null,
    updated_at: new Date().toISOString()
  };

  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  const res = editId
    ? await client.from('clientes').update(payload).eq('id', editId)
    : await client.from('clientes').insert([{ ...payload, activo: true }]);
  btn.disabled = false;

  if (res.error) return alert('Error: ' + res.error.message);
  limpiar();
  await cargar();
}

async function toggle(id, actual){
  if (!confirm(`¿Deseas ${actual ? 'desactivar' : 'activar'} este cliente?`)) return;
  const { error } = await client.from('clientes').update({ activo: !actual }).eq('id', id);
  if (error) return alert(error.message);
  await cargar();
}

document.addEventListener('DOMContentLoaded', cargar);
</script>
</body>
</html>
