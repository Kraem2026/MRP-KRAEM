<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRAEM | Auditoría 5S</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root{
            --primary:#2563eb;
            --success:#22c55e;
            --warning:#f59e0b;
            --danger:#ef4444;
            --bg:#f8fafc;
            --text:#1e293b;
            --border:#e2e8f0;
        }
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family:'Segoe UI',sans-serif;
            background:var(--bg);
            color:var(--text);
            padding:15px;
        }
        .container{
            max-width:550px;
            margin:auto;
            background:white;
            border-radius:18px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
            padding:20px;
            min-height:85vh;
            display:flex;
            flex-direction:column;
        }
        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            border-bottom:2px solid var(--bg);
            padding-bottom:12px;
        }
        .btn-back{
            background:none;
            border:none;
            color:var(--primary);
            font-weight:bold;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:6px;
            font-size:14px;
        }
        .setup-group{
            display:grid;
            gap:14px;
            margin-bottom:20px;
        }
        label{
            font-size:11px;
            font-weight:bold;
            color:var(--primary);
            text-transform:uppercase;
            margin-bottom:-8px;
        }
        select, textarea, input[type="checkbox"]{
            width:100%;
            padding:12px;
            border:1px solid var(--border);
            border-radius:10px;
            font-size:14px;
            background:white;
            font-family:inherit;
            outline:none;
        }
        select:focus, textarea:focus{
            border-color:var(--primary);
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-container input {
            width: auto;
            transform: scale(1.2);
        }
        .progress-container{
            background:#e5e7eb;
            border-radius:10px;
            height:10px;
            margin-bottom:20px;
            overflow:hidden;
        }
        .progress-bar{
            background:var(--primary);
            height:100%;
            width:0%;
            transition:.3s;
        }
        .question-card{
            background:var(--bg);
            padding:15px;
            border-radius:14px;
            margin-bottom:12px;
            border-left:5px solid var(--primary);
            transition: border-color 0.3s;
        }
        .question-card.jig-card {
            border-left-color: var(--warning);
            background: #fffbeb;
        }
        .options{
            display:flex;
            gap:8px;
            margin-top:12px;
        }
        .btn-opt{
            flex:1;
            padding:10px;
            border:2px solid var(--border);
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
            background:white;
            font-size:11px;
            transition:.2s;
        }
        .btn-opt.active[data-score="1"]{
            background:var(--success)!important;
            color:white;
            border-color:#16a34a;
        }
        .btn-opt.active[data-score="0.5"]{
            background:var(--warning)!important;
            color:white;
            border-color:#d97706;
        }
        .btn-opt.active[data-score="0"]{
            background:var(--danger)!important;
            color:white;
            border-color:#dc2626;
        }
        .btn-nav{
            padding:15px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            font-weight:bold;
            width:100%;
            font-size:16px;
            background:var(--primary);
            color:white;
            transition:.2s;
        }
        .btn-nav:hover{
            opacity:.95;
        }
        .hidden{
            display:none !important;
        }
        #score-badge{
            font-size:4rem;
            font-weight:900;
            text-align:center;
            color:var(--primary);
            margin:25px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="btn-back" id="header-back-btn" onclick="prevStep()">
            <i class="fas fa-arrow-left"></i> <span id="back-text">Panel</span>
        </button>
        <h3 style="margin:0;">Auditoría 5S</h3>
    </header>

    <div id="step-setup">
        <div class="setup-group">
            <label>Tipo de Auditoría</label>
            <select id="tipo_auditoria" onchange="cambioTipoAuditoria()">
                <option value="estacion">Estación de Trabajo / Operador</option>
                <option value="maquina">Máquina de Inyección (Mtto / Planta)</option>
            </select>

            <label>Área General</label>
            <select id="area_select" onchange="cambioFiltros()">
                <option value="">Cargando...</option>
            </select>

            <label>Turno</label>
            <select id="turno_select" onchange="cambioFiltros()">
                <option value="">Cargando...</option>
            </select>

            <label>Máquina</label>
            <select id="maquina_select">
                <option value="">Seleccione área...</option>
            </select>

            <label id="label_operador">Operador</label>
            <select id="operador_select">
                <option value="">Seleccione área y turno...</option>
            </select>

            <label>Auditor (Lista Completa por Turno)</label>
            <select id="auditor_select">
                <option value="">Cargando...</option>
            </select>

            <div id="jig_toggle_container" style="margin-top: 5px;">
                <label class="checkbox-container">
                    <input type="checkbox" id="aplica_jigs">
                    <span>¿Aplica uso de Jigs / Dispositivos en la estación?</span>
                </label>
            </div>
        </div>

        <button class="btn-nav" onclick="nextStep()">EMPEZAR AUDITORÍA</button>
    </div>

    <div id="audit-flow" class="hidden">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="section-label" style="font-weight:bold; color:var(--primary); text-align:center; margin-bottom:15px; font-size:1.2rem;"></div>

        <div id="preguntas_cont"></div>

        <div style="margin-top:20px;">
            <label>Observaciones de esta sección</label>
            <textarea id="obs_input" rows="3" placeholder="Hallazgos, mejoras, problemas detectados..."></textarea>
        </div>

        <button class="btn-nav" style="margin-top:20px;" onclick="nextStep()">SIGUIENTE</button>
    </div>

    <div id="step-result" class="hidden">
        <div style="text-align:center; font-weight:bold; font-size:1.2rem;">RESULTADO FINAL</div>
        <div id="score-badge">0%</div>
        <button class="btn-nav" style="background:var(--success)" onclick="guardar()">
            <i class="fas fa-save"></i> GUARDAR AUDITORÍA
        </button>
    </div>
</div>

<script>
let currentStep = 0;
let auditData = {
    respuestas: {},
    observaciones: {},
    score: 0
};

let listaEmpleados = [];
let listaTurnos = [];

const nombres5S = [
    "1. SEIRI (Clasificar)",
    "2. SEITON (Ordenar)",
    "3. SEISO (Limpiar)",
    "4. SEIKETSU (Estandarizar)",
    "5. SHITSUKE (Disciplina)"
];

// 1. MATRIZ: Estación de Trabajo tradicional
const preguntasEstacion = [
    ["¿Solo material necesario?", "¿Scrap identificado?", "¿Sin objetos innecesarios?", "¿Herramientas en uso?", "¿Mesa despejada?"],
    ["¿Herramientas en su lugar?", "¿Material en su lugar?", "¿Área libre de obstáculos?", "¿Contenedores correctamente identificados?", "¿Instrucciones visibles?"],
    ["¿Área libre de polvo?", "¿Piso limpio?", "¿Contenedores limpios?", "¿Máquina limpia?", "¿Mesa limpia?"],
    ["¿Instrucciones actualizadas?", "¿Uso de uniforme?", "¿Etiquetas correctas?", "¿Área delimitada?", "¿Cumple estándar?"],
    ["¿Hábito de limpieza?", "¿Sigue instrucciones?", "¿Respeta ubicación?", "¿Reporta anomalías?", "¿Conoce 5S?"]
];

// PREGUNTAS EXTRA DE JIGS
const preguntasJigs = [
    "¿Solo Jigs de producción actual en uso? (Sin Jigs obsoletos/ajenos)",
    "¿Jigs guardados en su ubicación asignada o soporte correcto?",
    "¿Jigs limpios de residuos, y conectores/sensores libres de grasa/polvo?",
    "¿Jigs identificados/etiquetados y con cables/conexiones en buen estado?",
    "¿El operador reporta fallas en sensores de Jigs y los maneja con cuidado?"
];

// 2. MATRIZ: Máquinas de Inyección (Enfoque Técnico y de Mantenimiento)
const preguntasMaquina = [
    ["¿Área de máquina libre de refacciones viejas, moldes o mangueras sin usar?", "¿Purga de plástico retirada del área de goteo?", "¿Herramientas de cambio de molde ausentes si no está en Setup?", "¿Herramientas del operador guardadas?", "¿Sin documentos obsoletos en tablero?"],
    ["¿Mangueras de agua/aceite ordenadas y sin riesgo de tropiezo?", "¿Contenedores de materia prima (Tolva/Alimentador) bien ubicados?", "¿Hieleras, racks de producto y tarimas alineados en su delimitación?", "¿Pistolas de aire y herramientas colgadas en su sitio?", "¿Paros de emergencia accesibles y sin obstrucción?"],
    ["¿Piso e interior de la máquina libres de fugas de aceite o agua?", "¿Estructura, tolva y guardas libres de polvo o residuos de resina?", "¿Unidad de inyección, pistón y husillo limpios de purgas quemadas?", "¿Bandejas de goteo limpias y sin desborde?", "¿Tablero eléctrico y pantallas limpios y cerrados?"],
    ["¿Hojas de parámetros y ayudas visuales legibles y vigentes en la máquina?", "¿Puntos de lubricación identificados y con niveles correctos?", "¿Código de colores visible en mangueras de enfriamiento?", "¿Delimitación de seguridad del perímetro de la máquina en buen estado?", "¿Checklist diario de máquina liberado por operador/mtto?"],
    ["¿El personal limpia la máquina al terminar el turno?", "¿Se respetan los accesos de mantenimiento sin dejar obstrucciones?", "¿Se reportan y atienden fugas críticas de inmediato?", "¿Se usan los botes de basura correctos para purgas/residuos?", "¿El equipo de mtto/producción sigue el estándar de orden de la máquina?"]
];

async function init(){
    try{
        const { data: areas, error: errAreas } = await client.from('areas_generales').select('*').eq('active', true).order('nombre');
        if(errAreas) throw errAreas;
        document.getElementById('area_select').innerHTML = '<option value="">Seleccione...</option>' + areas.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');

        const { data: turnos, error: errTurnos } = await client.from('rh_turnos').select('*').order('nombre');
        if(errTurnos) throw errTurnos;
        listaTurnos = turnos;
        document.getElementById('turno_select').innerHTML = '<option value="">Seleccione...</option>' + turnos.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');

        const { data: emps, error: errEmp } = await client.from('rh_empleados').select('*').eq('estatus', 'ACTIVO').order('nombre_completo');
        if(errEmp) throw errEmp;
        listaEmpleados = emps;

        filtrarOperadores();
        cargarAuditorCompleto();
    }catch(e){
        console.error(e);
        alert(e.message);
    }
}

function cambioTipoAuditoria() {
    const tipo = document.getElementById('tipo_auditoria').value;
    const jigToggle = document.getElementById('jig_toggle_container');
    const opSel = document.getElementById('operador_select');
    const opLabel = document.getElementById('label_operador');

    if (tipo === 'maquina') {
        jigToggle.classList.add('hidden');
        document.getElementById('aplica_jigs').checked = false;
        opLabel.innerText = "Operador de Máquina / Líder responsable";
    } else {
        jigToggle.classList.remove('hidden');
        opLabel.innerText = "Operador";
    }
}

function cambioFiltros() {
    actualizarMaquinas();
    filtrarOperadores();
}

async function actualizarMaquinas(){
    const areaId = document.getElementById('area_select').value;
    const mSel = document.getElementById('maquina_select');
    mSel.innerHTML = '<option value="">Cargando...</option>';

    if(!areaId){
        mSel.innerHTML = '<option value="">Seleccione área...</option>';
        return;
    }
    try{
        const { data: maquinas, error } = await client.from('mes_machines').select('*').eq('area_general_id', areaId).eq('active', true).eq('maintenance_status', 'Disponible').order('machine_code');
        if(error) throw error;

        mSel.innerHTML = '<option value="">Seleccione...</option>';
        maquinas.forEach(m => {
            mSel.innerHTML += `<option value="${m.id}">${m.machine_code} - ${m.machine_name} (${m.tonnage || '-'} TON)</option>`;
        });
    }catch(e){
        console.error(e);
        mSel.innerHTML = '<option value="">Error cargando</option>';
    }
}

function filtrarOperadores(){
    const areaId = document.getElementById('area_select').value;
    const turnoUuid = document.getElementById('turno_select').value;
    const opSel = document.getElementById('operador_select');

    if(!areaId || !turnoUuid){
        opSel.innerHTML = '<option value="">Seleccione área y turno...</option>';
        return;
    }

    const turnoObj = listaTurnos.find(t => String(t.id) === String(turnoUuid));
    const nombreTurno = turnoObj ? turnoObj.nombre : '';
    const turnoNumerico = nombreTurno.includes('2') ? '2' : (nombreTurno.includes('1') ? '1' : '');

    const filtrados = listaEmpleados.filter(e => 
        String(e.area_general_id || '') === String(areaId) && 
        String(e.turno_id || '') === String(turnoNumerico)
    );

    if(filtrados.length === 0){
        opSel.innerHTML = '<option value="">Sin personal en esta combinación</option>';
    } else {
        opSel.innerHTML = '<option value="">Seleccione...</option>' + filtrados.map(e => `<option value="${e.id}">${e.nombre_completo}</option>`).join('');
    }
}

function cargarAuditorCompleto(){
    const audSel = document.getElementById('auditor_select');
    let html = '<option value="">Seleccione...</option>';

    listaTurnos.forEach(turno => {
        const turnoNumerico = turno.nombre.includes('2') ? '2' : (turno.nombre.includes('1') ? '1' : 'OTRO');
        const empsDelTurno = listaEmpleados.filter(e => String(e.turno_id || '') === String(turnoNumerico));
        
        if(empsDelTurno.length > 0){
            html += `<optgroup label="${turno.nombre}">`;
            html += empsDelTurno.map(e => `<option value="${e.id}">${e.nombre_completo}</option>`).join('');
            html += `</optgroup>`;
        }
    });

    const sinTurno = listaEmpleados.filter(e => !e.turno_id || (e.turno_id !== '1' && e.turno_id !== '2'));
    if(sinTurno.length > 0 && listaTurnos.length === 0){
        html += `<optgroup label="Todos los Empleados">`;
        html += sinTurno.map(e => `<option value="${e.id}">${e.nombre_completo}</option>`).join('');
        html += `</optgroup>`;
    }

    audSel.innerHTML = html;
}

function nextStep(){
    // Validar datos de inicio
    if(currentStep === 0 && (
        !document.getElementById('area_select').value || 
        !document.getElementById('turno_select').value || 
        !document.getElementById('maquina_select').value || 
        !document.getElementById('operador_select').value || 
        !document.getElementById('auditor_select').value
    )){
        return alert("Faltan datos obligatorios para iniciar.");
    }

    // Validar que todas las preguntas de la S actual estén contestadas
    if(currentStep > 0 && currentStep <= 5){
        const idx = currentStep - 1;
        const tipo = document.getElementById('tipo_auditoria').value;
        const aplicaJigs = document.getElementById('aplica_jigs').checked;
        const preguntasActuales = (tipo === 'maquina') ? preguntasMaquina[idx] : preguntasEstacion[idx];

        // Verificar preguntas estándar
        for (let j = 0; j < preguntasActuales.length; j++) {
            const clave = `${idx}_${j}`;
            if (auditData.respuestas[clave] === undefined) {
                return alert(`⚠️ Debes responder la pregunta ${j + 1} para continuar.`);
            }
        }

        // Verificar pregunta de Jigs si aplica
        if (tipo === 'estacion' && aplicaJigs) {
            const claveJig = `${idx}_jig`;
            if (auditData.respuestas[claveJig] === undefined) {
                return alert(`⚠️ Debes responder la pregunta de Control de Jigs para continuar.`);
            }
        }

        // Guardar observaciones
        auditData.observaciones[`s${currentStep}`] = document.getElementById('obs_input').value;
    }

    currentStep++;
    render();
}

function prevStep(){
    if(currentStep === 0){
        location.href='dashboard.html';
        return;
    }
    currentStep--;
    render();
}

function render(){
    document.getElementById("step-setup").classList.add("hidden");
    document.getElementById("audit-flow").classList.add("hidden");
    document.getElementById("step-result").classList.add("hidden");

    const backText = document.getElementById('back-text');
    const backIcon = document.querySelector('#header-back-btn i');

    const tipo = document.getElementById('tipo_auditoria').value;
    const aplicaJigs = document.getElementById('aplica_jigs').checked;
    
    const matrizPreguntas = (tipo === 'maquina') ? preguntasMaquina : preguntasEstacion;

    if(currentStep === 0){
        document.getElementById("step-setup").classList.remove("hidden");
        backText.innerText = "Panel";
        backIcon.className = "fas fa-th-large";
    }
    else if(currentStep <= 5){
        document.getElementById("audit-flow").classList.remove("hidden");
        backText.innerText = "Atrás";
        backIcon.className = "fas fa-arrow-left";

        const idx = currentStep - 1;
        document.getElementById("section-label").innerText = nombres5S[idx];
        document.getElementById("progress-bar").style.width = (currentStep * 20) + "%";
        document.getElementById('obs_input').value = auditData.observaciones[`s${currentStep}`] || "";

        let htmlPreguntas = matrizPreguntas[idx].map((p, j) => {
            const respuestaGuardada = auditData.respuestas[`${idx}_${j}`];
            return `
                <div class="question-card">
                    <div style="font-weight:600">${j + 1}. ${p}</div>
                    <div class="options">
                        <button class="btn-opt ${respuestaGuardada === 1 ? 'active' : ''}" data-score="1" onclick="setAns('${idx}_${j}',1,this)">SI</button>
                        <button class="btn-opt ${respuestaGuardada === 0.5 ? 'active' : ''}" data-score="0.5" onclick="setAns('${idx}_${j}',0.5,this)">PARCIAL</button>
                        <button class="btn-opt ${respuestaGuardada === 0 ? 'active' : ''}" data-score="0" onclick="setAns('${idx}_${j}',0,this)">NO</button>
                    </div>
                </div>`;
        }).join('');

        if (tipo === 'estacion' && aplicaJigs) {
            const respuestaJigGuardada = auditData.respuestas[`${idx}_jig`];
            htmlPreguntas += `
                <div class="question-card jig-card">
                    <div style="font-weight:bold; color:#d97706;"><i class="fas fa-tools"></i> CONTROL DE JIGS:</div>
                    <div style="font-weight:600; margin-top:4px;">${preguntasJigs[idx]}</div>
                    <div class="options">
                        <button class="btn-opt ${respuestaJigGuardada === 1 ? 'active' : ''}" data-score="1" onclick="setAns('${idx}_jig',1,this)">SI</button>
                        <button class="btn-opt ${respuestaJigGuardada === 0.5 ? 'active' : ''}" data-score="0.5" onclick="setAns('${idx}_jig',0.5,this)">PARCIAL</button>
                        <button class="btn-opt ${respuestaJigGuardada === 0 ? 'active' : ''}" data-score="0" onclick="setAns('${idx}_jig',0,this)">NO</button>
                    </div>
                </div>`;
        }

        document.getElementById("preguntas_cont").innerHTML = htmlPreguntas;
        window.scrollTo(0,0);
    }
    else{
        backText.innerText = "Atrás";
        backIcon.className = "fas fa-arrow-left";

        const vals = Object.values(auditData.respuestas);
        const totalPreguntas = aplicaJigs ? 30 : 25; 
        
        auditData.score = Math.round((vals.reduce((a,b)=>a+b,0) / totalPreguntas) * 100);

        document.getElementById("score-badge").innerText = auditData.score + "%";
        document.getElementById("step-result").classList.remove("hidden");
    }
}

function setAns(id, v, btn){
    const parent = btn.parentElement;
    parent.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    auditData.respuestas[id] = v;
}

async function guardar(){
    try{
        const { error } = await client.from('rh_evaluaciones_5s').insert([{
            empleado_id: document.getElementById('operador_select').value,
            auditor_id: document.getElementById('auditor_select').value,
            area_general_id: document.getElementById('area_select').value,
            turno_id: document.getElementById('turno_select').value,
            machine_id: document.getElementById('maquina_select').value,
            puntuacion: auditData.score,
            respuestas_json: auditData.respuestas,
            observaciones: auditData.observaciones,
            tipo_auditoria: document.getElementById('tipo_auditoria').value,
            created_at: new Date().toISOString()
        }]);

        if(error) throw error;
        alert("¡Auditoría guardada con éxito!");
        location.href = 'rh_evaluacion_5s.html';
    }catch(e){
        console.error(e);
        alert(e.message);
    }
}

window.onload = init;
</script>
</body>
</html>
