<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAEM | Auditoría 5S</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{font-family:Arial;background:#f1f5f9;margin:0}
.container{max-width:500px;margin:auto;background:white;min-height:100vh;padding:20px}

.question{background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:10px}

.options{display:flex;gap:5px;margin-top:10px}

button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}

.si{background:#22c55e;color:white}
.parcial{background:#f59e0b;color:white}
.no{background:#ef4444;color:white}
</style>
</head>

<body>

<div class="container">

<h3>Auditoría 5S</h3>

<select id="area_select"></select>
<input id="maquina_input" placeholder="Máquina">
<select id="operador_select"></select>
<select id="auditor_select"></select>

<div id="preguntas"></div>

<h2 id="score">0%</h2>

<button onclick="guardar()">Guardar</button>

</div>

<script>

let data={respuestas:{}}

const secciones=[
["¿Área solo con material necesario?","¿Scrap en contenedor?","¿Sin objetos innecesarios?","¿Herramientas en uso?","¿Sin objetos personales?"],
["¿Herramientas en su lugar?","¿Cajas identificadas?","¿Sin obstáculos?","¿Material organizado?","¿Señalización correcta?"],
["¿Mesa limpia?","¿Parte inferior limpia?","¿Contenedores OK?","¿Piso limpio?","¿Limpieza constante?"],
["¿Estándares visibles?","¿Contenedores identificados?","¿Se siguen métodos?","¿Conoce proceso?","¿Cumple estándar?"],
["¿Conoce 5S?","¿Aplica 5S?","¿Usa EPP?","¿Corrige fallas?","¿Mantiene orden?"]
];

function crear(){
const cont=document.getElementById("preguntas")

secciones.forEach((s,i)=>{
s.forEach((p,j)=>{
const id=`${i}_${j}`
cont.innerHTML+=`
<div class="question">
${p}
<div class="options">
<button class="si" onclick="set('${id}',1)">Cumple</button>
<button class="parcial" onclick="set('${id}',0.5)">Parcial</button>
<button class="no" onclick="set('${id}',0)">No</button>
</div>
</div>`
})
})
}

function set(id,val){
data.respuestas[id]=val
calc()
}

function calc(){
const vals=Object.values(data.respuestas)
const total=vals.reduce((a,b)=>a+b,0)
const score=Math.round((total/vals.length)*100)||0
document.getElementById("score").innerText=score+"%"
data.score=score
}

async function cargar(){
const {data:a}=await client.from('rh_areas').select('*')
const {data:e}=await client.from('rh_empleados').select('*')

area_select.innerHTML='<option>Área</option>'
operador_select.innerHTML='<option>Operador</option>'
auditor_select.innerHTML='<option>Auditor</option>'

a.forEach(i=>area_select.innerHTML+=`<option value="${i.id}">${i.nombre}</option>`)
e.forEach(i=>{
operador_select.innerHTML+=`<option value="${i.id}">${i.nombre_completo}</option>`
auditor_select.innerHTML+=`<option value="${i.id}">${i.nombre_completo}</option>`
})
}

async function guardar(){
await client.from('rh_evaluaciones_5s').insert([{
empleado_id:operador_select.value,
auditor_id:auditor_select.value,
area_id:area_select.value,
maquina_id:maquina_input.value,
puntuacion:data.score,
respuestas_json:data.respuestas,
created_at:new Date().toISOString()
}])

alert("Guardado")
location.reload()
}

crear()
cargar()

</script>

</body>
</html>
