<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Despacho Sugerido FIFO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root { 
        --bg: #f4f6f8; --card: #ffffff; --text: #333333; --text-secondary: #7f8c8d;
        --border: #e2e8f0; --primary: #007bff; --success: #27ae60; --warning: #f39c12; --danger: #dc3545;
        --info: #17a2b8;
    }
    [data-theme="dark"] { 
        --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-secondary: #cbd5e1;
        --border: #334155; 
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding:15px; margin:0; color: var(--text); }
    
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background: var(--card); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); max-width:500px; margin: 0 auto 15px auto; }
    .btn-nav { background:#6c757d; color:white; border:none; padding:8px 15px; cursor:pointer; border-radius:8px; font-weight:bold; font-size:12px; }

    .container { max-width:500px; margin:auto; background:var(--card); padding:20px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-top: 20px; }
    h2 { text-align:center; margin-top:0; color: var(--text); }
    
    .tabs { display:flex; gap:5px; margin-bottom:15px; background: var(--bg); padding: 5px; border-radius: 10px; }
    .tabs button { flex:1; background: transparent; border:none; padding:10px 5px; cursor:pointer; font-size:10px; font-weight:bold; border-radius:8px; color: var(--text-secondary); transition: 0.2s; white-space: nowrap; }
    .tabs button.active { background:var(--primary); color:white; box-shadow: 0 4px 10px rgba(0,123,255,0.3); }

    label { font-weight:800; display:block; margin-top:15px; font-size:11px; color: var(--text-secondary); text-transform: uppercase; }
    
    .input-with-btn { display: flex; gap: 5px; align-items: center; }
    input { width:100%; padding:12px; margin-top:5px; border-radius:8px; border:1px solid var(--border); font-size:15px; box-sizing:border-box; background: var(--bg); color: var(--text); }
    .btn-qr { background: var(--primary); color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 5px; height: 47px; box-sizing: border-box; }

    .autobox { background:var(--card); border:1px solid var(--border); position:absolute; width:100%; z-index:1000; max-height:200px; overflow-y:auto; display:none; border-radius:0 0 8px 8px; box-shadow:0 10px 20px rgba(0,0,0,0.1); }
    .autobox div { padding:12px; cursor:pointer; border-bottom:1px solid var(--border); font-size:14px; }
    .autobox div:hover { background: var(--bg); color: var(--primary); }
    
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-top: 15px; }
    .btn-excel { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
    .btn-excel:hover { background: #219653; transform: translateY(-1px); }

    .fifo-card { background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-top: 10px; position: relative; border-left: 5px solid var(--primary); }
    .fifo-card.oldest { border-left: 5px solid var(--warning); background: rgba(243, 156, 18, 0.05); border: 1px solid var(--warning); border-left: 6px solid var(--warning); }
    .badge-status { position: absolute; top: 10px; right: 10px; background: var(--warning); color: white; padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .part-title { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
    .part-desc { font-size: 12px; color: var(--text-secondary); font-style: italic; margin-bottom: 8px; }
    
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .info-block { display: flex; flex-direction: column; }
    .info-label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); font-weight: bold; }
    .info-value { font-size: 14px; font-weight: bold; margin-top: 2px; }

    .loc-info { color: var(--primary); font-weight: bold; }
    .qty-info { font-size: 22px; font-weight: bold; color: var(--success); text-align: right; grid-column: 2; margin-top: -5px; }

    .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:2000; backdrop-filter: blur(4px); }
    .modal-content { background:var(--card); padding:25px; border-radius:15px; width:90%; max-width:400px; color: var(--text); border: 1px solid var(--border); }
    #reader { width: 100%; background: black; border-radius: 8px; overflow: hidden; margin-top: 10px; }
</style>
</head>
<body>

<header>
    <button class="btn-nav" onclick="location.href='dashboard.html'">⬅ <span>Volver</span></button>
    <div style="font-weight: bold; font-size: 13px; color: var(--text-secondary);">KRAEM MRP</div>
</header>

<div class="container">
    <h2><i class="fas fa-boxes"></i> Consulta de Inventario</h2>
    
    <div class="tabs">
        <button id="tabPARTE" class="active" onclick="cambiarModo('PARTE')"><i class="fas fa-barcode"></i> P/N FIFO</button>
        <button id="tabUBICACION" onclick="cambiarModo('UBICACION')"><i class="fas fa-map-marker-alt"></i> UBICACIÓN FIJA</button>
        <button id="tabCARRITO" onclick="cambiarModo('CARRITO')"><i class="fas fa-truck-loading"></i> CARRITO MÓVIL</button>
    </div>
    
    <!-- MODO 1: NÚMERO DE PARTE -->
    <div id="divBusquedaParte" style="position:relative;">
        <label>Escribe o Escanea Número de Parte</label>
        <div class="input-with-btn">
            <input id="partSearch" placeholder="Ej: KRM-1023..." autocomplete="off">
            <button class="btn-qr" onclick="abrirEscaner()"><i class="fas fa-camera"></i></button>
        </div>
        <div id="partResults" class="autobox"></div>
    </div>

    <!-- MODO 2: UBICACIÓN FIJA (NUEVO) -->
    <div id="divBusquedaUbicacion" style="position:relative; display:none;">
        <label>Escribe o Escanea Localidad Fija</label>
        <div class="input-with-btn">
            <input id="locSearch" placeholder="Ej: RACK-A1, ESTANTE-02..." autocomplete="off">
            <button class="btn-qr" onclick="abrirEscaner()"><i class="fas fa-camera"></i></button>
        </div>
        <div id="locResults" class="autobox"></div>
    </div>

    <!-- MODO 3: CARRITO MÓVIL -->
    <div id="divBusquedaCarrito" style="position:relative; display:none;">
        <label>Escribe o Escanea Código de Carrito / Contenedor</label>
        <div class="input-with-btn">
            <input id="cartSearch" placeholder="Ej: CART-01..." autocomplete="off">
            <button class="btn-qr" onclick="abrirEscaner()"><i class="fas fa-camera"></i></button>
        </div>
        <div id="cartResults" class="autobox"></div>
    </div>

    <div id="resultadoDespacho" style="margin-top: 20px;"></div>
</div>

<div id="modalQR" class="modal" onclick="if(event.target==this)cerrarEscaner()">
    <div class="modal-content">
        <h3 style="margin-top:0; text-align:center;">Escaneando Código QR</h3>
        <div id="reader"></div>
        <button onclick="cerrarEscaner()" style="margin-top:15px; width:100%; background:var(--danger); color:white; border:none; padding:12px; cursor:pointer; font-weight:bold; border-radius:8px;">Cancelar</button>
    </div>
</div>

<script>
const _client = supabase.createClient('https://telntsrrschcdxczlape.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbG50c3Jyc2NoY2R4Y3psYXBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4NjI4MTcsImV4cCI6MjA4MDQzODgxN30.DC2teZ_4gk3wA7UmZJHyeZHjw5aOOEmmKvd3a8jRUyw');

let parts = [];
let containers = [];
let fixedLocations = []; // Catálogo de ubicaciones fijas
let modoConsulta = 'PARTE'; 
let html5QrcodeScanner = null;
let ultimoInventarioBuscado = [];
let ultimoCriterioBuscado = '';

async function cargarCatalogos() {
    const {data: p} = await _client.from('parts').select('id, part_number, description').limit(2000);
    if(p) parts = p;

    // 1. Carritos Móviles o Contenedores
    const {data: c} = await _client.from('locations').select('id, location_code, type').or('type.eq.Móvil,type.eq.Contenedor');
    if(c) containers = c;

    // 2. Ubicaciones Fijas (Se excluyen las de tipo Móvil o Contenedor)
    const {data: l} = await _client.from('locations').select('id, location_code, type').not('type', 'in', '("Móvil","Contenedor")');
    if(l) fixedLocations = l;
}
cargarCatalogos();

function cambiarModo(modo) {
    modoConsulta = modo;
    document.getElementById('tabPARTE').classList.toggle('active', modo === 'PARTE');
    document.getElementById('tabUBICACION').classList.toggle('active', modo === 'UBICACION');
    document.getElementById('tabCARRITO').classList.toggle('active', modo === 'CARRITO');
    
    document.getElementById('divBusquedaParte').style.display = modo === 'PARTE' ? 'block' : 'none';
    document.getElementById('divBusquedaUbicacion').style.display = modo === 'UBICACION' ? 'block' : 'none';
    document.getElementById('divBusquedaCarrito').style.display = modo === 'CARRITO' ? 'block' : 'none';
    
    document.getElementById('resultadoDespacho').innerHTML = '';
}

// Autocompletado Número de Parte
partSearch.oninput = () => {
    const v = partSearch.value.toUpperCase();
    partResults.innerHTML = '';
    if(!v) { partResults.style.display = 'none'; return; }
    
    const m = parts.filter(p => p.part_number.toUpperCase().includes(v) || (p.description && p.description.toUpperCase().includes(v))).slice(0,8);
    m.forEach(p => {
        const d = document.createElement('div');
        d.innerHTML = `<b>${p.part_number}</b> <span style="font-size:11px; color:var(--text-secondary)">- ${p.description || 'Sin descripción'}</span>`;
        d.onclick = () => {
            partSearch.value = p.part_number;
            partResults.style.display = 'none';
            buscarEstrategiaFIFO(p.id, p.part_number, p.description);
        };
        partResults.appendChild(d);
    });
    partResults.style.display = m.length ? 'block' : 'none';
};

// Autocompletado Ubicaciones Fijas (Nuevo)
locSearch.oninput = () => {
    const v = locSearch.value.toUpperCase();
    locResults.innerHTML = '';
    if(!v) { locResults.style.display = 'none'; return; }
    const m = fixedLocations.filter(l => l.location_code.toUpperCase().includes(v)).slice(0,8);
    m.forEach(l => {
        const d = document.createElement('div');
        d.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${l.location_code}`;
        d.onclick = () => {
            locSearch.value = l.location_code;
            locResults.style.display = 'none';
            buscarContenidoUbicacion(l.location_code);
        };
        locResults.appendChild(d);
    });
    locResults.style.display = m.length ? 'block' : 'none';
};

// Autocompletado Carritos
cartSearch.oninput = () => {
    const v = cartSearch.value.toUpperCase();
    cartResults.innerHTML = '';
    if(!v) { cartResults.style.display = 'none'; return; }
    const m = containers.filter(c => c.location_code.includes(v)).slice(0,8);
    m.forEach(c => {
        const d = document.createElement('div');
        d.innerHTML = `<i class="fas fa-truck-loading"></i> ${c.location_code}`;
        d.onclick = () => {
            cartSearch.value = c.location_code;
            cartResults.style.display = 'none';
            buscarContenidoCarrito(c.id, c.location_code);
        };
        cartResults.appendChild(d);
    });
    cartResults.style.display = m.length ? 'block' : 'none';
};

document.addEventListener('click', function(e) {
    if (e.target.id !== 'partSearch') partResults.style.display = 'none';
    if (e.target.id !== 'locSearch') locResults.style.display = 'none';
    if (e.target.id !== 'cartSearch') cartResults.style.display = 'none';
});

// CONSULTA 1: ESTRATEGIA FIFO POR PARTE
async function buscarEstrategiaFIFO(partId, partNumber, partDesc) {
    const divResultados = document.getElementById('resultadoDespacho');
    divResultados.innerHTML = '<p style="text-align:center;">Buscando en almacenes y carritos...</p>';
    
    ultimoCriterioBuscado = partNumber;
    const { data: inventario, error } = await _client
        .from('v_inventory_by_location')
        .select('*')
        .eq('part_id', partId)
        .gt('quantity', 0)
        .order('lot_number', { ascending: true });

    if (error || !inventario || inventario.length === 0) {
        divResultados.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--danger); font-weight: bold;">❌ No hay existencias de la parte ${partNumber}.</div>`;
        return;
    }

    const descripcionFinal = partDesc || inventario[0].part_name || 'Sin descripción disponible';
    ultimoInventarioBuscado = inventario;
    
    divResultados.innerHTML = `
        <div class="results-header">
            <h3 style="font-size:12px; text-transform:uppercase; color: var(--text-secondary); margin:0;">Ruta FIFO sugerida:</h3>
            <button class="btn-excel" onclick="descargarExcel()"><i class="fas fa-file-excel"></i> Descargar Excel</button>
        </div>
    `;

    inventario.forEach((item, index) => {
        const esPrimero = index === 0;
        const card = document.createElement('div');
        card.className = `fifo-card ${esPrimero ? 'oldest' : ''}`;
        card.innerHTML = `
            ${esPrimero ? '<span class="badge-status"><i class="fas fa-exclamation-triangle"></i> ¡TOMAR PRIMERO (FIFO)!</span>' : ''}
            <div class="part-title">${partNumber}</div>
            <div class="part-desc">${descripcionFinal}</div>
            <div class="info-grid">
                <div class="info-block"><span class="info-label">📍 Ubicación Fija</span><span class="info-value loc-info">${item.location || 'Área Común'}</span></div>
                <div class="info-block"><span class="info-label">🛒 Contenedor / Carro</span><span class="info-value" style="color:#e67e22;"><i class="fas fa-truck-loading"></i> ${item.container_code || 'N/A (Suelto)'}</span></div>
                <div class="info-block"><span class="info-label">🔢 Número de Lote</span><span class="info-value">${item.lot_number || 'Sin Lote'}</span></div>
                <div class="qty-info"><span class="info-label" style="display:block; font-size:9px; text-align:right;">CANTIDAD</span>${item.quantity.toLocaleString()} pzas</div>
            </div>
        `;
        divResultados.appendChild(card);
    });
}

// CONSULTA 2: CONTENIDO ESPECÍFICO DE UNA UBICACIÓN FIJA (NUEVO)
async function buscarContenidoUbicacion(locationCode) {
    const divResultados = document.getElementById('resultadoDespacho');
    divResultados.innerHTML = '<p style="text-align:center;">Verificando materiales en la ubicación fija...</p>';
    
    ultimoCriterioBuscado = locationCode;
    const { data: inventario, error } = await _client
        .from('v_inventory_by_location')
        .select('*')
        .eq('location', locationCode)
        .gt('quantity', 0)
        .order('part_number', { ascending: true });

    if (error || !inventario || inventario.length === 0) {
        divResultados.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--warning); font-weight: bold;">📍 La ubicación fija [${locationCode}] está VACÍA actualmente en sistema.</div>`;
        return;
    }

    ultimoInventarioBuscado = inventario;
    divResultados.innerHTML = `
        <div class="results-header">
            <h3 style="font-size:12px; text-transform:uppercase; color: var(--text-secondary); margin:0;">Materiales en esta Ubicación:</h3>
            <button class="btn-excel" onclick="descargarExcel()"><i class="fas fa-file-excel"></i> Descargar Excel</button>
        </div>
    `;

    inventario.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'fifo-card';
        card.style.borderLeft = '5px solid var(--info)';
        card.innerHTML = `
            <div class="part-title"><i class="fas fa-cube"></i> P/N: ${item.part_number}</div>
            <div class="part-desc">${item.part_name || 'Sin descripción disponible'}</div>
            <div class="info-grid">
                <div class="info-block"><span class="info-label">🛒 Contenedor / Carro</span><span class="info-value" style="color:#e67e22;"><i class="fas fa-truck-loading"></i> ${item.container_code || 'N/A (Suelto)'}</span></div>
                <div class="info-block"><span class="info-label">🔢 Lote del Material</span><span class="info-value">${item.lot_number || 'Sin Lote'}</span></div>
                <div class="info-block"><span class="info-label">🏭 Área</span><span class="info-value" style="font-size:12px;">${item.area || 'N/A'}</span></div>
                <div class="qty-info"><span class="info-label" style="display:block; font-size:9px; text-align:right;">CANTIDAD</span>${item.quantity.toLocaleString()} pzas</div>
            </div>
        `;
        divResultados.appendChild(card);
    });
}

// CONSULTA 3: CONTENIDO ESPECÍFICO DE UN CARRITO
async function buscarContenidoCarrito(containerId, containerCode) {
    const divResultados = document.getElementById('resultadoDespacho');
    divResultados.innerHTML = '<p style="text-align:center;">Verificando carga del carrito...</p>';
    
    ultimoCriterioBuscado = containerCode;
    const { data: inventario, error } = await _client
        .from('v_inventory_by_location')
        .select('*')
        .eq('container_id', containerId)
        .gt('quantity', 0)
        .order('lot_number', { ascending: true });

    if (error || !inventario || inventario.length === 0) {
        divResultados.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--warning); font-weight: bold;">🛒 El carrito [${containerCode}] está VACÍO actualmente en sistema.</div>`;
        return;
    }

    ultimoInventarioBuscado = inventario;
    divResultados.innerHTML = `
        <div class="results-header">
            <h3 style="font-size:12px; text-transform:uppercase; color: var(--text-secondary); margin:0;">Materiales en este Carrito:</h3>
            <button class="btn-excel" onclick="descargarExcel()"><i class="fas fa-file-excel"></i> Descargar Excel</button>
        </div>
    `;

    inventario.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'fifo-card';
        card.style.borderLeft = '5px solid #e67e22';
        card.innerHTML = `
            <div class="part-title"><i class="fas fa-cube"></i> P/N: ${item.part_number}</div>
            <div class="part-desc">${item.part_name || 'Sin descripción disponible'}</div>
            <div class="info-grid">
                <div class="info-block"><span class="info-label">📍 Estacionado en Ubicación</span><span class="info-value loc-info">${item.location || 'En Movimiento'}</span></div>
                <div class="info-block"><span class="info-label">🔢 Lote del Material</span><span class="info-value">${item.lot_number || 'Sin Lote'}</span></div>
                <div class="info-block"><span class="info-label">🏭 Área</span><span class="info-value" style="font-size:12px;">${item.area || 'N/A'}</span></div>
                <div class="qty-info"><span class="info-label" style="display:block; font-size:9px; text-align:right;">CANTIDAD</span>${item.quantity.toLocaleString()} pzas</div>
            </div>
        `;
        divResultados.appendChild(card);
    });
}

function descargarExcel() {
    if (!ultimoInventarioBuscado || ultimoInventarioBuscado.length === 0) return alert("No hay datos para exportar.");

    const datosExcel = ultimoInventarioBuscado.map((item, index) => ({
        "Orden/Prioridad": index + 1,
        "Número de Parte": item.part_number || 'N/A',
        "Descripción": item.part_name || 'N/A',
        "Área": item.area || 'N/A',
        "Ubicación Fija": item.location || 'Área Común',
        "Contenedor / Carrito": item.container_code || 'N/A (Suelto)',
        "Número de Lote": item.lot_number || 'Sin Lote',
        "Cantidad (Pzas)": item.quantity,
        "Fecha Registro": item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A'
    }));

    const hoja = XLSX.utils.json_to_sheet(datosExcel);
    const libro = XLSX.utils.book_new();
    XXLSX.utils.book_append_sheet(libro, hoja, "Consulta");
    
    const max_widths = Object.keys(datosExcel[0]).map(key => Math.max(...datosExcel.map(row => row[key] ? row[key].toString().length : 0), key.length) + 3);
    hoja['!cols'] = max_widths.map(w => ({ w: w }));

    const nombreArchivo = `Consulta_${modoConsulta}_${ultimoCriterioBuscado}_${new Date().toISOString().split('T')[0]}.xlsx`;
    XLSX.writeFile(libro, nombreArchivo);
}

function abrirEscaner() {
    document.getElementById('modalQR').style.display = 'flex';
    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
            cerrarEscaner();
            const cleanCode = decodedText.trim().toUpperCase();
            
            let codigoABuscar = cleanCode;
            if (cleanCode.includes('|')) {
                codigoABuscar = cleanCode.split('|')[0].trim();
            }

            // Lógica inteligente de detección de 3 vías:
            const carritoEncontrado = containers.find(c => c.location_code === codigoABuscar);
            const ubicacionFijaEncontrada = fixedLocations.find(l => l.location_code === codigoABuscar);
            const parteEncontrada = parts.find(p => p.part_number === codigoABuscar);

            if (carritoEncontrado) {
                cambiarModo('CARRITO');
                cartSearch.value = carritoEncontrado.location_code;
                buscarContenidoCarrito(carritoEncontrado.id, carritoEncontrado.location_code);
            } else if (ubicacionFijaEncontrada) {
                cambiarModo('UBICACION');
                locSearch.value = ubicacionFijaEncontrada.location_code;
                buscarContenidoUbicacion(ubicacionFijaEncontrada.location_code);
            } else if (parteEncontrada) {
                cambiarModo('PARTE');
                partSearch.value = parteEncontrada.part_number;
                buscarEstrategiaFIFO(parteEncontrada.id, parteEncontrada.part_number, parteEncontrada.description);
            } else {
                alert(`El código "${codigoABuscar}" no coincide con ningún Número de Parte, Ubicación Fija o Carrito registrado.`);
            }
        }
    ).catch(err => {
        alert("Error al abrir cámara: " + err);
        cerrarEscaner();
    });
}

function cerrarEscaner() {
    document.getElementById('modalQR').style.display = 'none';
    if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => { html5QrcodeScanner = null; }).catch(err => console.error(err));
    }
}
</script>
