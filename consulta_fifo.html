<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Consulta FIFO con Escáner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --border:#e2e8f0;
  --success:#166534;
  --success-bg:#dcfce7;
  --warning:#f59e0b;
  --text-secondary:#64748b;
}

*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); padding:15px; }
.container{ max-width:1100px; margin:auto; }

header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background: var(--card); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); }
.back-btn{ background:#6c757d; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; }

.card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.04); margin-bottom:20px; position: relative; }

.group{ display:flex; flex-direction:column; position: relative; }
label{ font-size:11px; font-weight:800; color:var(--text-secondary); margin-bottom:6px; text-transform:uppercase; letter-spacing: 0.5px; }

/* Contenedor del Buscador y Botón de Cámara */
.search-wrapper { display: flex; gap: 8px; width: 100%; }
.input-search { border:1px solid #cbd5e1; border-radius:10px; padding:12px; font-size:15px; background:white; width: 100%; text-transform:uppercase; }

/* Lista de Sugerencias Predictivas */
.suggestions-list {
  position: absolute; top: 100%; left: 0; width: 100%; background: white;
  border: 1px solid #cbd5e1; border-radius: 10px; max-height: 200px; overflow-y: auto;
  z-index: 999; box-shadow: 0 8px 16px rgba(0,0,0,0.1); display: none;
}
.suggestion-item { padding: 12px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
.suggestion-item:hover { background: #f0f7ff; color: var(--primary); font-weight: bold; }
.suggestion-item span { font-size: 12px; color: var(--text-secondary); }

.btn { border:none; border-radius:10px; padding:12px 18px; cursor:pointer; font-weight:700; display:inline-flex; align-items:center; gap:8px; transition:.2s; font-size: 14px; }
.btn-primary { background:var(--primary); color:white; justify-content: center; width: 100%; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-scan { background:var(--warning); color:white; white-space: nowrap; }

#reader { width: 100%; max-width: 400px; margin: 15px auto; border-radius: 12px; overflow: hidden; display: none; border: 2px dashed var(--warning); }

/* CONTENEDOR DE RECUADROS / TARJETAS FIFO */
.fifo-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }

/* Estilo para los bloques comunes en espera */
.fifo-box {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 15px; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}

/* 🚨 RECUADRO SUPERIOR: SACAR ESTE PRIMERO */
.fifo-box.first-priority {
  border: 3px solid #22c55e; background: var(--success-bg);
  position: relative; box-shadow: 0 6px 15px rgba(34, 197, 94, 0.15);
}
.priority-indicator {
  grid-column: 1 / -1; background: #22c55e; color: white; padding: 6px 12px;
  font-weight: 900; font-size: 12px; border-radius: 6px; display: inline-flex;
  align-items: center; gap: 6px; text-transform: uppercase; width: max-content;
}

/* Sub-bloques internos dentro de cada recuadro */
.data-cell { display: flex; flex-direction: column; }
.data-cell .title { font-size: 11px; font-weight: bold; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 3px; }
.data-cell .value { font-size: 14px; font-weight: 700; color: var(--text); }

.qty-badge { background: var(--primary); color: white; padding: 6px 12px; border-radius: 8px; font-size: 16px; font-weight: bold; text-align: center; display: inline-block; }
.first-priority .qty-badge { background: #22c55e; }
.loc-badge { color: #2563eb; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 4px; }

/* DISEÑO ADAPTABLE (PC vs CELULAR) */
@media (max-width: 768px) {
  .fifo-box {
    grid-template-columns: 1fr 1fr; /* En celular se acomoda en 2 columnas por renglón */
    gap: 12px;
    padding: 14px;
  }
  .priority-indicator { grid-column: 1 / -1; width: 100%; justify-content: center; }
  .cell-full-mobile { grid-column: 1 / -1; } /* Forzar a que la descripción ocupe todo el ancho */
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h2 style="font-size: 20px;"><i class="fas fa-hourglass-start" style="color:var(--primary)"></i> Consulta de Prioridad FIFO</h2>
    <button class="back-btn" onclick="location.href='dashboard.html'">⬅ Menú</button>
  </header>

  <div class="card">
    <div class="group">
      <label>Escriba o Escanee Código (N° Parte / Ubicación)</label>
      <div class="search-wrapper">
        <input type="text" id="targetSearch" class="input-search" placeholder="Ej. PART-123 o CARRO-04" autocomplete="off" oninput="manejarInputPredictivo(this.value)">
        <button class="btn btn-scan" onclick="alternarEscaner()" id="btnScanControl">
          <i class="fas fa-camera"></i> Escanear
        </button>
      </div>
      <div id="suggestions" class="suggestions-list"></div>
    </div>

    <div id="reader"></div>
    
    <div style="margin-top: 15px;">
      <button class="btn btn-primary" onclick="consultarFIFO()"><i class="fas fa-search"></i> Calcular Flujo de Salida</button>
    </div>
  </div>

  <div id="fifoResultContainer" class="fifo-container">
    <div style="text-align: center; color: #94a3b8; padding: 40px; background: white; border-radius: 16px; border: 1px solid var(--border);">
      <i class="fas fa-search-location" style="font-size: 32px; margin-bottom: 10px; color: #cbd5e1;"></i>
      <p>Esperando Número de Parte o Contenedor para evaluar orden de salida.</p>
    </div>
  </div>
</div>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let html5QrcodeScanner = null;
let todosLosRegistros = []; // Caché local para autocompletado rápido

// Al iniciar, cargamos el inventario en memoria para que el buscador predictivo sea instantáneo
async function inicializarInventario() {
  const { data, error } = await client.from('v_inventory_by_location_proyectos').select('*');
  if (!error && data) {
    todosLosRegistros = data;
  }
}

// 1. MANEJO DEL BUSCADOR PREDICTIVO (SUGERENCIAS ADAPTATIVAS)
function manejarInputPredictivo(valor) {
  const query = valor.trim().toUpperCase();
  const box = document.getElementById('suggestions');
  
  if (!query || todosLosRegistros.length === 0) {
    box.style.display = 'none';
    return;
  }

  // Filtrar coincidencias únicas por número de parte o ubicación
  const filtrados = [];
  const mapeoSet = new Set();

  todosLosRegistros.forEach(r => {
    if (r.part_number && r.part_number.toUpperCase().includes(query) && !mapeoSet.has(r.part_number)) {
      mapeoSet.add(r.part_number);
      filtrados.push({ texto: r.part_number, sub: r.part_name || 'Sin descripción', tipo: 'Parte' });
    }
    if (r.location && r.location.toUpperCase().includes(query) && !mapeoSet.has(r.location)) {
      mapeoSet.add(r.location);
      filtrados.push({ texto: r.location, sub: `Ubicación / Contenedor`, tipo: 'Loc' });
    }
  });

  if (filtrados.length === 0) {
    box.style.display = 'none';
    return;
  }

  box.innerHTML = filtrados.slice(0, 8).map(f => `
    <div class="suggestion-item" onclick="seleccionarSugerencia('${f.texto}')">
      <strong>${f.texto}</strong>
      <span>${f.sub} (${f.tipo})</span>
    </div>
  `).join('');
  
  box.style.display = 'block';
}

function seleccionarSugerencia(texto) {
  document.getElementById('targetSearch').value = texto;
  document.getElementById('suggestions').style.display = 'none';
  consultarFIFO(); // Lanza la consulta directo al seleccionar
}

// Ocultar dropdown si se hace clic fuera de él
document.addEventListener('click', function(e) {
  if (e.target.id !== 'targetSearch') {
    document.getElementById('suggestions').style.display = 'none';
  }
});


// 2. LOGICA Y RENDERIZADO DEL ORDEN FIFO (EN RECUADROS ADAPTATIVOS)
async function consultarFIFO() {
  const buscador = document.getElementById('targetSearch').value.trim().toUpperCase();
  if (!buscador) return alert('Por favor, ingrese o escanee un dato válido.');

  const contenedor = document.getElementById('fifoResultContainer');
  contenedor.innerHTML = '<div style="text-align:center; padding:30px; font-weight:bold;">Analizando tiempos de permanencia...</div>';

  // Volvemos a traer la información fresca desde la vista consolidada
  const { data, error } = await client.from('v_inventory_by_location_proyectos').select('*');

  if (error) {
    contenedor.innerHTML = `<div style="color:red; text-align:center; padding:20px;">Error: ${error.message}</div>`;
    return;
  }

  // Filtrar según coincida con el Número de Parte o con la Ubicación/Carrito ingresado
  let inventarioFiltrado = data.filter(r => 
    (r.part_number && r.part_number.toUpperCase().includes(buscador)) || 
    (r.location && r.location.toUpperCase().includes(buscador))
  );

  if (inventarioFiltrado.length === 0) {
    contenedor.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">No se encontró material activo con ese criterio.</div>';
    return;
  }

  // Regla de Oro del FIFO: Ordenar de la fecha más antigua a la más reciente (created_at ASC)
  inventarioFiltrado.sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));

  contenedor.innerHTML = ''; // Limpiar panel

  inventarioFiltrado.forEach((r, index) => {
    const esPrimero = (index === 0);
    const fechaFormateada = r.created_at ? new Date(r.created_at).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : 'N/A';

    const divRecuadro = document.createElement('div');
    // Le asignamos clase especial al primero en la fila
    divRecuadro.className = esPrimero ? 'fifo-box first-priority' : 'fifo-box';

    divRecuadro.innerHTML = `
      ${esPrimero ? `<div class="priority-indicator"><i class="fas fa-exclamation-triangle"></i> 🚨 SACAR ESTE PRIMERO (MÁS ANTIGUO)</div>` : ''}
      
      <div class="data-cell">
        <span class="title">N° Parte</span>
        <span class="value" style="color:var(--primary); font-size:16px;">${r.part_number}</span>
      </div>

      <div class="data-cell cell-full-mobile">
        <span class="title">Descripción</span>
        <span class="value" style="font-weight:normal; color:#475569;">${r.part_name || r.descripcion || '-'}</span>
      </div>

      <div class="data-cell">
        <span class="title">Proyecto</span>
        <span class="value"><span style="background:#e0f2f1; color:#00796b; padding:2px 6px; border-radius:4px; font-size:12px;">${r.project || r.proyecto || '-'}</span></span>
      </div>

      <div class="data-cell">
        <span class="title">Ubicación / Carro</span>
        <span class="value loc-badge"><i class="fas fa-truck-loading"></i> ${r.location}</span>
      </div>

      <div class="data-cell">
        <span class="title">Área Planta</span>
        <span class="value" style="font-weight:normal;">${r.area || 'Móvil / Libre'}</span>
      </div>

      <div class="data-cell">
        <span class="title">Fecha Ingreso</span>
        <span class="value" style="font-weight:normal; font-size:12px; color:#475569;">${fechaFormateada}</span>
      </div>

      <div class="data-cell" style="align-items: flex-end; justify-content: center;">
        <span class="title" style="margin-bottom:4px;">Disponibles</span>
        <span class="qty-badge">${r.quantity.toLocaleString()}</span>
      </div>
    `;

    contenedor.appendChild(divRecuadro);
  });
}


// 3. CAMARA / ESCANER QR
function alternarEscaner() {
  const readerDiv = document.getElementById('reader');
  const btn = document.getElementById('btnScanControl');

  if (readerDiv.style.display === 'block') {
    detenerEscaner();
  } else {
    readerDiv.style.display = 'block';
    btn.innerHTML = '<i class="fas fa-stop"></i> Detener';
    btn.style.background = '#ef4444';

    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText) => {
        document.getElementById('targetSearch').value = decodedText.trim().toUpperCase();
        detenerEscaner();
        consultarFIFO(); 
      },
      (err) => {}
    ).catch(err => {
      console.error(err);
      detenerEscaner();
    });
  }
}

function detenerEscaner() {
  const readerDiv = document.getElementById('reader');
  const btn = document.getElementById('btnScanControl');
  
  readerDiv.style.display = 'none';
  btn.innerHTML = '<i class="fas fa-camera"></i> Escanear';
  btn.style.background = 'var(--warning)';

  if (html5QrcodeScanner) {
    html5QrcodeScanner.stop().then(() => {
      html5QrcodeScanner = null;
    }).catch(err => console.error(err));
  }
}

// Carga inicial al abrir la pantalla
inicializarInventario();
</script>
</body>
</html>
