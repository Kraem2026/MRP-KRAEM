<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Consulta FIFO con Escáner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --border:#e2e8f0;
  --success:#22c55e;
  --warning:#f59e0b;
}

*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); padding:20px; }
.container{ max-width:1200px; margin:auto; }

header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
.back-btn{ background:#6c757d; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; }

.card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.04); margin-bottom:20px; }
.search-box { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }

.group{ display:flex; flex-direction:column; margin-bottom: 15px; }
label{ font-size:12px; font-weight:700; color:#475569; margin-bottom:6px; text-transform:uppercase; }
input{ border:1px solid #cbd5e1; border-radius:10px; padding:12px; font-size:14px; background:white; width: 100%; }

.btn{ border:none; border-radius:10px; padding:12px 18px; cursor:pointer; font-weight:700; display:inline-flex; align-items:center; gap:8px; transition:.2s; }
.btn-primary{ background:var(--primary); color:white; }
.btn-scan{ background:var(--warning); color:white; height: 48px; }

/* Contenedor de la cámara */
#reader { width: 100%; max-width: 400px; margin: 15px auto; border-radius: 12px; overflow: hidden; display: none; border: 2px dashed var(--warning); }

table{ width:100%; border-collapse:collapse; margin-top: 15px; }
th{ background:#1e293b; color:white; font-size:12px; text-transform:uppercase; text-align:left; padding:14px; }
td{ padding:14px; border-bottom:1px solid #e2e8f0; font-size:14px; }
tr:nth-child(even){ background:#f8fafc; }

/* Marcador visual del FIFO */
.fifo-first { background: #dcfce7 !important; border-left: 5px solid var(--success); }
.badge-fifo { background: var(--success); color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.badge-normal { background: #e2e8f0; color: #475569; padding: 4px 8px; border-radius: 6px; font-size: 11px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h2><i class="fas fa-hourglass-start" style="color:var(--primary)"></i> Flujo FIFO (First In, First Out)</h2>
    <button class="back-btn" onclick="location.href='dashboard.html'">⬅ Menú</button>
  </header>

  <div class="card">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
      
      <div class="group">
        <label>Buscar por N° Parte o Ubicación</label>
        <div class="search-box">
          <input type="text" id="targetSearch" placeholder="Escanee o escriba No. Parte o Ubicación móvil/fija..." style="text-transform:uppercase;">
          <button class="btn btn-scan" onclick="alternarEscaner()" id="btnScanControl">
            <i class="fas fa-camera"></i> Escanear
          </button>
        </div>
      </div>

    </div>

    <div id="reader"></div>
    
    <div style="margin-top: 10px;">
      <button class="btn btn-primary" onclick="consultarFIFO()"><i class="fas fa-search"></i> Consultar Orden FIFO</button>
    </div>
  </div>

  <div class="card" style="overflow-x: auto;">
    <h3 style="margin-bottom: 15px;"><i class="fas fa-list-ol"></i> Prioridad de Salida Sugerida</h3>
    <table>
      <thead>
        <tr>
          <th>Prioridad</th>
          <th>N° Parte</th>
          <th>Descripción</th>
          <th>Proyecto</th>
          <th>Ubicación / Contenedor</th>
          <th>Área</th>
          <th>Cantidad</th>
          <th>Fecha Ingreso</th>
        </tr>
      </thead>
      <tbody id="fifoBody">
        <tr>
          <td colspan="8" style="text-align: center; color: #94a3b8; padding: 30px;">
            Ingrese o escanee un número de parte o ubicación para calcular las prioridades.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// Inicialización del cliente de Supabase
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let html5QrcodeScanner = null;

function alternarEscaner() {
  const readerDiv = document.getElementById('reader');
  const btn = document.getElementById('btnScanControl');

  if (readerDiv.style.display === 'block') {
    detenerEscaner();
  } else {
    readerDiv.style.display = 'block';
    btn.innerHTML = '<i class="fas fa-stop"></i> Detener';
    btn.style.background = '#ef4444';

    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" }, // Prioriza la cámara trasera en móviles
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText) => {
        // Código escaneado con éxito
        document.getElementById('targetSearch').value = decodedText.trim().toUpperCase();
        detenerEscaner();
        consultarFIFO(); // Lanza la búsqueda en automático al detectar código
      },
      (errorMessage) => { /* Silenciar errores de lectura continuos */ }
    ).catch(err => {
      console.error(err);
      detenerEscaner();
    });
  }
}

function detenerEscaner() {
  const readerDiv = document.getElementById('reader');
  const btn = document.getElementById('btnScanControl');
  
  readerDiv.style.display = 'none';
  btn.innerHTML = '<i class="fas fa-camera"></i> Escanear';
  btn.style.background = 'var(--warning)';

  if (html5QrcodeScanner) {
    html5QrcodeScanner.stop().then(() => {
      html5QrcodeScanner = null;
    }).catch(err => console.error(err));
  }
}

async function consultarFIFO() {
  const searchVal = document.getElementById('targetSearch').value.trim().toUpperCase();
  if (!searchVal) return alert('Por favor escriba o escanee un criterio de búsqueda.');

  const body = document.getElementById('fifoBody');
  body.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">Analizando histórico FIFO...</td></tr>';

  // Consultamos usando la vista v_inventory_by_location_proyectos ordenando por fecha de ingreso
  // Nota: Si cuentas con una columna 'created_at' o 'fecha_ingreso' en la vista o movimientos, la ordenamos de más antigua a más reciente.
  const { data, error } = await client
    .from('v_inventory_by_location_proyectos')
    .select('*');

  if (error) {
    body.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red;">Error al cargar datos: ${error.message}</td></tr>`;
    return;
  }

  // Filtrar de manera dinámica si el parámetro coincide con el número de parte O con la ubicación (fija/carrito)
  let filtrados = data.filter(r => 
    (r.part_number && r.part_number.toUpperCase().includes(searchVal)) || 
    (r.location && r.location.toUpperCase().includes(searchVal))
  );

  // Ordenar de forma estricta (FIFO): El registro con fecha más antigua va primero
  // Si tu vista no expone la fecha directamente, asume el orden por ID del lote/movimiento o añade la columna temporalmente.
  filtrados.sort((a, b) => {
    return new Date(a.created_at || 0) - new Date(b.created_at || 0);
  });

  body.innerHTML = '';

  if (filtrados.length === 0) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">No se encontró inventario activo para este criterio.</td></tr>';
    return;
  }

  filtrados.forEach((r, idx) => {
    const tr = document.createElement('tr');
    
    // Al primer registro (el más antiguo) le asignamos estilo especial FIFO
    if (idx === 0) {
      tr.className = 'fifo-first';
    }

    const prioridadBadge = idx === 0 
      ? '<span class="badge-fifo"><i class="fas fa-star"></i> SACAR PRIMERO</span>' 
      : `<span class="badge-normal">Espera #${idx + 1}</span>`;

    const fechaLegible = r.created_at ? new Date(r.created_at).toLocaleString('es-MX') : 'N/A';

    tr.innerHTML = `
      <td>${prioridadBadge}</td>
      <td><b>${r.part_number}</b></td>
      <td style="color:#64748b; font-size:13px;">${r.part_name || r.descripcion || ''}</td>
      <td><span class="tag-project" style="background:#e0f2f1; color:#00796b; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;">${r.project || '-'}</span></td>
      <td style="color:#3498db; font-weight:bold;"><i class="fas fa-box"></i> ${r.location}</td>
      <td>${r.area || 'Móvil'}</td>
      <td><strong style="color:var(--primary); font-size:15px;">${r.quantity}</strong></td>
      <td style="font-size:12px; color:#475569;">${fechaLegible}</td>
    `;
    body.appendChild(tr);
  });
}
</script>
</body>
</html>
