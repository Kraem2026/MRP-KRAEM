<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Despacho Sugerido FIFO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root { 
        --bg: #f4f6f8; --card: #ffffff; --text: #333333; --text-secondary: #7f8c8d;
        --border: #e2e8f0; --primary: #007bff; --success: #27ae60; --warning: #f39c12; --danger: #dc3545;
    }
    [data-theme="dark"] { 
        --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-secondary: #cbd5e1;
        --border: #334155; 
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding:15px; margin:0; color: var(--text); }
    
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background: var(--card); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); max-width:500px; margin: 0 auto 15px auto; }
    .btn-nav { background:#6c757d; color:white; border:none; padding:8px 15px; cursor:pointer; border-radius:8px; font-weight:bold; font-size:12px; }

    .container { max-width:500px; margin:auto; background:var(--card); padding:20px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-top: 20px; }
    h2 { text-align:center; margin-top:0; color: var(--text); }
    label { font-weight:800; display:block; margin-top:15px; font-size:11px; color: var(--text-secondary); text-transform: uppercase; }
    
    /* Buscador con botón QR en un mismo renglón */
    .input-with-btn { display: flex; gap: 5px; align-items: center; }
    input { width:100%; padding:12px; margin-top:5px; border-radius:8px; border:1px solid var(--border); font-size:15px; box-sizing:border-box; background: var(--bg); color: var(--text); }
    .btn-qr { background: var(--primary); color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 5px; height: 47px; box-sizing: border-box; }

    .autobox { background:var(--card); border:1px solid var(--border); position:absolute; width:100%; z-index:1000; max-height:200px; overflow-y:auto; display:none; border-radius:0 0 8px 8px; box-shadow:0 10px 20px rgba(0,0,0,0.1); }
    .autobox div { padding:12px; cursor:pointer; border-bottom:1px solid var(--border); font-size:14px; }
    .autobox div:hover { background: var(--bg); color: var(--primary); }
    
    /* Encabezado de resultados con botón de Excel */
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-top: 15px; }
    .btn-excel { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
    .btn-excel:hover { background: #219653; transform: translateY(-1px); }

    /* DISEÑO DE RECUADROS ADAPTATIVOS */
    .fifo-card { background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-top: 10px; position: relative; border-left: 5px solid var(--primary); }
    .fifo-card.oldest { border-left: 5px solid var(--warning); background: rgba(243, 156, 18, 0.05); border: 1px solid var(--warning); border-left: 6px solid var(--warning); }
    .badge-status { position: absolute; top: 10px; right: 10px; background: var(--warning); color: white; padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .part-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    
    /* Grid de datos interna para que se vea excelente en Celular y PC */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .info-block { display: flex; flex-direction: column; }
    .info-label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); font-weight: bold; }
    .info-value { font-size: 14px; font-weight: bold; margin-top: 2px; }

    .loc-info { color: var(--primary); font-weight: bold; }
    .qty-info { font-size: 22px; font-weight: bold; color: var(--success); text-align: right; grid-column: 2; margin-top: -5px; }

    /* Estilos del Modal de Cámara */
    .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:2000; backdrop-filter: blur(4px); }
    .modal-content { background:var(--card); padding:25px; border-radius:15px; width:90%; max-width:400px; color: var(--text); border: 1px solid var(--border); }
    #reader { width: 100%; background: black; border-radius: 8px; overflow: hidden; margin-top: 10px; }
</style>
</head>
<body>

<header>
    <button class="btn-nav" onclick="location.href='dashboard.html'">⬅ <span>Volver</span></button>
    <div style="font-weight: bold; font-size: 13px; color: var(--text-secondary);">KRAEM MRP</div>
</header>

<div class="container">
    <h2><i class="fas fa-boxes"></i> ¿Qué lote debo tomar?</h2>
    <p style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: -10px;">Consulta FIFO para Operadores y Montacargas</p>
    
    <div style="position:relative;">
        <label>Escribe o Escanea Número de Parte</label>
        <div class="input-with-btn">
            <input id="partSearch" placeholder="Ej: KRM-1023..." autocomplete="off">
            <button class="btn-qr" onclick="abrirEscaner()"><i class="fas fa-camera"></i></button>
        </div>
        <div id="partResults" class="autobox"></div>
    </div>

    <div id="resultadoDespacho" style="margin-top: 20px;"></div>
</div>

<div id="modalQR" class="modal" onclick="if(event.target==this)cerrarEscaner()">
    <div class="modal-content">
        <h3 style="margin-top:0; text-align:center;">Escaneando Código QR</h3>
        <div id="reader"></div>
        <button onclick="cerrarEscaner()" style="margin-top:15px; width:100%; background:var(--danger); color:white; border:none; padding:12px; cursor:pointer; font-weight:bold; border-radius:8px;">Cancelar</button>
    </div>
</div>

<script>
const _client = supabase.createClient('https://telntsrrschcdxczlape.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbG50c3Jyc2NoY2R4Y3psYXBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4NjI4MTcsImV4cCI6MjA4MDQzODgxN30.DC2teZ_4gk3wA7UmZJHyeZHjw5aOOEmmKvd3a8jRUyw');

let parts = [];
let html5QrcodeScanner = null;
let ultimoInventarioBuscado = []; // Variable global para guardar los datos y poder exportarlos
let ultimoPartNumber = '';

async function loadParts() {
    const {data: p} = await _client.from('parts').select('id, part_number').limit(2000);
    if(p) parts = p;
}
loadParts();

partSearch.oninput = () => {
    const v = partSearch.value.toUpperCase();
    partResults.innerHTML = '';
    if(!v) { partResults.style.display = 'none'; return; }
    const m = parts.filter(p => p.part_number.includes(v)).slice(0,8);
    m.forEach(p => {
        const d = document.createElement('div');
        d.textContent = p.part_number;
        d.onclick = () => {
            partSearch.value = p.part_number;
            partResults.style.display = 'none';
            buscarEstrategiaFIFO(p.id, p.part_number);
        };
        partResults.appendChild(d);
    });
    partResults.style.display = m.length ? 'block' : 'none';
};

document.addEventListener('click', function(e) {
    if (e.target.id !== 'partSearch') {
        partResults.style.display = 'none';
    }
});

async function buscarEstrategiaFIFO(partId, partNumber) {
    const divResultados = document.getElementById('resultadoDespacho');
    divResultados.innerHTML = '<p style="text-align:center;">Buscando en carritos y locaciones...</p>';
    
    ultimoPartNumber = partNumber;
    ultimoInventarioBuscado = [];

    const { data: inventario, error } = await _client
        .from('v_inventory_by_location')
        .select('*')
        .eq('part_id', partId)
        .gt('quantity', 0)
        .order('lot_number', { ascending: true });

    if (error || !inventario || inventario.length === 0) {
        divResultados.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--danger); font-weight: bold;">❌ No hay existencias disponibles de la parte ${partNumber} en ninguna ubicación.</div>`;
        return;
    }

    // Guardamos una copia en la variable global para la exportación de Excel
    ultimoInventarioBuscado = inventario;

    // Crear la estructura de encabezado con el botón de descarga
    divResultados.innerHTML = `
        <div class="results-header">
            <h3 style="font-size:12px; text-transform:uppercase; color: var(--text-secondary); margin:0;">Ruta de recolección recomendada:</h3>
            <button class="btn-excel" onclick="descargarExcelFIFO()"><i class="fas fa-file-excel"></i> Descargar Excel</button>
        </div>
    `;

    inventario.forEach((item, index) => {
        const esPrimero = index === 0;
        const card = document.createElement('div');
        card.className = `fifo-card ${esPrimero ? 'oldest' : ''}`;
        
        const carritoCode = item.container_code ? item.container_code : 'N/A (Suelto)';

        card.innerHTML = `
            ${esPrimero ? '<span class="badge-status"><i class="fas fa-exclamation-triangle"></i> ¡TOMAR ESTE PRIMERO!</span>' : ''}
            <div class="part-title">${partNumber}</div>
            
            <div class="info-grid">
                <div class="info-block">
                    <span class="info-label">📍 Ubicación Fija</span>
                    <span class="info-value loc-info">${item.location || 'Área Común'}</span>
                </div>
                <div class="info-block">
                    <span class="info-label">🛒 Carro / Contenedor</span>
                    <span class="info-value" style="color:#e67e22;"><i class="fas fa-truck-loading"></i> ${carritoCode}</span>
                </div>
                <div class="info-block">
                    <span class="info-label">🔢 Número de Lote</span>
                    <span class="info-value">${item.lot_number || 'Sin Lote'}</span>
                </div>
                <div class="qty-info">
                    <span class="info-label" style="display:block; font-size:9px; text-align:right; color:var(--text-secondary);">CANTIDAD</span>
                    ${item.quantity.toLocaleString()} pzas
                </div>
            </div>
        `;
        divResultados.appendChild(card);
    });
}

// Función encargada de estructurar los datos y gatillar la descarga del archivo Excel
function descargarExcelFIFO() {
    if (!ultimoInventarioBuscado || ultimoInventarioBuscado.length === 0) {
        alert("No hay datos disponibles para exportar.");
        return;
    }

    // Mapeamos los datos de la vista a columnas limpias y entendibles en español
    const datosExcel = ultimoInventarioBuscado.map((item, index) => ({
        "Prioridad FIFO": index + 1,
        "Número de Parte": ultimoPartNumber,
        "Área": item.area || 'N/A',
        "Ubicación Fija": item.location || 'Área Común',
        "Contenedor / Carrito": item.container_code || 'N/A (Suelto)',
        "Número de Lote": item.lot_number || 'Sin Lote',
        "Cantidad (Pzas)": item.quantity,
        "Fecha Registro Sistema": item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A'
    }));

    // Creamos el libro de trabajo de Excel (Workbook)
    const hoja = XLSX.utils.json_to_sheet(datosExcel);
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, "Inventario FIFO");

    // Ajustar automáticamente el ancho de las columnas para que se lea perfecto
    const max_widths = Object.keys(datosExcel[0]).map(key => 
        Math.max(...datosExcel.map(row => row[key] ? row[key].toString().length : 0), key.length) + 3
    );
    hoja['!cols'] = max_widths.map(w => ({ w: w }));

    // Generar la descarga del archivo con el nombre del Número de Parte
    const nombreArchivo = `FIFO_${ultimoPartNumber}_${new Date().toISOString().split('T')[0]}.xlsx`;
    XLSX.writeFile(libro, nombreArchivo);
}

function abrirEscaner() {
    document.getElementById('modalQR').style.display = 'flex';
    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
            cerrarEscaner();
            const cleanCode = decodedText.trim().toUpperCase();
            
            if (cleanCode.includes('|')) {
                const tokens = cleanCode.split('|');
                const numParte = tokens[0].trim();
                const parteEncontrada = parts.find(p => p.part_number === numParte);
                if (parteEncontrada) {
                    partSearch.value = parteEncontrada.part_number;
                    buscarEstrategiaFIFO(parteEncontrada.id, parteEncontrada.part_number);
                } else { alert(`Parte "${numParte}" no encontrada.`); }
            } else {
                const parteEncontrada = parts.find(p => p.part_number === cleanCode);
                if (parteEncontrada) {
                    partSearch.value = parteEncontrada.part_number;
                    buscarEstrategiaFIFO(parteEncontrada.id, parteEncontrada.part_number);
                } else { alert(`Número de parte "${cleanCode}" no encontrado.`); }
            }
        }
    ).catch(err => {
        alert("Error al abrir cámara: " + err);
        cerrarEscaner();
    });
}

function cerrarEscaner() {
    document.getElementById('modalQR').style.display = 'none';
    if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => { html5QrcodeScanner = null; }).catch(err => console.error(err));
    }
}
</script>
</body>
</html>
