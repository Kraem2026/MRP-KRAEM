<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro / Edición de Número de Parte - WMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="catalogos_ingenieria.html" class="text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </a>
            <h1 class="text-xl font-bold tracking-wide" id="page-title">Registro de Nuevo Número de Parte</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="lang-toggle" onclick="toggleLanguage()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold uppercase tracking-wider border border-slate-700">
                KO / ES
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 container mx-auto p-4 sm:p-6 max-w-4xl">
        <div class="bg-white shadow-lg rounded-xl p-6 sm:p-8 border border-slate-200">
            
            <form id="part-form" onsubmit="savePart(event)" class="space-y-6">
                
                <!-- Clasificación Principal -->
                <div class="border-b pb-4">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center">
                        <i class="fa-solid fa-tags text-blue-600 mr-2"></i> 
                        <span data-es="Clasificación del Producto" data-ko="제품 classification">Clasificación del Producto</span>
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tipo de Producto *</label>
                            <select id="product_type" onchange="handleProductTypeChange()" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="PT">Producto Terminado (PT)</option>
                                <option value="COMPONENTE">Componente / Sub-ensamble</option>
                                <option value="RESINA">Resina (Materia Prima)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Número de Parte *</label>
                            <input type="text" id="part_number" required placeholder="Ej: KRAEM-001" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre de la Pieza / Material *</label>
                            <input type="text" id="part_name" required placeholder="Ej: Cover Rear / Resina PP" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Detalles Generales y Entidad -->
                <div class="border-b pb-4">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center">
                        <i class="fa-solid fa-building text-blue-600 mr-2"></i> 
                        <span data-es="Información Comercial" data-ko="상업 정보">Información Comercial</span>
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div id="field-client">
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cliente</label>
                            <input type="text" id="customer" placeholder="Ej: LG / Hyundai" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div id="field-supplier" class="hidden">
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Proveedor</label>
                            <input type="text" id="supplier" placeholder="Ej: Lotte Chemical / Sabic" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Proyecto / Modelo</label>
                            <input type="text" id="project_model" placeholder="Ej: Model-X 2026" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Unidad de Medida</label>
                            <select id="unit_of_measure" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="PZA">PZA (Piezas)</option>
                                <option value="KG">KG (Kilogramos)</option>
                                <option value="GR">GR (Gramos)</option>
                                <option value="MTR">MTR (Metros)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Sección Técnica / Inyección (Solo para PT / Componente) -->
                <div id="injection-section" class="border-b pb-4">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center">
                        <i class="fa-solid fa-microchip text-blue-600 mr-2"></i> 
                        <span>Parámetros de Inyección / Moldes</span>
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cavidades</label>
                            <input type="number" id="cavities" min="1" value="1" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ciclo (Segs)</label>
                            <input type="number" step="0.1" id="cycle_time" placeholder="0.0" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Peso Pieza (g)</label>
                            <input type="number" step="0.01" id="part_weight_g" placeholder="0.00" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Peso Colada (g)</label>
                            <input type="number" step="0.01" id="runner_weight_g" placeholder="0.00" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Sección Específica de Resinas (Solo para RESINA) -->
                <div id="resin-section" class="border-b pb-4 hidden">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center">
                        <i class="fa-solid fa-flask text-blue-600 mr-2"></i> 
                        <span>Especificaciones de Resina</span>
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tipo de Resina</label>
                            <input type="text" id="resin_type" placeholder="Ej: PP, ABS, PC+ABS" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Grado / Grade</label>
                            <input type="text" id="resin_grade" placeholder="Ej: HF380 / NH-1000T" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tolerancia Peso / Merma (%)</label>
                            <input type="number" step="0.1" id="weight_tolerance" value="3.0" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="flex justify-end space-x-4 pt-4">
                    <a href="admin_partes.html" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg transition">Cancelar</a>
                    <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition flex items-center">
                        <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Parte
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script>
        let editId = new URLSearchParams(window.location.search).get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if(editId) {
                document.getElementById('page-title').innerText = "Editar Número de Parte";
                await loadPartData(editId);
            }
        });

        function handleProductTypeChange() {
            const type = document.getElementById('product_type').value;
            const fieldClient = document.getElementById('field-client');
            const fieldSupplier = document.getElementById('field-supplier');
            const injectionSec = document.getElementById('injection-section');
            const resinSec = document.getElementById('resin-section');
            const uom = document.getElementById('unit_of_measure');

            if(type === 'RESINA') {
                fieldClient.classList.add('hidden');
                fieldSupplier.classList.remove('hidden');
                injectionSec.classList.add('hidden');
                resinSec.classList.remove('hidden');
                uom.value = 'KG';
            } else {
                fieldClient.classList.remove('hidden');
                fieldSupplier.classList.add('hidden');
                injectionSec.classList.remove('hidden');
                resinSec.classList.add('hidden');
                uom.value = 'PZA';
            }
        }

        async function savePart(e) {
            e.preventDefault();
            
            const payload = {
                product_type: document.getElementById('product_type').value,
                part_number: document.getElementById('part_number').value.trim(),
                part_name: document.getElementById('part_name').value.trim(),
                customer: document.getElementById('customer').value.trim(),
                supplier: document.getElementById('supplier').value.trim(),
                project_model: document.getElementById('project_model').value.trim(),
                unit_of_measure: document.getElementById('unit_of_measure').value,
                cavities: parseInt(document.getElementById('cavities').value) || 0,
                cycle_time: parseFloat(document.getElementById('cycle_time').value) || 0,
                part_weight_g: parseFloat(document.getElementById('part_weight_g').value) || 0,
                runner_weight_g: parseFloat(document.getElementById('runner_weight_g').value) || 0,
                resin_type: document.getElementById('resin_type').value.trim(),
                resin_grade: document.getElementById('resin_grade').value.trim(),
                weight_tolerance: parseFloat(document.getElementById('weight_tolerance').value) || 0
            };

            let result;
            if(editId) {
                result = await supabaseClient.from('parts').update(payload).eq('id', editId);
            } else {
                result = await supabaseClient.from('parts').insert([payload]);
            }

            if(result.error) {
                alert("Error al guardar: " + result.error.message);
            } else {
                alert("Número de parte guardado correctamente.");
                window.location.href = 'admin_partes.html';
            }
        }

        async function loadPartData(id) {
            const { data, error } = await supabaseClient.from('parts').select('*').eq('id', id).single();
            if(error) return alert("Error cargando registro");

            document.getElementById('product_type').value = data.product_type || 'PT';
            handleProductTypeChange();

            document.getElementById('part_number').value = data.part_number || '';
            document.getElementById('part_name').value = data.part_name || '';
            document.getElementById('customer').value = data.customer || '';
            document.getElementById('supplier').value = data.supplier || '';
            document.getElementById('project_model').value = data.project_model || '';
            document.getElementById('unit_of_measure').value = data.unit_of_measure || 'PZA';
            document.getElementById('cavities').value = data.cavities || 1;
            document.getElementById('cycle_time').value = data.cycle_time || '';
            document.getElementById('part_weight_g').value = data.part_weight_g || '';
            document.getElementById('runner_weight_g').value = data.runner_weight_g || '';
            document.getElementById('resin_type').value = data.resin_type || '';
            document.getElementById('resin_grade').value = data.resin_grade || '';
            document.getElementById('weight_tolerance').value = data.weight_tolerance || 0;
        }

        function toggleLanguage() {
            alert("Traducción alternada (Coreano/Español)");
        }
    </script>
</body>
</html>
