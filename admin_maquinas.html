<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRAEM | Administración de Máquinas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
    --border:#e2e8f0;
    --success:#22c55e;
    --danger:#ef4444;
    --gray:#64748b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:'Segoe UI',sans-serif;
    color:var(--text);
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

.title-box{
    display:flex;
    align-items:center;
    gap:15px;
}

.title-box h1{
    font-size:28px;
    font-weight:700;
}

.card{
    background:var(--card);
    border-radius:18px;
    padding:25px;
    border:1px solid var(--border);
    box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:12px;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:8px;
    color:#475569;
}

input,
select{
    padding:13px;
    border-radius:12px;
    border:1px solid var(--border);
    font-size:14px;
    outline:none;
    transition:.2s;
}

input:focus,
select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.btn{
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    transition:.2s;
    font-size:14px;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-back{
    background:white;
    border:1px solid var(--border);
    color:var(--text);
}

.table-container{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

thead{
    background:#f1f5f9;
}

th{
    padding:15px;
    text-align:left;
    font-size:12px;
    text-transform:uppercase;
    color:#64748b;
}

td{
    padding:15px;
    border-bottom:1px solid #f1f5f9;
    font-size:14px;
}

tr:hover{
    background:#f8fafc;
}

.status{
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.inactive{
    background:#fee2e2;
    color:#991b1b;
}

.action-buttons{
    display:flex;
    gap:8px;
}

.action-btn{
    border:none;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.action-btn:hover{
    transform:scale(1.03);
}

.btn-edit{
    background:#dbeafe;
    color:#1d4ed8;
}

.btn-toggle{
    background:#e2e8f0;
    color:#334155;
}

.empty{
    text-align:center;
    padding:40px;
    color:var(--gray);
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .card{
        padding:18px;
    }

    .title-box h1{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="title-box">

            <button class="btn btn-back"
                onclick="location.href='ingenieria_catalogos.html'">

                <i class="fas fa-arrow-left"></i>
                Regresar

            </button>

            <h1>Administración de Máquinas</h1>

        </div>

    </div>

    <div class="card">

        <div class="form-grid">

            <div class="form-group">

                <label>Área General</label>

                <select id="area_general_id">

                    <option value="">
                        Cargando...
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Código Máquina</label>

                <input
                    id="machine_code"
                    placeholder="Ej. LS-01">

            </div>

            <div class="form-group">

                <label>Nombre Máquina</label>

                <input
                    id="machine_name"
                    placeholder="Ej. Línea Soldadura 1">

            </div>

        </div>

        <button class="btn btn-primary"
            onclick="guardarMaquina()">

            <i class="fas fa-save"></i>
            Guardar Máquina

        </button>

    </div>

    <div class="card" style="margin-top:20px;">

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Área General</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Estatus</th>
                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="body">

                    <tr>

                        <td colspan="6" class="empty">

                            Cargando...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

let editId = null;
let machinesData = [];

async function cargarAreasGenerales(){

    const sel =
        document.getElementById('area_general_id');

    sel.innerHTML = `
        <option value="">
            Cargando...
        </option>
    `;

    try{

        const { data, error } = await client
            .from('areas_generales')
            .select('*')
            .order('nombre');

        if(error) throw error;

        console.log('ÁREAS:', data);

        sel.innerHTML = `
            <option value="">
                Seleccione...
            </option>
        `;

        if(!data || data.length === 0){

            sel.innerHTML += `
                <option value="">
                    No hay áreas registradas
                </option>
            `;

            return;
        }

        data.forEach(area => {

            sel.innerHTML += `
                <option value="${area.id}">
                    ${area.nombre}
                </option>
            `;
        });

    }catch(err){

        console.error('ERROR ÁREAS:', err);

        sel.innerHTML = `
            <option value="">
                Error cargando áreas
            </option>
        `;

        alert(
            'Error cargando áreas generales:\n' +
            err.message
        );
    }
}

async function load(){

    const body =
        document.getElementById('body');

    body.innerHTML = `
        <tr>
            <td colspan="6" class="empty">
                Cargando...
            </td>
        </tr>
    `;

    try{

        const { data, error } = await client
            .from('mes_machines')
            .select(`
                *,
                areas_generales (
                    id,
                    nombre
                )
            `)
            .order('machine_code');

        if(error) throw error;

        machinesData = data || [];

        console.log('MÁQUINAS:', machinesData);

        if(machinesData.length === 0){

            body.innerHTML = `
                <tr>
                    <td colspan="6" class="empty">
                        No hay máquinas registradas
                    </td>
                </tr>
            `;

            return;
        }

        body.innerHTML = machinesData.map((m,index) => `

            <tr>

                <td>${m.id}</td>

                <td>
                    ${m.areas_generales?.nombre || 'Sin área'}
                </td>

                <td>${m.machine_code || ''}</td>

                <td>${m.machine_name || ''}</td>

                <td>

                    <span class="status ${m.active ? 'active' : 'inactive'}">

                        ${m.active ? 'ACTIVA' : 'INACTIVA'}

                    </span>

                </td>

                <td>

                    <div class="action-buttons">

                        <button class="action-btn btn-edit"
                            onclick="editar(${index})">

                            <i class="fas fa-edit"></i>

                        </button>

                        <button class="action-btn btn-toggle"
                            onclick="toggleMachine(${m.id}, ${m.active})">

                            ${m.active ? 'Desactivar' : 'Activar'}

                        </button>

                    </div>

                </td>

            </tr>

        `).join('');

    }catch(err){

        console.error('ERROR MÁQUINAS:', err);

        body.innerHTML = `
            <tr>
                <td colspan="6"
                    class="empty"
                    style="color:red;">

                    Error cargando máquinas

                </td>
            </tr>
        `;

        alert(
            'Error cargando máquinas:\n' +
            err.message
        );
    }
}

function editar(index){

    const m = machinesData[index];

    if(!m) return;

    editId = m.id;

    document.getElementById('area_general_id').value =
        m.area_general_id || '';

    document.getElementById('machine_code').value =
        m.machine_code || '';

    document.getElementById('machine_name').value =
        m.machine_name || '';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

async function guardarMaquina(){

    const areaGeneral =
        document.getElementById('area_general_id')
        .value
        .trim();

    const machineCode =
        document.getElementById('machine_code')
        .value
        .trim();

    const machineName =
        document.getElementById('machine_name')
        .value
        .trim();

    if(!areaGeneral || !machineCode || !machineName){

        alert('Completa todos los campos');
        return;
    }

    const obj = {

        area_general_id: areaGeneral,

        machine_code: machineCode.toUpperCase(),

        machine_name: machineName,

        production_area:
            document.getElementById('area_general_id')
            .options[
                document.getElementById('area_general_id')
                .selectedIndex
            ].text,

        active: true
    };

    console.log('OBJETO A GUARDAR:', obj);

    try{

        let error = null;

        if(editId){

            const res = await client
                .from('mes_machines')
                .update(obj)
                .eq('id', editId);

            error = res.error;

        }else{

            const res = await client
                .from('mes_machines')
                .insert([obj]);

            error = res.error;
        }

        if(error) throw error;

        alert('Máquina guardada correctamente');

        limpiar();

        await load();

    }catch(err){

        console.error('ERROR GUARDANDO:', err);

        alert(
            'Error guardando máquina:\n' +
            err.message
        );
    }
}

async function toggleMachine(id,state){

    try{

        const { error } = await client
            .from('mes_machines')
            .update({
                active: !state
            })
            .eq('id',id);

        if(error) throw error;

        await load();

    }catch(err){

        console.error('ERROR TOGGLE:', err);

        alert(err.message);
    }
}

function limpiar(){

    editId = null;

    document.getElementById('area_general_id').value = '';

    document.getElementById('machine_code').value = '';

    document.getElementById('machine_name').value = '';
}

async function init(){

    await cargarAreasGenerales();

    await load();
}

document.addEventListener(
    'DOMContentLoaded',
    init
);

</script>

</body>
</html>
