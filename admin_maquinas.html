<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administración de Máquinas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

:root{
  --primary:#2563eb;
  --success:#22c55e;
  --danger:#ef4444;
  --warning:#f59e0b;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#1e293b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  font-family:'Segoe UI',sans-serif;
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
  flex-wrap:wrap;
}

.back-btn{
  background:#64748b;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

h1{
  margin:0;
  color:var(--primary);
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

label{
  font-size:12px;
  font-weight:bold;
  color:var(--primary);
  text-transform:uppercase;
  display:block;
  margin-bottom:5px;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:14px;
}

button{
  border:none;
  border-radius:10px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:bold;
}

.btn-save{
  background:var(--primary);
  color:white;
}

.btn-edit{
  background:var(--warning);
  color:white;
}

.btn-toggle{
  background:#334155;
  color:white;
}

.btn-cancel{
  background:#dc2626;
  color:white;
}

.table-container{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--primary);
  color:white;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
  background:white;
}

.badge-active{
  color:var(--success);
  font-weight:bold;
}

.badge-inactive{
  color:var(--danger);
  font-weight:bold;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

@media(max-width:768px){

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">

    <button class="back-btn"
      onclick="location.href='ingenieria_catalogos.html'">
      ← Volver
    </button>

    <h1>⚙️ Catálogo de Máquinas</h1>

  </div>

  <div class="card">

    <div class="form-grid">

      <div>
        <label>Área General</label>

        <select id="area_general_id">
          <option value="">Cargando...</option>
        </select>
      </div>

      <div>
        <label>Código Máquina</label>

        <input id="machine_code"
          placeholder="Ej. LS-01">
      </div>

      <div>
        <label>Nombre Máquina</label>

        <input id="machine_name"
          placeholder="Ej. LS 1">
      </div>

    </div>

    <br>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">

      <button class="btn-save"
        onclick="guardarMaquina()">
        💾 Guardar Máquina
      </button>

      <button class="btn-cancel"
        onclick="limpiar()">
        ❌ Cancelar
      </button>

    </div>

  </div>

  <div class="card table-container">

    <table>

      <thead>

        <tr>
          <th>Área General</th>
          <th>Código</th>
          <th>Nombre</th>
          <th>Estatus</th>
          <th>Acciones</th>
        </tr>

      </thead>

      <tbody id="body"></tbody>

    </table>

  </div>

</div>

<script>

const client = supabaseClient;

let editId = null;

async function loadAreasGenerales(){

  const { data, error } = await client
    .from('areas_generales')
    .select('*')
    .eq('active', true)
    .order('nombre');

  if(error){

    console.error(error);
    alert('Error cargando áreas generales');
    return;

  }

  area_general_id.innerHTML = `
    <option value="">Seleccione...</option>
  `;

  data.forEach(a=>{

    area_general_id.innerHTML += `
      <option value="${a.id}" data-code="${a.code}">
        ${a.nombre}
      </option>
    `;

  });

}

async function loadMaquinas(){

  const { data, error } = await client
    .from('mes_machines')
    .select(`
      *,
      areas_generales(
        id,
        nombre,
        code
      )
    `)
    .order('machine_code');

  if(error){

    console.error(error);
    alert('Error cargando máquinas');
    return;

  }

  body.innerHTML = '';

  data.forEach(m=>{

    body.innerHTML += `

      <tr>

        <td>
          ${m.areas_generales?.nombre || '-'}
        </td>

        <td>
          ${m.machine_code}
        </td>

        <td>
          ${m.machine_name}
        </td>

        <td class="${m.active ? 'badge-active' : 'badge-inactive'}">

          ${m.active ? 'Activa' : 'Inactiva'}

        </td>

        <td>

          <div class="actions">

            <button class="btn-edit"
              onclick='editarMaquina(${JSON.stringify(m)})'>
              ✏️ Editar
            </button>

            <button class="btn-toggle"
              onclick='toggleMaquina(${m.id}, ${m.active})'>

              ${m.active ? 'Desactivar' : 'Activar'}

            </button>

          </div>

        </td>

      </tr>

    `;

  });

}

async function guardarMaquina(){

  if(
    !machine_code.value ||
    !machine_name.value ||
    !area_general_id.value
  ){
    return alert('Completa todos los campos');
  }

  const selectedOption =
    area_general_id.options[
      area_general_id.selectedIndex
    ];

  const productionArea =
    selectedOption.dataset.code;

  const payload = {

    machine_code:
      machine_code.value.toUpperCase(),

    machine_name:
      machine_name.value,

    area_general_id:
      parseInt(area_general_id.value),

    production_area:
      productionArea,

    active:true

  };

  let error;

  if(editId){

    ({ error } = await client
      .from('mes_machines')
      .update(payload)
      .eq('id', editId));

  }else{

    ({ error } = await client
      .from('mes_machines')
      .insert(payload));

  }

  if(error){

    console.error(error);
    return alert(error.message);

  }

  limpiar();

  loadMaquinas();

}

function editarMaquina(m){

  editId = m.id;

  machine_code.value =
    m.machine_code;

  machine_name.value =
    m.machine_name;

  area_general_id.value =
    m.area_general_id;

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}

async function toggleMaquina(id,state){

  const { error } = await client
    .from('mes_machines')
    .update({
      active: !state
    })
    .eq('id', id);

  if(error){

    console.error(error);
    return alert(error.message);

  }

  loadMaquinas();

}

function limpiar(){

  editId = null;

  machine_code.value = '';
  machine_name.value = '';
  area_general_id.value = '';

}

loadAreasGenerales();
loadMaquinas();

</script>

</body>
</html>
