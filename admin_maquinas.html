<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRAEM | Administración de Máquinas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="kraem_nav.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
    --border:#e2e8f0;
    --success:#22c55e;
    --danger:#ef4444;
    --gray:#64748b;
}

[data-theme="dark"]{
    --bg:#020617;
    --card:#1e293b;
    --text:#f1f5f9;
    --border:#334155;
    --gray:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:'Segoe UI',sans-serif;
    color:var(--text);
    padding:20px;
    transition:.25s;
}

.container{
    max-width:1600px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:18px;
}

.title-box{
    display:flex;
    align-items:center;
    gap:15px;
}

.title-box h1{
    font-size:24px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.controls{
    display:flex;
    gap:8px;
    align-items:center;
}

.lang-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    border:1px solid var(--border);
    overflow:hidden;
    padding:0;
    background:var(--card);
}

.lang-btn img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.kpi-strip{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
    margin-bottom:16px;
}

.kpi-chip{
    background:var(--card);
    border:1px solid var(--border);
    border-left:4px solid var(--primary);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:.15s;
}

.kpi-chip:hover{
    border-color:var(--primary);
}

.kpi-chip .kt{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--gray);
}

.kpi-chip .kv{
    font-size:22px;
    font-weight:800;
    margin-top:3px;
    font-variant-numeric:tabular-nums;
}

.filter-bar{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:12px;
    margin-bottom:14px;
}

@media(max-width:768px){
    .filter-bar{ grid-template-columns:1fr; }
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    border:1px solid var(--border);
    box-shadow:0 4px 12px rgba(0,0,0,.04);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:14px;
    margin-bottom:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:11px;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:6px;
    color:var(--gray);
}

input,
select{
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:13.5px;
    outline:none;
    transition:.2s;
}

input:focus,
select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.btn{
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    transition:.2s;
    font-size:14px;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-back{
    background:white;
    border:1px solid var(--border);
    color:var(--text);
}

.table-container{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

thead{
    background:#f1f5f9;
}

th{
    padding:15px;
    text-align:left;
    font-size:12px;
    text-transform:uppercase;
    color:#64748b;
}

td{
    padding:15px;
    border-bottom:1px solid #f1f5f9;
    font-size:14px;
}

tr:hover{
    background:#f8fafc;
}

.status{
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.inactive{
    background:#fee2e2;
    color:#991b1b;
}

.machine-status{
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.status-disponible{
    background:#dcfce7;
    color:#166534;
}

.status-mantenimiento{
    background:#fee2e2;
    color:#991b1b;
}

.status-produccion{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-setup{
    background:#fef3c7;
    color:#92400e;
}

.status-parada{
    background:#e5e7eb;
    color:#374151;
}

.status-run{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-avail{
    background:#ecfdf5;
    color:#047857;
}

.action-buttons{
    display:flex;
    gap:8px;
}

.action-btn{
    border:none;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.action-btn:hover{
    transform:scale(1.03);
}

.btn-edit{
    background:#dbeafe;
    color:#1d4ed8;
}

.btn-toggle{
    background:#e2e8f0;
    color:#334155;
}

.empty{
    text-align:center;
    padding:40px;
    color:var(--gray);
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .card{
        padding:18px;
    }

    .title-box h1{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="title-box">

            <button class="btn btn-back"
                onclick="KraemNav.back('dashboard.html')">

                <i class="fas fa-arrow-left"></i>
                <span id="lblBackMach">Regresar</span>

            </button>

            <h1>
                <span id="txtTitleMach">Administración de Máquinas</span>
                <span style="font-size:10px;font-weight:800;color:var(--primary);background:rgba(37,99,235,0.12);padding:2px 7px;border-radius:4px;letter-spacing:0.5px;">by APEX SYSTEM</span>
            </h1>

        </div>

        <div class="controls">
            <button class="lang-btn" onclick="setLang('es')" title="Español"><img src="https://flagcdn.com/w80/mx.png" alt="MX"></button>
            <button class="lang-btn" onclick="setLang('ko')" title="한국어"><img src="https://flagcdn.com/w80/kr.png" alt="KR"></button>
            <button class="lang-btn" onclick="setLang('en')" title="English"><img src="https://flagcdn.com/w80/us.png" alt="US"></button>
            <button class="btn btn-back" onclick="toggleTheme()" title="Tema"><i id="themeIcon" class="fas fa-moon"></i></button>
        </div>

    </div>

    <div class="kpi-strip">
        <div class="kpi-chip" onclick="quickFilterMach('ALL')">
            <div class="kt" id="lblKpiActivas">Máquinas Activas</div>
            <div class="kv" id="kpiActivas">0</div>
        </div>
        <div class="kpi-chip" style="border-left-color:var(--success)" onclick="quickFilterMach('DISPONIBLE')">
            <div class="kt" id="lblKpiDisp">Disponibles Mtto</div>
            <div class="kv" id="kpiDisponibles" style="color:var(--success);">0</div>
        </div>
        <div class="kpi-chip" style="border-left-color:#2563eb" onclick="quickFilterMach('RUNNING')">
            <div class="kt" id="lblKpiRun">En Corrida MES</div>
            <div class="kv" id="kpiRunning" style="color:#2563eb;">0</div>
        </div>
        <div class="kpi-chip" style="border-left-color:var(--danger)" onclick="quickFilterMach('MTTO')">
            <div class="kt" id="lblKpiMtto">En Mantenimiento / Paro</div>
            <div class="kv" id="kpiMtto" style="color:var(--danger);">0</div>
        </div>
    </div>

    <div class="card" id="machFormCard">

        <div class="form-grid">

            <div class="form-group">

                <label>Área General</label>

                <select id="area_general_id">

                    <option value="">
                        Cargando...
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Código Máquina</label>

                <input
                    id="machine_code"
                    placeholder="Ej. NIS-150">

            </div>

            <div class="form-group">

                <label>Nombre Máquina</label>

                <input
                    id="machine_name"
                    placeholder="Ej. Máquina 1">

            </div>

            <div class="form-group">

                <label>Tonelaje</label>

                <input
                    type="number"
                    id="tonnage"
                    placeholder="Ej. 150">

            </div>

            <div class="form-group">

                <label>Tipo Máquina</label>

                <select id="machine_type">

                    <option value="">
                        Seleccione...
                    </option>

                    <option value="Inyección">
                        Inyección
                    </option>

                    <option value="Tampografía">
                        Tampografía
                    </option>

                    <option value="Blow">
                        Blow
                    </option>

                    <option value="Soldadura">
                        Soldadura
                    </option>

                    <option value="Ensamble">
                        Ensamble
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Marca</label>

                <input
                    id="brand"
                    placeholder="Ej. Nissei">

            </div>

            <div class="form-group">

                <label>Modelo</label>

                <input
                    id="model"
                    placeholder="Ej. FNX-150">

            </div>

            <div class="form-group">

                <label>Status Máquina</label>

                <select id="maintenance_status">
                    <option value="Disponible">Disponible</option>
                    <option value="Mantenimiento">Mantenimiento</option>
                    <option value="Setup Largo">Setup Largo</option>
                    <option value="Falta Refacción">Falta Refacción</option>
                    <option value="Calidad">Calidad</option>
                    <option value="Fuera Servicio">Fuera Servicio</option>
                </select>
            </div>

            <div class="form-group">
                <label>Entre Barras H (mm)</label>
                <input id="tie_bar_h_mm" type="number" step="1" min="0" placeholder="Ej. 510">
            </div>

            <div class="form-group">
                <label>Entre Barras V (mm)</label>
                <input id="tie_bar_v_mm" type="number" step="1" min="0" placeholder="Ej. 510">
            </div>

            <div class="form-group">
                <label>Peso Máx. Molde (kg)</label>
                <input id="max_mold_weight_kg" type="number" step="0.1" min="0" placeholder="Ej. 1500">
            </div>

            <div class="form-group">
                <label>Capacidad Disparo (gr)</label>
                <input id="shot_capacity_gr" type="number" step="0.1" min="0" placeholder="Ej. 450">
            </div>

            <div class="form-group">
                <label>Turnos / Día (CR01)</label>
                <input id="shifts_per_day" type="number" step="1" min="1" max="4" value="3">
            </div>

            <div class="form-group">
                <label>Horas Prod. / Día</label>
                <input id="hours_per_day" type="number" step="0.5" min="0" max="24" value="22.5">
            </div>

            <div class="form-group">
                <label>Meta OEE (%)</label>
                <input id="oee_target_pct" type="number" step="0.5" min="0" max="100" value="85">
            </div>

        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="btnSaveMach"
                onclick="guardarMaquina()">

                <i class="fas fa-save"></i>
                <span id="lblSaveMach">Guardar Máquina</span>

            </button>
            <button class="btn btn-back" type="button" onclick="limpiar()">
                <i class="fas fa-eraser"></i>
                <span id="lblClearMach">Limpiar</span>
            </button>
        </div>

    </div>

    <div class="card" style="margin-top:20px;">

        <div class="filter-bar">
            <input id="qMach" type="text" placeholder="🔍 Buscar código, nombre, marca o modelo..." oninput="renderTable()">
            <select id="fArea" onchange="renderTable()">
                <option value="">Todas las áreas</option>
            </select>
            <select id="fMaintStatus" onchange="quickStatusChanged()">
                <option value="">Todos los estatus Mtto</option>
                <option value="Disponible">Disponible</option>
                <option value="Mantenimiento">Mantenimiento</option>
                <option value="Setup Largo">Setup Largo</option>
                <option value="Falta Refacción">Falta Refacción</option>
                <option value="Calidad">Calidad</option>
                <option value="Fuera Servicio">Fuera Servicio</option>
            </select>
        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th id="th_area">Área</th>
                        <th id="th_code">Código</th>
                        <th id="th_name">Nombre</th>
                        <th id="th_ton">Ton</th>
                        <th id="th_type">Tipo</th>
                        <th id="th_brand">Marca</th>
                        <th id="th_model">Modelo</th>
                        <th id="th_cap">Capacidad CR01</th>
                        <th id="th_shifts">Turnos / OEE</th>
                        <th id="th_status">Status Piso / Mtto</th>
                        <th id="th_active">Activo</th>
                        <th id="th_actions">Acciones</th>

                    </tr>

                </thead>

                <tbody id="body">

                    <tr>

                        <td colspan="13" class="empty">

                            Cargando...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

let editId = null;
let machinesData = [];
let canEditIng = true;
let quickRunOnly = false;
const escMach = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const MACH_I18N = {
    es: {
        back: 'Regresar',
        title: 'Administración de Máquinas',
        save: 'Guardar Máquina',
        clear: 'Limpiar',
        kAct: 'Máquinas Activas',
        kDisp: 'Disponibles Mtto',
        kRun: 'En Corrida MES',
        kMtto: 'En Mantenimiento / Paro',
        qPh: '🔍 Buscar código, nombre, marca o modelo...',
        allAreas: 'Todas las áreas',
        allMaint: 'Todos los estatus Mtto',
        thArea: 'Área', thCode: 'Código', thName: 'Nombre', thTon: 'Ton',
        thType: 'Tipo', thBrand: 'Marca', thModel: 'Modelo', thCap: 'Capacidad CR01',
        thShifts: 'Turnos / OEE', thStatus: 'Status Piso / Mtto', thActive: 'Activo', thActions: 'Acciones'
    },
    ko: {
        back: '돌아가기',
        title: '설비 (사출기) 마스터 관리',
        save: '설비 저장',
        clear: '초기화',
        kAct: '가동 등록 설비',
        kDisp: '보전 가용 상태',
        kRun: 'MES 생산 가동 중',
        kMtto: '점검 / 정지',
        qPh: '🔍 설비 코드, 설비명, 브랜드, 모델 검색...',
        allAreas: '모든 구역',
        allMaint: '모든 보전 상태',
        thArea: '구역', thCode: '코드', thName: '설비명', thTon: '톤수',
        thType: '유형', thBrand: '제조사', thModel: '모델', thCap: 'CR01 사양',
        thShifts: '교대 / OEE', thStatus: '현장 / 보전 상태', thActive: '활성', thActions: '관리'
    },
    en: {
        back: 'Back',
        title: 'Machine & Work Center Master',
        save: 'Save Machine',
        clear: 'Clear',
        kAct: 'Active Machines',
        kDisp: 'Available (Maint.)',
        kRun: 'MES Running',
        kMtto: 'Maintenance / Stop',
        qPh: '🔍 Search code, name, brand or model...',
        allAreas: 'All areas',
        allMaint: 'All Maint. statuses',
        thArea: 'Area', thCode: 'Code', thName: 'Name', thTon: 'Ton',
        thType: 'Type', thBrand: 'Brand', thModel: 'Model', thCap: 'CR01 Capacity',
        thShifts: 'Shifts / OEE', thStatus: 'Floor / Maint. Status', thActive: 'Active', thActions: 'Actions'
    }
};

function syncEditPermissions(){
    canEditIng = !(window.KraemAuth && typeof KraemAuth.canEdit === 'function') || KraemAuth.canEdit('ingenieria');
    const fc = document.getElementById('machFormCard');
    if (fc) fc.style.display = canEditIng ? 'block' : 'none';
}

document.addEventListener('kraem:authready', () => {
    syncEditPermissions();
    renderTable();
});

async function cargarAreasGenerales(){

    const sel =
        document.getElementById('area_general_id');

    sel.innerHTML = `
        <option value="">
            Cargando...
        </option>
    `;

    try{

        const { data, error } = await client
            .from('areas_generales')
            .select('*')
            .eq('active', true)
            .order('nombre');

        if(error) throw error;

        sel.innerHTML = `
            <option value="">
                Seleccione...
            </option>
        `;

        data.forEach(area => {

            sel.innerHTML += `
                <option value="${area.id}">
                    ${area.nombre}
                </option>
            `;
        });

    }catch(err){

        console.error(err);

        alert(
            'Error cargando áreas:\n' +
            err.message
        );
    }
}

function getStatusClass(status){
    switch(status){
        case 'Disponible':
            return 'status-disponible';
        case 'Setup Largo':
            return 'status-setup';
        case 'Mantenimiento':
        case 'Falta Refacción':
        case 'Calidad':
            return 'status-mantenimiento';
        case 'Fuera Servicio':
            return 'status-parada';
        default:
            return 'status-parada';
    }
}
async function load(){

    const body =
        document.getElementById('body');

    body.innerHTML = `
        <tr>
            <td colspan="13" class="empty">
                Cargando...
            </td>
        </tr>
    `;

    try{

        const { data, error } = await client
            .from('mes_machines')
            .select('*')
            .order('machine_code');

        if(error) throw error;

        machinesData = data || [];
        populateAreaFilter();
        updateMachKpis();
        renderTable();
    }catch(err){

        console.error(err);

        body.innerHTML = `
            <tr>
                <td colspan="13"
                    class="empty"
                    style="color:red;">

                    Error cargando máquinas

                </td>
            </tr>
        `;
    }
}

function populateAreaFilter(){
    const sel = document.getElementById('fArea');
    if (!sel) return;
    const prev = sel.value;
    const areasSet = [...new Set(machinesData.map(m => String(m.production_area || '').trim()).filter(Boolean))].sort();
    const lang = localStorage.getItem('lang') || 'es';
    const allTxt = (MACH_I18N[lang] && MACH_I18N[lang].allAreas) || 'Todas las áreas';
    sel.innerHTML = `<option value="">${escMach(allTxt)}</option>` +
        areasSet.map(a => `<option value="${escMach(a)}">${escMach(a)}</option>`).join('');
    if (prev && areasSet.includes(prev)) sel.value = prev;
}

function updateMachKpis(){
    const activas = machinesData.filter(m => m.active !== false);
    const disp = activas.filter(m => (m.maintenance_status || 'Disponible') === 'Disponible').length;
    const run = activas.filter(m => String(m.status || '').toUpperCase() === 'RUNNING').length;
    const mtto = activas.filter(m => (m.maintenance_status || 'Disponible') !== 'Disponible').length;
    document.getElementById('kpiActivas').textContent = activas.length;
    document.getElementById('kpiDisponibles').textContent = disp;
    document.getElementById('kpiRunning').textContent = run;
    document.getElementById('kpiMtto').textContent = mtto;
}

function quickFilterMach(kind){
    quickRunOnly = (kind === 'RUNNING');
    const ms = document.getElementById('fMaintStatus');
    if (kind === 'ALL' || kind === 'RUNNING') {
        if (ms) ms.value = '';
    } else if (kind === 'DISPONIBLE') {
        if (ms) ms.value = 'Disponible';
    } else if (kind === 'MTTO') {
        if (ms) ms.value = 'Mantenimiento';
    }
    renderTable(kind === 'MTTO');
}

function quickStatusChanged(){
    quickRunOnly = false;
    renderTable(false);
}

function renderTable(nonDispOnly = false){
    const body = document.getElementById('body');
    const q = (document.getElementById('qMach')?.value || '').trim().toUpperCase();
    const areaQ = (document.getElementById('fArea')?.value || '').trim();
    const maintQ = (document.getElementById('fMaintStatus')?.value || '').trim();

    const filtered = machinesData.filter(m => {
        const txt = `${m.machine_code || ''} ${m.machine_name || ''} ${m.brand || ''} ${m.model || ''} ${m.production_area || ''}`.toUpperCase();
        if (q && !txt.includes(q)) return false;
        if (areaQ && String(m.production_area || '').trim() !== areaQ) return false;
        if (quickRunOnly && String(m.status || '').toUpperCase() !== 'RUNNING') return false;
        if (nonDispOnly) return (m.maintenance_status || 'Disponible') !== 'Disponible';
        if (maintQ && (m.maintenance_status || 'Disponible') !== maintQ) return false;
        return true;
    });

    if(filtered.length === 0){
        body.innerHTML = `
            <tr>
                <td colspan="13" class="empty">
                    No hay máquinas registradas con los filtros actuales
                </td>
            </tr>
        `;
        return;
    }

    body.innerHTML = filtered.map(m => {
        const floorSt = String(m.status || 'AVAILABLE').toUpperCase();
        const isRun = floorSt === 'RUNNING';
        return `
        <tr>
            <td style="font-variant-numeric:tabular-nums;">${m.id}</td>
            <td>${escMach(m.production_area || '-')}</td>
            <td><strong>${escMach(m.machine_code || '-')}</strong></td>
            <td>${escMach(m.machine_name || '-')}</td>
            <td style="font-variant-numeric:tabular-nums;">${m.tonnage || '-'}</td>
            <td>${escMach(m.machine_type || '-')}</td>
            <td>${escMach(m.brand || '-')}</td>
            <td>${escMach(m.model || '-')}</td>
            <td style="font-size:12px; line-height:1.4;">
                ${(m.tie_bar_h_mm || m.tie_bar_v_mm) ? `<div>Barras: ${m.tie_bar_h_mm || '?'}×${m.tie_bar_v_mm || '?'} mm</div>` : ''}
                ${m.shot_capacity_gr ? `<div>Disp: ${m.shot_capacity_gr} g</div>` : ''}
                ${m.max_mold_weight_kg ? `<div>Molde máx: ${m.max_mold_weight_kg} kg</div>` : ''}
                ${(!m.tie_bar_h_mm && !m.tie_bar_v_mm && !m.shot_capacity_gr && !m.max_mold_weight_kg) ? '<span style="color:#64748b;">Sin definir</span>' : ''}
            </td>
            <td style="font-size:12px; line-height:1.4; font-variant-numeric:tabular-nums;">
                <div>${m.shifts_per_day ?? 3}T · ${m.hours_per_day ?? 22.5}h/d</div>
                <div style="color:#2563eb;">OEE ${m.oee_target_pct ?? 85}%</div>
            </td>
            <td>
                <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-start;">
                    <span class="machine-status ${isRun ? 'status-run' : 'status-avail'}">${escMach(floorSt)}</span>
                    <span class="machine-status ${getStatusClass(m.maintenance_status)}">${escMach(m.maintenance_status || 'Disponible')}</span>
                </div>
            </td>
            <td>
                <span class="status ${m.active ? 'active' : 'inactive'}">
                    ${m.active ? 'ACTIVA' : 'INACTIVA'}
                </span>
            </td>
            <td>
                ${canEditIng ? `
                <div class="action-buttons">
                    <button class="action-btn btn-edit" onclick="editarById(${m.id})" title="Editar">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="action-btn btn-toggle" onclick="toggleMachine(${m.id}, ${m.active !== false})">
                        ${m.active !== false ? 'OFF' : 'ON'}
                    </button>
                </div>` : '<span style="font-size:11px; color:var(--gray);">Solo lectura</span>'}
            </td>
        </tr>`;
    }).join('');
}

function editar(index){
    const m = machinesData[index];
    if (m) editarById(m.id);
}

function editarById(id){

    const m = machinesData.find(x => Number(x.id) === Number(id));

    if(!m) return;

    editId = m.id;

    document.getElementById('area_general_id').value =
        m.area_general_id || '';

    document.getElementById('machine_code').value =
        m.machine_code || '';

    document.getElementById('machine_name').value =
        m.machine_name || '';

    document.getElementById('tonnage').value =
        m.tonnage || '';

    document.getElementById('machine_type').value =
        m.machine_type || '';

    document.getElementById('brand').value =
        m.brand || '';

    document.getElementById('model').value =
        m.model || '';

    document.getElementById('maintenance_status').value =
        m.maintenance_status || 'Disponible';

    document.getElementById('tie_bar_h_mm').value =
        m.tie_bar_h_mm ?? '';

    document.getElementById('tie_bar_v_mm').value =
        m.tie_bar_v_mm ?? '';

    document.getElementById('max_mold_weight_kg').value =
        m.max_mold_weight_kg ?? '';

    document.getElementById('shot_capacity_gr').value =
        m.shot_capacity_gr ?? '';

    document.getElementById('shifts_per_day').value =
        m.shifts_per_day ?? 3;

    document.getElementById('hours_per_day').value =
        m.hours_per_day ?? 22.5;

    document.getElementById('oee_target_pct').value =
        m.oee_target_pct ?? 85;

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

async function guardarMaquina(){

    if (!canEditIng) {
        alert('Sin permisos para editar Ingeniería.');
        return;
    }

    const areaGeneral =
        document.getElementById('area_general_id')
        .value
        .trim();

    const machineCode =
        document.getElementById('machine_code')
        .value
        .trim()
        .toUpperCase();

    const machineName =
        document.getElementById('machine_name')
        .value
        .trim();

    if(!areaGeneral || !machineCode || !machineName){

        alert('Completa los campos obligatorios');
        return;
    }

    const dup = machinesData.find(m => (m.machine_code || '').trim().toUpperCase() === machineCode && Number(m.id) !== Number(editId));
    if (dup) {
        alert(`Ya existe una máquina con el código ${machineCode}.`);
        return;
    }

    const obj = {

        area_general_id: Number(areaGeneral),

        machine_code: machineCode,

        machine_name: machineName,

        production_area:
            document.getElementById('area_general_id')
            .options[
                document.getElementById('area_general_id')
                .selectedIndex
            ].text,

        tonnage:
            document.getElementById('tonnage').value || null,

        machine_type:
            document.getElementById('machine_type').value,

        brand:
            document.getElementById('brand').value,

        model:
            document.getElementById('model').value,

        maintenance_status:
            document.getElementById('maintenance_status').value,

        tie_bar_h_mm:
            parseFloat(document.getElementById('tie_bar_h_mm').value) || null,

        tie_bar_v_mm:
            parseFloat(document.getElementById('tie_bar_v_mm').value) || null,

        max_mold_weight_kg:
            parseFloat(document.getElementById('max_mold_weight_kg').value) || null,

        shot_capacity_gr:
            parseFloat(document.getElementById('shot_capacity_gr').value) || null,

        shifts_per_day:
            parseInt(document.getElementById('shifts_per_day').value) || 3,

        hours_per_day:
            parseFloat(document.getElementById('hours_per_day').value) || 22.5,

        oee_target_pct:
            parseFloat(document.getElementById('oee_target_pct').value) || 85,

        last_status_change:
            new Date().toISOString(),

        active: true
    };

    try{

        let error = null;

        if(editId){

            const res = await client
                .from('mes_machines')
                .update(obj)
                .eq('id', editId);

            error = res.error;

        }else{

            const res = await client
                .from('mes_machines')
                .insert([obj]);

            error = res.error;
        }

        if(error) throw error;

        alert('Máquina guardada y sincronizada correctamente');

        limpiar();

        await load();

    }catch(err){

        console.error(err);

        alert(
            'Error guardando máquina:\n' +
            err.message
        );
    }
}

async function toggleMachine(id,state){
    if (!canEditIng) return alert('Sin permisos para editar Ingeniería.');

    try{

        const { error } = await client
            .from('mes_machines')
            .update({
                active: !state
            })
            .eq('id',id);

        if(error) throw error;

        await load();

    }catch(err){

        console.error(err);

        alert(err.message);
    }
}

function limpiar(){

    editId = null;

    document.getElementById('area_general_id').value = '';

    document.getElementById('machine_code').value = '';

    document.getElementById('machine_name').value = '';

    document.getElementById('tonnage').value = '';

    document.getElementById('machine_type').value = '';

    document.getElementById('brand').value = '';

    document.getElementById('model').value = '';

    document.getElementById('maintenance_status').value =
        'Disponible';

    document.getElementById('tie_bar_h_mm').value = '';
    document.getElementById('tie_bar_v_mm').value = '';
    document.getElementById('max_mold_weight_kg').value = '';
    document.getElementById('shot_capacity_gr').value = '';
    document.getElementById('shifts_per_day').value = 3;
    document.getElementById('hours_per_day').value = 22.5;
    document.getElementById('oee_target_pct').value = 85;
}

function setLang(lang){
    const safeLang = MACH_I18N[lang] ? lang : 'es';
    localStorage.setItem('lang', safeLang);
    localStorage.setItem('kraem_lang', safeLang);
    document.documentElement.setAttribute('lang', safeLang);
    const t = MACH_I18N[safeLang];
    const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    setTxt('lblBackMach', t.back);
    setTxt('txtTitleMach', t.title);
    setTxt('lblSaveMach', t.save);
    setTxt('lblClearMach', t.clear);
    setTxt('lblKpiActivas', t.kAct);
    setTxt('lblKpiDisp', t.kDisp);
    setTxt('lblKpiRun', t.kRun);
    setTxt('lblKpiMtto', t.kMtto);
    setTxt('th_area', t.thArea);
    setTxt('th_code', t.thCode);
    setTxt('th_name', t.thName);
    setTxt('th_ton', t.thTon);
    setTxt('th_type', t.thType);
    setTxt('th_brand', t.thBrand);
    setTxt('th_model', t.thModel);
    setTxt('th_cap', t.thCap);
    setTxt('th_shifts', t.thShifts);
    setTxt('th_status', t.thStatus);
    setTxt('th_active', t.thActive);
    setTxt('th_actions', t.thActions);
    const qEl = document.getElementById('qMach');
    if (qEl) qEl.placeholder = t.qPh;
    const fAreaEl = document.getElementById('fArea');
    if (fAreaEl && fAreaEl.options.length) fAreaEl.options[0].textContent = t.allAreas;
    const fMaintEl = document.getElementById('fMaintStatus');
    if (fMaintEl && fMaintEl.options.length) fMaintEl.options[0].textContent = t.allMaint;
}

function toggleTheme(){
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    document.getElementById('themeIcon').className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

function applyTheme(){
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeIcon').className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

async function init(){

    applyTheme();
    syncEditPermissions();
    setLang(localStorage.getItem('lang') || 'es');

    await cargarAreasGenerales();

    await load();
}

document.addEventListener(
    'DOMContentLoaded',
    init
);

</script>
