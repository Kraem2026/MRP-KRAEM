<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KRAEM - Control de Producción Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --success: #16a34a; --warning: #d97706; --danger: #dc2626;
            --bg: #f1f5f9; --card: #ffffff; --text: #1e293b;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        /* Dashboard de Maquinas */
        .grid-machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .machine-card { 
            background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;
            text-align: center; cursor: pointer; transition: 0.3s; position: relative;
        }
        .machine-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .machine-card i { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        .machine-status { position: absolute; top: 10px; right: 10px; width: 12px; height: 12px; border-radius: 50%; background: #94a3b8; }
        .status-active { background: var(--success); shadow: 0 0 8px var(--success); }

        /* Modal Formulario */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: #fff; width: 90%; max-width: 1000px; margin: 2% auto; padding: 30px; border-radius: 16px; max-height: 90vh; overflow-y: auto; }
        
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .full-width { grid-column: 1 / -1; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background: #f1f5f9; color: var(--primary); border: 1px solid var(--primary); }
        .btn-finalize { background: var(--success); color: white; }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1>Panel de Piso: Producción Real-Time</h1>
            <p>Selecciona una máquina para reportar</p>
        </div>
        <select id="filter-area" onchange="loadMachines()" style="width: 250px;">
            <option value="">Todas las Áreas</option>
        </select>
    </header>

    <div id="machine-grid" class="grid-machines">
        </div>

    <div id="prodModal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="modal-title">Reporte de Producción</h2>
                <button onclick="closeModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>

            <div class="form-grid">
                <div class="input-group">
                    <label>Turno</label>
                    <select id="f_turno"></select>
                </div>
                <div class="input-group">
                    <label>Líder / Operador</label>
                    <select id="f_lider"></select>
                </div>
                <div class="input-group">
                    <label>N/P (Número de Parte)</label>
                    <input type="text" id="f_np" list="part-list">
                    <datalist id="part-list"></datalist>
                </div>

                <div class="input-group">
                    <label>Tiros Totales</label>
                    <input type="number" id="f_tiros" oninput="calcularTotales()">
                </div>
                <div class="input-group">
                    <label>Cavidades LH</label>
                    <input type="number" id="f_cav_lh">
                </div>
                <div class="input-group">
                    <label>Cavidades RH</label>
                    <input type="number" id="f_cav_rh">
                </div>

                <div class="input-group">
                    <label style="color:var(--success)">Piezas OK (Finales)</label>
                    <input type="number" id="f_cant_ok" style="border-color:var(--success); font-weight:bold;">
                </div>
                <div class="input-group">
                    <label style="color:var(--danger)">Scrap Total</label>
                    <input type="number" id="f_scrap" value="0">
                </div>
                <div class="input-group">
                    <label>Peso Pieza (gr)</label>
                    <input type="number" id="f_peso" step="0.01">
                </div>

                <div class="input-group full-width">
                    <label>Observaciones del Turno</label>
                    <textarea id="f_obs" rows="2" placeholder="Paros técnicos, fallas de molde, etc..."></textarea>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-save" onclick="saveData('abierto')">
                    <i class="fas fa-pause-circle"></i> GUARDAR AVANCE
                </button>
                <button class="btn btn-finalize" onclick="saveData('finalizado')">
                    <i class="fas fa-check-double"></i> FINALIZAR Y ENVIAR A ALMACÉN
                </button>
            </div>
        </div>
    </div>

<script>
    let selectedMachine = null;

    async function init() {
        // Cargar Áreas
        const { data: areas } = await client.from('rh_areas').select('*').eq('activo', true);
        const filter = document.getElementById('filter-area');
        areas.forEach(a => filter.innerHTML += `<option value="${a.nombre}">${a.nombre}</option>`);

        // Cargar Turnos
        const { data: turnos } = await client.from('rh_turnos').select('*');
        turnos.forEach(t => document.getElementById('f_turno').innerHTML += `<option value="${t.id}">${t.nombre}</option>`);

        // Cargar Empleados
        const { data: emps } = await client.from('rh_empleados').select('id, nombre_completo').eq('estatus', 'ACTIVO');
        emps.forEach(e => document.getElementById('f_lider').innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`);

        loadMachines();
    }

    async function loadMachines() {
        const areaFilter = document.getElementById('filter-area').value;
        let query = client.from('machines').select('*');
        if(areaFilter) query = query.eq('area', areaFilter);
        
        const { data: machines } = await query;
        const grid = document.getElementById('machine-grid');
        grid.innerHTML = '';

        machines.forEach(m => {
            grid.innerHTML += `
                <div class="machine-card" onclick="openForm('${m.id}', '${m.machine_name}')">
                    <div class="machine-status"></div>
                    <i class="fas fa-microchip"></i>
                    <h3>${m.machine_name}</h3>
                    <small>${m.area}</small>
                </div>
            `;
        });
    }

    function openForm(id, name) {
        selectedMachine = { id, name };
        document.getElementById('modal-title').innerText = `Reporte: ${name}`;
        document.getElementById('prodModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('prodModal').style.display = 'none'; }

    async function saveData(status) {
        const payload = {
            machine_id: selectedMachine.id,
            turno_id: document.getElementById('f_turno').value,
            lider_id: document.getElementById('f_lider').value,
            part_number: document.getElementById('f_np').value,
            qty_ok: parseInt(document.getElementById('f_cant_ok').value),
            qty_scrap: parseInt(document.getElementById('f_scrap').value),
            status: status,
            obs: document.getElementById('f_obs').value,
            created_at: new Date()
        };

        const { error } = await client.from('produccion_log').upsert(payload);
        
        if(!error && status === 'finalizado') {
            // Lógica de inventario (Insertar en historial y sumar a stock)
            await registrarInventario(payload);
        }

        alert(status === 'finalizado' ? "Producción finalizada y stock actualizado" : "Avance guardado");
        closeModal();
    }

    async function registrarInventario(p) {
        // 1. Buscar ID de la parte
        const { data: part } = await client.from('parts').select('id').eq('part_number', p.part_number).single();
        if(!part) return;

        // 2. Insertar movimiento en historial (como el tuyo de historial.html)
        await client.from('inventory_movements').insert({
            part_id: part.id,
            quantity: p.qty_ok,
            movement_type: 'ENTRADA PRODUCCION',
            to_location: 'PISO',
            comment: `Cierre de turno maquina ${selectedMachine.name}`
        });

        // 3. Sumar al inventario general
        // Aquí llamarías a tu función de update de stock
    }

    window.onload = init;
</script>
</body>
</html>
