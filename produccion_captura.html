<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MES - Iniciar Corrida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1e293b;
    --border:#dfe6ee;
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    font-family:Segoe UI,sans-serif;
    color:var(--text);
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    border:1px solid var(--border);
    box-shadow:0 4px 12px rgba(0,0,0,.05);
}

h1,h2{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
    text-transform:uppercase;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    box-sizing:border-box;
    font-size:14px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.operator-row,
.output-row{
    border:1px solid var(--border);
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

.status-box{
    padding:12px;
    border-radius:10px;
    background:#ecfdf5;
    color:#166534;
    font-weight:bold;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="status-box" id="sessionInfo">
Validando sesión...
</div>

<h1>MES - Iniciar Corrida</h1>

<div class="card">

<h2>Información General</h2>

<div class="grid">

<div>
<label>Área</label>
<select id="areaSelect"></select>
</div>

<div>
<label>Máquina</label>
<select id="machineSelect"></select>
</div>

<div>
<label>Turno</label>
<select id="shiftSelect">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</div>

<div>
<label>Molde</label>
<select id="moldSelect"></select>
</div>

<div>
<label>Tiempo Ciclo (seg)</label>
<input type="number" id="cycleTime">
</div>

<div>
<label>Cavidades Totales</label>
<input type="number" id="totalCavities">
</div>

<div>
<label>Tipo Resina</label>
<input type="text" id="resinType">
</div>

<div>
<label>Lote Resina</label>
<input type="text" id="resinLot">
</div>

<div>
<label>Color Resina</label>
<input type="text" id="resinColor">
</div>

<div>
<label>Peso Purga (g)</label>
<input type="number" id="purgeWeight">
</div>

<div>
<label>Peso Vena (g)</label>
<input type="number" id="runnerWeight">
</div>

</div>

</div>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">
<h2>Partes Producidas</h2>

<button class="btn-primary" onclick="addOutputRow()">
+ Agregar Parte
</button>
</div>

<div id="outputsContainer"></div>

</div>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">
<h2>Operadores</h2>

<button class="btn-primary" onclick="addOperatorRow()">
+ Agregar Operador
</button>
</div>

<div id="operatorsContainer"></div>

</div>

<button class="btn-success" style="width:100%;font-size:18px;" onclick="startRun()">
INICIAR CORRIDA
</button>

</div>

<script>

let machines = [];
let molds = [];
let parts = [];
let employees = [];

async function init(){

    try{

        sessionInfo.innerHTML = "Conectando con Supabase...";

        const {
            data:{ session },
            error:sessionError
        } = await client.auth.getSession();

        console.log("SESSION:", session);
        console.log("SESSION ERROR:", sessionError);

        if(sessionError){
            console.error(sessionError);
        }

        sessionInfo.innerHTML =
        session?.user?.email
        ? "👤 " + session.user.email
        : "⚠️ Sin sesión activa";

        /*
        =========================
        AREAS
        =========================
        */

        const {
            data:areas,
            error:areasError
        } = await client
        .from('areas')
        .select('*')
        .order('area_name');

        console.log("AREAS:", areas);
        console.log("AREAS ERROR:", areasError);

        if(areasError){
            alert("Error cargando areas: " + areasError.message);
            return;
        }

        areaSelect.innerHTML = `
        <option value="">
            Seleccione área
        </option>
        `;

        (areas || []).forEach(a=>{

            areaSelect.innerHTML += `
            <option value="${a.id}">
                ${a.area_name}
            </option>
            `;
        });

        /*
        =========================
        MAQUINAS
        =========================
        */

        const {
            data:machinesData,
            error:machinesError
        } = await client
        .from('machines')
        .select('*')
        .order('machine_name');

        console.log("MACHINES:", machinesData);
        console.log("MACHINES ERROR:", machinesError);

        if(machinesError){
            alert("Error cargando máquinas: " + machinesError.message);
            return;
        }

        machines = machinesData || [];

        renderMachines();

        /*
        =========================
        MOLDES
        =========================
        */

        const {
            data:moldsData
        } = await client
        .from('molds')
        .select('*')
        .order('name');

        molds = moldsData || [];

        moldSelect.innerHTML = `
        <option value="">
            Seleccione molde
        </option>
        `;

        molds.forEach(m=>{

            moldSelect.innerHTML += `
            <option value="${m.id}">
                ${m.name || m.id}
            </option>
            `;
        });

        /*
        =========================
        PARTES
        =========================
        */

        const {
            data:partsData
        } = await client
        .from('parts')
        .select('id,part_number,part_name')
        .limit(3000);

        parts = partsData || [];

        /*
        =========================
        EMPLEADOS
        =========================
        */

        const {
            data:employeesData
        } = await client
        .from('rh_empleados')
        .select('id,nombre_completo')
        .order('nombre_completo');

        employees = employeesData || [];

        addOutputRow();
        addOperatorRow();

        sessionInfo.innerHTML += " ✅";

    }catch(err){

        console.error(err);

        alert(err.message);

        sessionInfo.innerHTML =
        "❌ Error inicializando";
    }
}

function renderMachines(){

    const area_id = areaSelect.value;

    machineSelect.innerHTML = `
    <option value="">
        Seleccione máquina
    </option>
    `;

    let filteredMachines = machines;

    /*
    FILTRA POR AREA
    */

    if(area_id){

        filteredMachines = machines.filter(m=>{

            return String(m.area_id) === String(area_id);

        });
    }

    filteredMachines.forEach(m=>{

        machineSelect.innerHTML += `
        <option value="${m.id}">
            ${m.machine_name || ('MAQ-' + m.id)}
        </option>
        `;
    });
}

function addOutputRow(){

    const div = document.createElement('div');

    div.className = 'output-row';

    let options = '';

    parts.forEach(p=>{

        options += `
        <option value="${p.id}">
            ${p.part_number || ''} - ${p.part_name || ''}
        </option>
        `;
    });

    div.innerHTML = `

    <div class="grid">

        <div>
            <label>Parte</label>

            <select class="partSelect">
                ${options}
            </select>
        </div>

        <div>
            <label>Lado</label>

            <select class="sideSelect">
                <option value="LH">LH</option>
                <option value="RH">RH</option>
                <option value="NA">NA</option>
            </select>
        </div>

        <div>
            <label>Cavidades</label>

            <input
                type="number"
                class="cavitiesInput"
                value="1">
        </div>

        <div>
            <label>Peso Pieza (g)</label>

            <input
                type="number"
                class="pieceWeightInput">
        </div>

    </div>

    <button
        class="btn-danger"
        style="margin-top:12px;"
        onclick="this.parentElement.remove()">

        Eliminar

    </button>
    `;

    outputsContainer.appendChild(div);
}

function addOperatorRow(){

    const div = document.createElement('div');

    div.className='operator-row';

    let options='';

    employees.forEach(e=>{

        options += `
        <option value="${e.id}">
            ${e.nombre_completo || 'SIN NOMBRE'}
        </option>
        `;
    });

    div.innerHTML = `

    <div class="grid">

        <div>

            <label>Empleado</label>

            <select class="employeeSelect">
                ${options}
            </select>

        </div>

        <div>

            <label>Rol</label>

            <select class="roleSelect">

                <option value="OPERADOR">
                    OPERADOR
                </option>

                <option value="LIDER">
                    LIDER
                </option>

                <option value="EMPAQUE">
                    EMPAQUE
                </option>

                <option value="INSPECCION">
                    INSPECCION
                </option>

            </select>

        </div>

    </div>

    <button
        class="btn-danger"
        style="margin-top:12px;"
        onclick="this.parentElement.remove()">

        Eliminar

    </button>
    `;

    operatorsContainer.appendChild(div);
}

async function startRun(){

    try{

        const machine_id = machineSelect.value;

        const mold_id = moldSelect.value;

        const shift =
        shiftSelect.value;

        const cycle_time =
        parseFloat(cycleTime.value || 0);

        const total_cavities =
        parseInt(totalCavities.value || 0);

        const resin_type =
        resinType.value;

        const resin_lot =
        resinLot.value;

        const resin_color =
        resinColor.value;

        const purge_weight_g =
        parseFloat(purgeWeight.value || 0);

        const runner_weight_g =
        parseFloat(runnerWeight.value || 0);

        if(!machine_id){

            alert("Selecciona máquina");
            return;
        }

        const runPayload = {

            machine_id,
            mold_id,
            shift,

            cycle_time,

            cavities:total_cavities,

            resin_type,
            resin_lot,
            resin_color,

            purge_weight_g,
            runner_weight_g,

            status:'RUNNING',

            start_time:new Date().toISOString()
        };

        console.log(runPayload);

        const {
            data:runData,
            error:runError
        } = await client
        .from('runs')
        .insert([runPayload])
        .select()
        .single();

        if(runError) throw runError;

        const run_id = runData.id;

        /*
        OUTPUTS
        */

        const outputsRows =
        document.querySelectorAll('.output-row');

        let outputsToInsert = [];

        outputsRows.forEach(row=>{

            outputsToInsert.push({

                run_id,

                part_id:
                row.querySelector('.partSelect').value,

                side:
                row.querySelector('.sideSelect').value,

                cavities:
                parseInt(
                row.querySelector('.cavitiesInput').value || 1
                ),

                piece_weight_g:
                parseFloat(
                row.querySelector('.pieceWeightInput').value || 0
                )
            });
        });

        if(outputsToInsert.length){

            const { error } = await client
            .from('run_outputs')
            .insert(outputsToInsert);

            if(error) throw error;
        }

        /*
        OPERADORES
        */

        const operatorRows =
        document.querySelectorAll('.operator-row');

        let operatorsToInsert = [];

        operatorRows.forEach(row=>{

            operatorsToInsert.push({

                run_id,

                employee_id:
                row.querySelector('.employeeSelect').value,

                role:
                row.querySelector('.roleSelect').value
            });
        });

        if(operatorsToInsert.length){

            const { error } = await client
            .from('run_operators')
            .insert(operatorsToInsert);

            if(error) throw error;
        }

        /*
        UPDATE MACHINE
        */

        const { error:updateMachineError } =
        await client
        .from('machines')
        .update({

            status:'RUNNING',

            current_run_id:run_id,

            current_mold_id:mold_id,

            last_start_time:new Date().toISOString()
        })
        .eq('id',machine_id);

        if(updateMachineError)
        throw updateMachineError;

        alert("✅ CORRIDA INICIADA");

        location.reload();

    }catch(err){

        console.error(err);

        alert("ERROR: " + err.message);
    }
}

areaSelect.addEventListener(
'change',
renderMachines
);

document.addEventListener(
'DOMContentLoaded',
init
);

</script>

</body>
</html>
