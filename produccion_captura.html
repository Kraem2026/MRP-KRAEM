<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KRAEM - Sistema de Producción Industrial</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #010c12; --bg-card: #0a1f2c; --bg-modal: #05141c;
            --bg-input: rgba(255, 255, 255, 0.05); --text-main: #e2e8f0;
            --accent: #38bdf8; --border: rgba(56, 189, 248, 0.2);
            --success: #22c55e; --warning: #eab308;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; }
        
        /* Grid de Máquinas */
        .grid-piso { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
        .m-card { background: var(--bg-card); padding: 20px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid var(--border); transition: 0.3s; }
        .m-card:hover { border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        /* Modal e Inputs */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:start; overflow-y:auto; padding: 20px 0; z-index:1000; }
        .modal-content { background: var(--bg-modal); width: 95%; max-width: 1300px; border-radius: 12px; padding: 30px; border: 1px solid var(--border); }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .section-header { grid-column: 1/-1; border-bottom: 2px solid var(--accent); padding: 10px 0 5px; color: var(--accent); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; margin-top: 15px; }
        
        input, select, textarea { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; color: white; box-sizing: border-box; }
        input[readonly] { background: rgba(0,0,0,0.4); color: #94a3b8; cursor: not-allowed; }
        
        .operator-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
        
        /* Displays de Cálculo */
        .kpi-box { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-val { display: block; font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .kpi-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; }

        .btn-group { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
        .btn { padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-success { background: var(--success); color: white; }
    </style>
</head>
<body>

<div class="grid-piso" id="machineGrid"></div>

<div class="modal-overlay" id="mainModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin:0 0 20px 0; color: var(--accent);">REGISTRO DE PRODUCCIÓN</h2>

        <!-- SECCIÓN 1: DATOS GENERALES Y PROCESO -->
        <div class="form-grid">
            <div class="section-header">Información de Proceso y Material</div>
            <div><label>Líder</label><input type="text" id="f_leader"></div>
            <div><label>Turno</label><select id="f_turno"><option>1ero</option><option>2do</option><option>3ero</option></select></div>
            <div><label>Tipo de Resina</label><input type="text" id="f_resina_tipo"></div>
            <div><label>Lote de Resina</label><input type="text" id="f_resina_lote"></div>
            <div><label>Peso Purga (g)</label><input type="number" id="f_purga" value="0"></div>
            <div><label>Ciclo Real (seg)</label><input type="number" id="f_ciclo" step="0.1" oninput="runCalcs()"></div>
            <div><label>Peso Vena (g)</label><input type="number" id="f_p_vena"></div>
            <div class="kpi-box"><span class="kpi-val" id="res_uph">0</span><label class="kpi-label">UPH Teórico</label></div>
        </div>

        <!-- SECCIÓN 2: TIEMPOS Y TIROS -->
        <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
            <div class="section-header">Tiempos y Contador</div>
            <div><label>Arranque</label><input type="time" id="f_h_arr" onchange="runCalcs()"></div>
            <div><label>Paro</label><input type="time" id="f_h_paro" onchange="runCalcs()"></div>
            <div><label>Hrs Laboradas</label><input type="text" id="res_hrs" readonly value="0.0"></div>
            <div><label>Tiros Totales (Contador)</label><input type="number" id="f_tiros" oninput="runCalcs()"></div>
            <div class="kpi-box" style="border-color: var(--warning);"><span class="kpi-val" id="res_eff" style="color:var(--warning)">0%</span><label class="kpi-label">Eficiencia</label></div>
        </div>

        <!-- SECCIÓN 3: OPERADORES (DINÁMICO) -->
        <div class="section-header">Personal Operativo (Hasta 5 Operadores)</div>
        <div class="operator-grid">
            <input type="text" id="op1" placeholder="Operador 1">
            <input type="text" id="op2" placeholder="Operador 2">
            <input type="text" id="op3" placeholder="Operador 3">
            <input type="text" id="op4" placeholder="Operador 4">
            <input type="text" id="op5" placeholder="Operador 5">
        </div>

        <!-- SECCIÓN 4: DETALLE POR LADO (Doble Columna) -->
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <!-- LADO LH / ÚNICO -->
            <div style="flex: 1; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
                <h4 id="label_lh" style="margin-top:0">PIEZA LH / ÚNICA</h4>
                <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                    <div style="grid-column: 1/-1;"><label># Parte</label><input type="text" id="lh_part" onchange="fetchPart('lh')"></div>
                    <div style="grid-column: 1/-1;"><label>Descripción</label><input type="text" id="lh_desc" readonly></div>
                    <div><label>Cavidades</label><input type="number" id="lh_cav" value="1" oninput="runCalcs()"></div>
                    <div><label>Peso Pza (g)</label><input type="number" id="lh_w"></div>
                    <div><label>Scrap (Pzas)</label><input type="number" id="lh_scrap" value="0" oninput="runCalcs()"></div>
                    <div class="kpi-box"><span class="kpi-val" id="lh_ok">0</span><label class="kpi-label">Pzas OK</label></div>
                </div>
            </div>

            <!-- LADO RH (Opcional) -->
            <div id="box_rh" style="flex: 1; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
                <h4 style="margin-top:0">LADO RH</h4>
                <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                    <div style="grid-column: 1/-1;"><label># Parte RH</label><input type="text" id="rh_part" onchange="fetchPart('rh')"></div>
                    <div style="grid-column: 1/-1;"><label>Descripción RH</label><input type="text" id="rh_desc" readonly></div>
                    <div><label>Cavidades RH</label><input type="number" id="rh_cav" value="1" oninput="runCalcs()"></div>
                    <div><label>Peso RH (g)</label><input type="number" id="rh_w"></div>
                    <div><label>Scrap RH</label><input type="number" id="rh_scrap" value="0" oninput="runCalcs()"></div>
                    <div class="kpi-box"><span class="kpi-val" id="rh_ok">0</span><label class="kpi-label">Pzas OK</label></div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" style="background:#475569; color:white" onclick="closeModal()">CANCELAR</button>
            <button class="btn btn-success" onclick="saveRecord()">REGISTRAR PRODUCCIÓN FINAL</button>
        </div>
    </div>
</div>

<script>
    // Iniciar Grid
    for(let i=1; i<=34; i++){
        const d = document.createElement('div');
        d.className = 'm-card';
        d.innerHTML = `<i class="fas fa-industry"></i><br><b>M-${i}</b>`;
        d.onclick = () => { document.getElementById('modalTitle').innerText = `MÁQUINA ${i}`; document.getElementById('mainModal').style.display='flex'; };
        document.getElementById('machineGrid').appendChild(d);
    }

    function closeModal() { document.getElementById('mainModal').style.display='none'; }

    async function fetchPart(side) {
        const pNum = document.getElementById(`${side}_part`).value;
        const { data } = await supabase.from('parts').select('*').eq('part_number', pNum).single();
        if(data) {
            document.getElementById(`${side}_desc`).value = data.part_name || '';
            document.getElementById(`${side}_w`).value = data.part_weight_gr || '';
            document.getElementById(`${side}_cav`).value = data.cavities || 1;
            if(side === 'lh') {
                document.getElementById('f_ciclo').value = data.cycle_time_seg || '';
                document.getElementById('f_p_vena').value = data.runner_weight_gr || '';
                document.getElementById('f_resina_tipo').value = data.resin_type || '';
            }
            runCalcs();
        }
    }

    function runCalcs() {
        // Horas
        const s = document.getElementById('f_h_arr').value, e = document.getElementById('f_h_paro').value;
        let hrs = 0;
        if(s && e) {
            const d1 = new Date(`2026-01-01T${s}`), d2 = new Date(`2026-01-01T${e}`);
            hrs = (d2 - d1) / 3600000;
            if(hrs < 0) hrs += 24;
        }
        document.getElementById('res_hrs').value = hrs.toFixed(2);

        // UPH y Eficiencia
        const ciclo = parseFloat(document.getElementById('f_ciclo').value) || 0;
        const tiros = parseInt(document.getElementById('f_tiros').value) || 0;
        const uph = ciclo > 0 ? (3600 / ciclo) : 0;
        document.getElementById('res_uph').innerText = Math.round(uph);

        // Cálculo por lado
        let totalOk = 0, totalPlan = 0;
        ['lh', 'rh'].forEach(side => {
            const cav = parseInt(document.getElementById(`${side}_cav`).value) || 0;
            const scrap = parseInt(document.getElementById(`${side}_scrap`).value) || 0;
            const ok = (tiros * cav) - scrap;
            document.getElementById(`${side}_ok`).innerText = ok;
            totalOk += (tiros * cav);
            totalPlan += (uph * cav * hrs);
        });

        const eff = totalPlan > 0 ? (totalOk / totalPlan) * 100 : 0;
        document.getElementById('res_eff').innerText = Math.min(100, eff).toFixed(1) + "%";
    }

    async function saveRecord() {
        if(!confirm("¿Registrar producción final?")) return;
        
        // Recopilar Operadores (solo los que tengan nombre)
        const ops = [1,2,3,4,5].map(i => document.getElementById(`op${i}`).value).filter(v => v !== "").join(", ");

        try {
            const record = {
                machine: document.getElementById('modalTitle').innerText,
                leader: document.getElementById('f_leader').value,
                operators: ops,
                resin_type: document.getElementById('f_resina_tipo').value,
                resin_batch: document.getElementById('f_resina_lote').value,
                purge_weight: parseFloat(document.getElementById('f_purga').value),
                cycle_real: parseFloat(document.getElementById('f_ciclo').value),
                total_shots: parseInt(document.getElementById('f_tiros').value),
                created_at: new Date()
            };

            // Guardar en Historial y Actualizar Maestra 'parts' (Aprendizaje)[cite: 2, 3]
            ['lh', 'rh'].forEach(async side => {
                const pNum = document.getElementById(`${side}_part`).value;
                if(pNum) {
                    await supabase.from('parts').update({
                        cycle_time_seg: record.cycle_real,
                        part_weight_gr: parseFloat(document.getElementById(`${side}_w`).value),
                        runner_weight_gr: parseFloat(document.getElementById('f_p_vena').value),
                        cavities: parseInt(document.getElementById(`${side}_cav`).value)
                    }).eq('part_number', pNum);
                }
            });

            alert("Producción registrada con éxito.");
            closeModal();
        } catch (e) { alert("Error al guardar."); }
    }

    setInterval(() => { /* Reloj opcional */ }, 1000);
</script>
</body>
</html>
