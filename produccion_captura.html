<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KRAEM - Registro de Producción e Inventario</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --success: #16a34a; --warning: #d97706; --danger: #dc2626;
            --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 900px; margin: auto; background: var(--card); padding: 30px; border-radius: 16px; shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .header-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; border-bottom: 2px solid var(--bg); padding-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        select, input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .btn { padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        
        .btn-save { background: var(--bg); color: var(--primary); border: 2px solid var(--primary); }
        .btn-save:hover { background: #eff6ff; }
        
        .btn-finalize { background: var(--success); color: white; }
        .btn-finalize:hover { background: #15803d; }

        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .open { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Reporte de Producción Diaria</h2>
        <span id="status-label" class="status-badge open">Nuevo / Abierto</span>
    </div>

    <div class="header-form">
        <div class="input-group">
            <label>Área de Producción</label>
            <select id="f_area" onchange="loadMachines()">
                <option value="">Seleccione Área...</option>
                <option value="INYECCION">Inyección</option>
                <option value="ENSAMBLE">Ensamble</option>
            </select>
        </div>
        <div class="input-group">
            <label>Máquina / Estación</label>
            <select id="f_maquina">
                <option value="">Seleccione Máquina...</option>
            </select>
        </div>
    </div>

    <div class="header-form">
        <div class="input-group">
            <label>Parte (N/P)</label>
            <input type="text" id="f_parte" placeholder="Ej. PN-1234">
        </div>
        <div class="input-group">
            <label>Cantidad Producida (OK)</label>
            <input type="number" id="f_cant_ok" value="0">
        </div>
    </div>

    <div class="header-form">
        <div class="input-group">
            <label>Scrap Generado</label>
            <input type="number" id="f_scrap" value="0" style="color: var(--danger);">
        </div>
        <div class="input-group">
            <label>Líder de Turno</label>
            <input type="text" id="f_lider" placeholder="Nombre del responsable">
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-save" onclick="processRecord('abierto')">
            <i class="fas fa-save"></i> GUARDAR PROGRESO
        </button>

        <button class="btn btn-finalize" onclick="processRecord('finalizado')">
            <i class="fas fa-check-circle"></i> FINALIZAR Y ENTRAR A INVENTARIO
        </button>
    </div>
</div>

<script>
    // Configuración de máquinas por área
    const maquinas = {
        "INYECCION": ["NISSEI 1", "NISSEI 2", "NISSEI 3", "ENGEL 1"],
        "ENSAMBLE": ["LINEA A", "LINEA B", "BANCO TRASERO"]
    };

    function loadMachines() {
        const area = document.getElementById('f_area').value;
        const sel = document.getElementById('f_maquina');
        sel.innerHTML = '<option value="">Seleccione Máquina...</option>';
        if(maquinas[area]) {
            maquinas[area].forEach(m => sel.innerHTML += `<option value="${m}">${m}</option>`);
        }
    }

    async function processRecord(status) {
        const data = {
            area: document.getElementById('f_area').value,
            maquina: document.getElementById('f_maquina').value,
            parte: document.getElementById('f_parte').value,
            cantidad_ok: parseInt(document.getElementById('f_cant_ok').value),
            scrap: parseInt(document.getElementById('f_scrap').value),
            lider: document.getElementById('f_lider').value,
            estado: status,
            fecha: new Date().toISOString()
        };

        if(!data.area || !data.parte) return alert("Completa los datos básicos");

        // 1. Guardar en la tabla de Producción
        const { error: prodError } = await client.from('produccion_diaria').upsert(data);

        if (prodError) return alert("Error al guardar producción");

        // 2. LÓGICA DE INVENTARIO: Solo si se finaliza el turno
        if (status === 'finalizado') {
            await triggerInventoryEntry(data);
        }

        alert(status === 'finalizado' ? "Turno finalizado e inventario actualizado" : "Progreso guardado");
        if(status === 'finalizado') location.reload();
    }

    async function triggerInventoryEntry(prodData) {
        // Obtenemos el ID de la parte basándonos en el N/P
        const { data: parte } = await client.from('parts').select('id').eq('part_number', prodData.parte).single();
        
        if (!parte) return console.error("Parte no encontrada en catálogo");

        // A. Registrar en Historial (Basado en tu archivo historial.html)
        await client.from('inventory_movements').insert({
            part_id: parte.id,
            movement_type: 'ENTRADA PRODUCCION',
            quantity: prodData.cantidad_ok,
            from_location: 'PISO PRODUCCION',
            to_location: 'ALMACEN PT',
            area: prodData.area,
            comment: `Producción finalizada en ${prodData.maquina}`
        });

        // B. Actualizar Stock Real (Basado en tu archivo captura_inventario.html)
        // Nota: Aquí se asume que existe una tabla o vista de stock por ubicación
        const { data: stockExistente } = await client.from('inventory').select('*')
            .eq('part_id', parte.id)
            .eq('location_id', 1) // Supongamos que ID 1 es Almacén PT
            .single();

        if (stockExistente) {
            await client.from('inventory')
                .update({ quantity: stockExistente.quantity + prodData.cantidad_ok })
                .eq('id', stockExistente.id);
        } else {
            await client.from('inventory').insert({
                part_id: parte.id,
                location_id: 1,
                quantity: prodData.cantidad_ok
            });
        }
    }
</script>
</body>
</html>
