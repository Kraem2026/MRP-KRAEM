<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KRAEM - Terminal de Producción</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .console { background: #000; border: 1px solid #334155; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #4ade80; margin-bottom: 20px; max-height: 150px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #334155; cursor: pointer; }
        .card:hover { border-color: #38bdf8; background: #334155; }
        .card i { font-size: 2rem; color: #38bdf8; }
        .btn-fix { background: #e11d48; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        
        /* Modal simple */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); padding:20px; }
        .modal-content { background:#fff; color:#000; padding:20px; border-radius:10px; max-width:500px; margin:auto; }
        input, select { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
    </style>
</head>
<body>

    <h2><i class="fas fa-microchip"></i> Panel de Piso - KRAEM</h2>
    
    <div class="console" id="log">
        > Sistema iniciado...<br>
    </div>

    <div id="setup-helper" style="display:none; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #e11d48;">
        <strong>¡Atención!</strong> La tabla 'machines' no devolvió datos. <br>
        <button class="btn-fix" onclick="crearMaquinaPrueba()">Crear Máquina de Prueba (NISSEI 1)</button>
    </div>

    <div class="grid" id="machine-grid"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="m-title"></h3>
            <label>N/P Parte</label>
            <input type="text" id="f_parte" placeholder="Ingrese parte">
            <label>Cantidad OK</label>
            <input type="number" id="f_ok" value="0">
            <button onclick="guardar()" style="width:100%; padding:15px; background:#16a34a; color:white; border:none; border-radius:5px; font-weight:bold;">GUARDAR EN PRODUCCIÓN</button>
            <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; background:none; border:none; color:gray;">Cerrar</button>
        </div>
    </div>

<script>
    const db = client; // Usamos tu objeto de config.js
    const logDiv = document.getElementById('log');

    function print(msg) { logDiv.innerHTML += `> ${msg}<br>`; logDiv.scrollTop = logDiv.scrollHeight; }

    async function init() {
        try {
            print("Consultando tabla 'machines'...");
            const { data, error } = await db.from('machines').select('id, machine_name, area');
            
            if (error) {
                print(`ERROR: ${error.message}`);
                return;
            }

            if (!data || data.length === 0) {
                print("ADVERTENCIA: La tabla está vacía (0 máquinas).");
                document.getElementById('setup-helper').style.display = 'block';
            } else {
                print(`ÉXITO: Se cargaron ${data.length} máquinas.`);
                document.getElementById('setup-helper').style.display = 'none';
                render(data);
            }
        } catch (err) {
            print(`FALLO CRÍTICO: ${err.message}`);
        }
    }

    function render(list) {
        const grid = document.getElementById('machine-grid');
        grid.innerHTML = '';
        list.forEach(m => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                document.getElementById('m-title').innerText = m.machine_name;
                document.getElementById('modal').style.display = 'block';
            };
            card.innerHTML = `<i class="fas fa-industry"></i><h3>${m.machine_name}</h3><span>${m.area}</span>`;
            grid.appendChild(card);
        });
    }

    // FUNCIÓN PARA REPARAR SI NO HAY DATOS
    async function crearMaquinaPrueba() {
        print("Intentando crear máquina de prueba...");
        const { error } = await db.from('machines').insert([
            { machine_name: 'NISSEI 1', area: 'INYECCION' }
        ]);
        if (error) {
            print(`Error al insertar: ${error.message}. ¿Tienes habilitado RLS?`);
            alert("Error: " + error.message);
        } else {
            print("Máquina creada. Recargando...");
            location.reload();
        }
    }

    async function guardar() {
        // Aquí va tu lógica de guardado que ya teníamos
        alert("Simulación de guardado exitosa");
        document.getElementById('modal').style.display = 'none';
    }

    window.onload = init;
</script>
</body>
</html>
