<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KRAEM - Panel de Producción</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0284c7; --success: #16a34a; --bg: #f1f5f9; --card: #ffffff;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        /* Dashboard de Cards */
        .grid-machines { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }
        .machine-card { 
            background: var(--card); padding: 25px; border-radius: 15px; 
            border: 1px solid #e2e8f0; text-align: center; cursor: pointer; 
            transition: all 0.3s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .machine-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .machine-card i { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; display: block; }
        .machine-card h3 { margin: 10px 0 5px; font-size: 1.1rem; color: #1e293b; }
        .machine-card small { color: #64748b; font-weight: 600; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .modal-content { background: #fff; width: 95%; max-width: 900px; margin: 2% auto; padding: 25px; border-radius: 15px; max-height: 90vh; overflow-y: auto; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #475569; margin-bottom: 4px; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #f8fafc; border: 1px solid var(--primary); color: var(--primary); }
        .btn-final { background: var(--success); color: white; }
    </style>
</head>
<body>

    <header style="border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px;">
        <h1><i class="fas fa-industry"></i> PANEL DE PISO KRAEM</h1>
        <div style="display: flex; gap: 15px; align-items: center;">
            <label>Filtrar por Área:</label>
            <select id="filter-area" onchange="loadMachines()" style="width: 250px;">
                <option value="">TODAS LAS AREAS</option>
            </select>
        </div>
    </header>

    <div id="machine-grid" class="grid-machines">
        <p id="loading-text">Cargando máquinas...</p>
    </div>

    <div id="prodModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Reporte</h2>
            <div class="form-grid">
                <div class="input-group">
                    <label>Turno</label>
                    <select id="f_turno"></select>
                </div>
                <div class="input-group">
                    <label>Líder / Operador</label>
                    <select id="f_lider"></select>
                </div>
                <div class="input-group">
                    <label>Número de Parte (N/P)</label>
                    <input type="text" id="f_np" placeholder="Escriba N/P...">
                </div>
                <div class="input-group">
                    <label>Tiros Totales</label>
                    <input type="number" id="f_tiros" value="0">
                </div>
                <div class="input-group">
                    <label>Piezas OK</label>
                    <input type="number" id="f_cant_ok" value="0">
                </div>
                <div class="input-group">
                    <label>Scrap (Pzas)</label>
                    <input type="number" id="f_scrap" value="0">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-save" onclick="closeModal()">CANCELAR</button>
                <button class="btn btn-final" onclick="alert('Guardado correctamente')">GUARDAR DATOS</button>
            </div>
        </div>
    </div>

<script>
    // Conexión segura: Si 'client' no existe, usaremos datos de prueba para que la pantalla no salga en blanco
    const supabase = (typeof client !== 'undefined') ? client : null;

    async function init() {
        if (!supabase) {
            console.error("No se detectó la configuración de Supabase. Cargando modo demostración.");
            renderDummyData();
            return;
        }

        try {
            // 1. Cargar Áreas de tu tabla rh_areas
            const { data: areas } = await supabase.from('rh_areas').select('nombre').eq('activo', true);
            const selArea = document.getElementById('filter-area');
            areas?.forEach(a => selArea.innerHTML += `<option value="${a.nombre}">${a.nombre}</option>`);

            // 2. Cargar Turnos
            const { data: turnos } = await supabase.from('rh_turnos').select('id, nombre');
            turnos?.forEach(t => document.getElementById('f_turno').innerHTML += `<option value="${t.id}">${t.nombre}</option>`);

            // 3. Cargar Empleados (Líderes)
            const { data: emps } = await supabase.from('rh_empleados').select('id, nombre_completo').eq('estatus', 'ACTIVO').limit(50);
            emps?.forEach(e => document.getElementById('f_lider').innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`);

            loadMachines();
        } catch (e) {
            renderDummyData();
        }
    }

    async function loadMachines() {
        const areaVal = document.getElementById('filter-area').value;
        const grid = document.getElementById('machine-grid');
        grid.innerHTML = '<p>Buscando máquinas...</p>';

        let query = supabase.from('machines').select('*');
        if(areaVal) query = query.eq('area', areaVal);

        const { data: machines, error } = await query;

        if (error || !machines || machines.length === 0) {
            grid.innerHTML = `<p style="color:red;">No se encontraron máquinas en la tabla 'machines'. Verifique su base de datos.</p>`;
            return;
        }

        grid.innerHTML = '';
        machines.forEach(m => {
            grid.innerHTML += `
                <div class="machine-card" onclick="openForm('${m.machine_name}')">
                    <i class="fas fa-robot"></i>
                    <h3>${m.machine_name}</h3>
                    <small>${m.area || 'SIN AREA'}</small>
                </div>
            `;
        });
    }

    function renderDummyData() {
        const grid = document.getElementById('machine-grid');
        grid.innerHTML = `
            <div class="machine-card" onclick="alert('Modo demo')"><i class="fas fa-exclamation-triangle"></i><h3>NISSEI 1</h3><small>DEMO</small></div>
            <div class="machine-card" onclick="alert('Modo demo')"><i class="fas fa-exclamation-triangle"></i><h3>ENGEL 2</h3><small>DEMO</small></div>
        `;
        document.getElementById('loading-text')?.remove();
    }

    function openForm(name) {
        document.getElementById('modal-title').innerText = "Captura: " + name;
        document.getElementById('prodModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('prodModal').style.display = 'none';
    }

    window.onload = init;
</script>
</body>
</html>
