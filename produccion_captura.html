<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MES - Iniciar Corrida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1e293b;
    --border:#dfe6ee;
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    font-family:Segoe UI,sans-serif;
    color:var(--text);
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    border:1px solid var(--border);
    box-shadow:0 4px 12px rgba(0,0,0,.05);
}

h1,h2{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
    text-transform:uppercase;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    box-sizing:border-box;
    font-size:14px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    border-bottom:1px solid var(--border);
    padding:10px;
    text-align:left;
}

.operator-row,
.output-row{
    border:1px solid var(--border);
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

.status-box{
    padding:12px;
    border-radius:10px;
    background:#ecfdf5;
    color:#166534;
    font-weight:bold;
    margin-bottom:20px;
}
</style>
</head>
<body>

<div class="container">

<div class="status-box" id="sessionInfo">
Verificando sesión...
</div>

<h1>MES - Iniciar Corrida</h1>

<div class="card">

<h2>Información General</h2>

<div class="grid">

<div>
<label>Área</label>
<select id="areaSelect"></select>
</div>

<div>
<label>Máquina</label>
<select id="machineSelect"></select>
</div>

<div>
<label>Turno</label>
<select id="shift">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</div>

<div>
<label>Molde</label>
<select id="moldSelect"></select>
</div>

<div>
<label>Tiempo Ciclo (seg)</label>
<input type="number" id="cycleTime">
</div>

<div>
<label>Cavidades Totales</label>
<input type="number" id="totalCavities">
</div>

<div>
<label>Tipo Resina</label>
<input type="text" id="resinType">
</div>

<div>
<label>Lote Resina</label>
<input type="text" id="resinLot">
</div>

<div>
<label>Color Resina</label>
<input type="text" id="resinColor">
</div>

<div>
<label>Peso Purga (g)</label>
<input type="number" id="purgeWeight">
</div>

<div>
<label>Peso Vena (g)</label>
<input type="number" id="runnerWeight">
</div>

</div>

</div>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">
<h2>Partes Producidas</h2>

<button class="btn-primary" onclick="addOutputRow()">
+ Agregar Parte
</button>
</div>

<div id="outputsContainer"></div>

</div>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">
<h2>Operadores</h2>

<button class="btn-primary" onclick="addOperatorRow()">
+ Agregar Operador
</button>
</div>

<div id="operatorsContainer"></div>

</div>

<button class="btn-success" style="width:100%;font-size:18px;" onclick="startRun()">
INICIAR CORRIDA
</button>

</div>

<script>

const supabaseClient = supabase.createClient(
'https://telntsrrschcdxczlape.supabase.co',
'TU_ANON_KEY_AQUI'
);

let machines = [];
let molds = [];
let parts = [];
let employees = [];

async function init(){

    const { data:{ session } } = await supabaseClient.auth.getSession();

    if(!session){
        alert("Debes iniciar sesión");
        location.href="/";
        return;
    }

    sessionInfo.innerHTML =
    "👤 " + session.user.email;

    const { data:areas } = await supabaseClient
    .from('areas')
    .select('*')
    .order('area_name');

    areas.forEach(a=>{
        areaSelect.innerHTML += `
        <option value="${a.id}">
            ${a.area_name}
        </option>
        `;
    });

    const { data:m } = await supabaseClient
    .from('machines')
    .select('*')
    .order('id');

    machines = m || [];

    renderMachines();

    const { data:mo } = await supabaseClient
    .from('molds')
    .select('*');

    molds = mo || [];

    molds.forEach(m=>{
        moldSelect.innerHTML += `
        <option value="${m.id}">
            ${m.name || m.id}
        </option>
        `;
    });

    const { data:p } = await supabaseClient
    .from('parts')
    .select('id,part_number,part_name')
    .limit(3000);

    parts = p || [];

    const { data:e } = await supabaseClient
    .from('rh_empleados')
    .select('id,nombre');

    employees = e || [];

    addOutputRow();
    addOperatorRow();
}

function renderMachines(){

    machineSelect.innerHTML='';

    machines.forEach(m=>{

        machineSelect.innerHTML += `
        <option value="${m.id}">
            ${m.machine_name || 'MAQ-'+m.id}
        </option>
        `;
    });
}

function addOutputRow(){

    const div = document.createElement('div');

    div.className = 'output-row';

    let options = '';

    parts.forEach(p=>{
        options += `
        <option value="${p.id}">
            ${p.part_number} - ${p.part_name || ''}
        </option>
        `;
    });

    div.innerHTML = `
    <div class="grid">

        <div>
            <label>Parte</label>
            <select class="partSelect">
                ${options}
            </select>
        </div>

        <div>
            <label>Lado</label>
            <select class="sideSelect">
                <option value="LH">LH</option>
                <option value="RH">RH</option>
                <option value="NA">NA</option>
            </select>
        </div>

        <div>
            <label>Cavidades</label>
            <input type="number" class="cavitiesInput" value="1">
        </div>

        <div>
            <label>Peso Pieza (g)</label>
            <input type="number" class="pieceWeightInput">
        </div>

    </div>

    <button
        class="btn-danger"
        style="margin-top:12px;"
        onclick="this.parentElement.remove()">
        Eliminar
    </button>
    `;

    outputsContainer.appendChild(div);
}

function addOperatorRow(){

    const div = document.createElement('div');

    div.className='operator-row';

    let options='';

    employees.forEach(e=>{
        options += `
        <option value="${e.id}">
            ${e.nombre}
        </option>
        `;
    });

    div.innerHTML = `
    <div class="grid">

        <div>
            <label>Empleado</label>
            <select class="employeeSelect">
                ${options}
            </select>
        </div>

        <div>
            <label>Rol</label>
            <select class="roleSelect">
                <option value="OPERADOR">OPERADOR</option>
                <option value="LIDER">LIDER</option>
                <option value="EMPAQUE">EMPAQUE</option>
                <option value="INSPECCION">INSPECCION</option>
            </select>
        </div>

    </div>

    <button
        class="btn-danger"
        style="margin-top:12px;"
        onclick="this.parentElement.remove()">
        Eliminar
    </button>
    `;

    operatorsContainer.appendChild(div);
}

async function startRun(){

    try{

        const machine_id = machineSelect.value;

        const mold_id = moldSelect.value;

        const shift = shift.value;

        const cycle_time = parseFloat(cycleTime.value || 0);

        const total_cavities = parseInt(totalCavities.value || 0);

        const resin_type = resinType.value;

        const resin_lot = resinLot.value;

        const resin_color = resinColor.value;

        const purge_weight_g = parseFloat(purgeWeight.value || 0);

        const runner_weight_g = parseFloat(runnerWeight.value || 0);

        const outputsRows =
        document.querySelectorAll('.output-row');

        if(outputsRows.length===0){
            alert("Agrega al menos una parte");
            return;
        }

        const runPayload = {

            machine_id,
            mold_id,
            shift,

            cycle_time,
            cavities: total_cavities,

            resin_type,
            resin_lot,
            resin_color,

            purge_weight_g,
            runner_weight_g,

            status:'RUNNING',

            start_time:new Date().toISOString()
        };

        const { data:runData, error:runError } =
        await supabaseClient
        .from('runs')
        .insert([runPayload])
        .select()
        .single();

        if(runError) throw runError;

        const run_id = runData.id;

        let outputsToInsert = [];

        outputsRows.forEach(row=>{

            const part_id =
            row.querySelector('.partSelect').value;

            const side =
            row.querySelector('.sideSelect').value;

            const cavities =
            parseInt(
            row.querySelector('.cavitiesInput').value || 1
            );

            const piece_weight_g =
            parseFloat(
            row.querySelector('.pieceWeightInput').value || 0
            );

            outputsToInsert.push({

                run_id,
                part_id,
                side,
                cavities,
                piece_weight_g
            });
        });

        const { error:outputError } =
        await supabaseClient
        .from('run_outputs')
        .insert(outputsToInsert);

        if(outputError) throw outputError;

        const operatorRows =
        document.querySelectorAll('.operator-row');

        let operatorsToInsert = [];

        operatorRows.forEach(row=>{

            operatorsToInsert.push({

                run_id,

                employee_id:
                row.querySelector('.employeeSelect').value,

                role:
                row.querySelector('.roleSelect').value
            });
        });

        const { error:operatorError } =
        await supabaseClient
        .from('run_operators')
        .insert(operatorsToInsert);

        if(operatorError) throw operatorError;

        const { error:updateMachineError } =
        await supabaseClient
        .from('machines')
        .update({

            status:'RUNNING',

            current_run_id:run_id,

            current_mold_id:mold_id,

            last_start_time:new Date().toISOString()
        })
        .eq('id',machine_id);

        if(updateMachineError)
        throw updateMachineError;

        alert("CORRIDA INICIADA");

        location.reload();

    }catch(err){

        console.error(err);

        alert(err.message);
    }
}

areaSelect?.addEventListener('change',()=>{

    renderMachines();
});

init();

</script>

</body>
</html>
