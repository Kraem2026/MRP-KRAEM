<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>MES - Iniciar Corrida</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1e293b;
    --border:#dfe6ee;
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    font-family:Segoe UI,sans-serif;
    color:var(--text);
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    border:1px solid var(--border);
    box-shadow:0 4px 12px rgba(0,0,0,.05);
}

h1,h2{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
    text-transform:uppercase;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    box-sizing:border-box;
    font-size:14px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.operator-row,
.output-row{
    border:1px solid var(--border);
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

.status-box{
    padding:12px;
    border-radius:10px;
    background:#ecfdf5;
    color:#166534;
    font-weight:bold;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="status-box" id="sessionInfo">
Verificando sesión...
</div>

<h1>MES - Iniciar Corrida</h1>

<div class="card">

<h2>Información General</h2>

<div class="grid">

<div>
<label>Área</label>
<select id="areaSelect"></select>
</div>

<div>
<label>Máquina</label>
<select id="machineSelect"></select>
</div>

<div>
<label>Turno</label>
<select id="shiftSelect">

<option value="1">Turno 1</option>
<option value="2">Turno 2</option>
<option value="3">Turno 3</option>

</select>
</div>

<div>
<label>Molde</label>
<select id="moldSelect"></select>
</div>

<div>
<label>Tiempo Ciclo (seg)</label>
<input type="number" id="cycleTime">
</div>

<div>
<label>Cavidades Totales</label>
<input type="number" id="totalCavities">
</div>

<div>
<label>Tipo Resina</label>
<input type="text" id="resinType">
</div>

<div>
<label>Lote Resina</label>
<input type="text" id="resinLot">
</div>

<div>
<label>Color Resina</label>
<input type="text" id="resinColor">
</div>

<div>
<label>Peso Purga (g)</label>
<input type="number" id="purgeWeight">
</div>

<div>
<label>Peso Vena (g)</label>
<input type="number" id="runnerWeight">
</div>

</div>
</div>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">

<h2>Partes Producidas</h2>

<button class="btn-primary" onclick="addOutputRow()">
+ Agregar Parte
</button>

</div>

<div id="outputsContainer"></div>

</div>

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;">

<h2>Operadores</h2>

<button class="btn-primary" onclick="addOperatorRow()">
+ Agregar Operador
</button>

</div>

<div id="operatorsContainer"></div>

</div>

<button
class="btn-success"
style="width:100%;font-size:18px;"
onclick="startRun()">

INICIAR CORRIDA

</button>

</div>

<script>

let machines = [];
let molds = [];
let parts = [];
let employees = [];
let areas = [];

async function init(){

    try{

        const { data:{ session }, error:sessionError } =
        await supabaseClient.auth.getSession();

        if(sessionError){
            console.error(sessionError);
        }

        if(!session){

            alert("Debes iniciar sesión");

            location.href = "/";

            return;
        }

        sessionInfo.innerHTML =
        "👤 " + session.user.email;

        await loadAreas();

        await loadMachines();

        await loadMolds();

        await loadParts();

        await loadEmployees();

        addOutputRow();

        addOperatorRow();

    }catch(err){

        console.error(err);

        alert(err.message);
    }
}

async function loadAreas(){

    const { data, error } = await supabaseClient
    .from('areas')
    .select('*')
    .order('area_name');

    if(error){

        console.error(error);

        alert("Error cargando áreas");

        return;
    }

    areas = data || [];

    areaSelect.innerHTML = '';

    areas.forEach(area=>{

        areaSelect.innerHTML += `
        <option value="${area.id}">
            ${area.area_name}
        </option>
        `;
    });
}

async function loadMachines(){

    const { data, error } = await supabaseClient
    .from('machines')
    .select(`
        id,
        machine_name,
        area_id,
        status
    `)
    .order('machine_name');

    if(error){

        console.error(error);

        alert("Error cargando máquinas");

        return;
    }

    machines = data || [];

    renderMachines();
}

function renderMachines(){

    machineSelect.innerHTML = '';

    const selectedArea = areaSelect.value;

    const filteredMachines = machines.filter(m =>
        String(m.area_id) === String(selectedArea)
    );

    if(filteredMachines.length === 0){

        machineSelect.innerHTML = `
        <option value="">
            Sin máquinas
        </option>
        `;

        return;
    }

    filteredMachines.forEach(machine=>{

        machineSelect.innerHTML += `
        <option value="${machine.id}">
            ${machine.machine_name}
        </option>
        `;
    });
}

async function loadMolds(){

    const { data, error } = await supabaseClient
    .from('molds')
    .select('*')
    .order('name');

    if(error){

        console.error(error);

        return;
    }

    molds = data || [];

    moldSelect.innerHTML = '';

    molds.forEach(mold=>{

        moldSelect.innerHTML += `
        <option value="${mold.id}">
            ${mold.name || mold.id}
        </option>
        `;
    });
}

async function loadParts(){

    const { data, error } = await supabaseClient
    .from('parts')
    .select('id,part_number,part_name')
    .limit(3000);

    if(error){

        console.error(error);

        return;
    }

    parts = data || [];
}

async function loadEmployees(){

    const { data, error } = await supabaseClient
    .from('rh_empleados')
    .select('id,nombre')
    .order('nombre');

    if(error){

        console.error(error);

        return;
    }

    employees = data || [];
}

function addOutputRow(){

    const div = document.createElement('div');

    div.className = 'output-row';

    let options = '';

    parts.forEach(part=>{

        options += `
        <option value="${part.id}">
            ${part.part_number} - ${part.part_name || ''}
        </option>
        `;
    });

    div.innerHTML = `

    <div class="grid">

        <div>
            <label>Parte</label>
            <select class="partSelect">
                ${options}
            </select>
        </div>

        <div>
            <label>Lado</label>
            <select class="sideSelect">

                <option value="LH">LH</option>
                <option value="RH">RH</option>
                <option value="NA">NA</option>

            </select>
        </div>

        <div>
            <label>Cavidades</label>
            <input
            type="number"
            class="cavitiesInput"
            value="1">
        </div>

        <div>
            <label>Peso Pieza (g)</label>
            <input
            type="number"
            class="pieceWeightInput">
        </div>

    </div>

    <button
    class="btn-danger"
    style="margin-top:12px;"
    onclick="this.parentElement.remove()">

    Eliminar

    </button>
    `;

    outputsContainer.appendChild(div);
}

function addOperatorRow(){

    const div = document.createElement('div');

    div.className = 'operator-row';

    let options = '';

    employees.forEach(emp=>{

        options += `
        <option value="${emp.id}">
            ${emp.nombre}
        </option>
        `;
    });

    div.innerHTML = `

    <div class="grid">

        <div>

            <label>Empleado</label>

            <select class="employeeSelect">
                ${options}
            </select>

        </div>

        <div>

            <label>Rol</label>

            <select class="roleSelect">

                <option value="OPERADOR">
                    OPERADOR
                </option>

                <option value="LIDER">
                    LIDER
                </option>

                <option value="EMPAQUE">
                    EMPAQUE
                </option>

                <option value="INSPECCION">
                    INSPECCION
                </option>

            </select>

        </div>

    </div>

    <button
    class="btn-danger"
    style="margin-top:12px;"
    onclick="this.parentElement.remove()">

    Eliminar

    </button>
    `;

    operatorsContainer.appendChild(div);
}

async function startRun(){

    try{

        const payload = {

            area_id: areaSelect.value,

            machine_id: machineSelect.value,

            mold_id: moldSelect.value,

            shift: shiftSelect.value,

            cycle_time:
            parseFloat(cycleTime.value || 0),

            cavities:
            parseInt(totalCavities.value || 0),

            resin_type: resinType.value,

            resin_lot: resinLot.value,

            resin_color: resinColor.value,

            purge_weight_g:
            parseFloat(purgeWeight.value || 0),

            runner_weight_g:
            parseFloat(runnerWeight.value || 0),

            status:'RUNNING',

            start_time:
            new Date().toISOString()
        };

        const { data:runData, error:runError } =
        await supabaseClient
        .from('runs')
        .insert([payload])
        .select()
        .single();

        if(runError) throw runError;

        const run_id = runData.id;

        let outputs = [];

        document
        .querySelectorAll('.output-row')
        .forEach(row=>{

            outputs.push({

                run_id,

                part_id:
                row.querySelector('.partSelect').value,

                side:
                row.querySelector('.sideSelect').value,

                cavities:
                parseInt(
                row.querySelector('.cavitiesInput').value || 1
                ),

                piece_weight_g:
                parseFloat(
                row.querySelector('.pieceWeightInput').value || 0
                )
            });
        });

        const { error:outputsError } =
        await supabaseClient
        .from('run_outputs')
        .insert(outputs);

        if(outputsError) throw outputsError;

        let operators = [];

        document
        .querySelectorAll('.operator-row')
        .forEach(row=>{

            operators.push({

                run_id,

                employee_id:
                row.querySelector('.employeeSelect').value,

                role:
                row.querySelector('.roleSelect').value
            });
        });

        const { error:operatorsError } =
        await supabaseClient
        .from('run_operators')
        .insert(operators);

        if(operatorsError) throw operatorsError;

        await supabaseClient
        .from('machines')
        .update({

            status:'RUNNING',

            current_run_id:run_id,

            current_mold_id:moldSelect.value,

            last_start_time:
            new Date().toISOString()
        })
        .eq('id', machineSelect.value);

        alert("CORRIDA INICIADA");

        location.reload();

    }catch(err){

        console.error(err);

        alert(err.message);
    }
}

areaSelect.addEventListener('change', ()=>{

    renderMachines();
});

init();

</script>

</body>
</html>
