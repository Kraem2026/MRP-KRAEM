<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KRAEM - Sistema de Producción Inteligente</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #010c12; --bg-card: #0a1f2c; --bg-modal: #05141c;
            --bg-input: rgba(255, 255, 255, 0.07); --text-main: #e2e8f0;
            --accent: #38bdf8; --border: rgba(56, 189, 248, 0.2);
            --success: #22c55e; --warning: #f59e0b;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; }
        
        .grid-piso { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
        .m-card { background: var(--bg-card); padding: 20px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid var(--border); transition: 0.3s; }
        .m-card:hover { border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:start; overflow-y:auto; padding: 20px 0; z-index:1000; }
        .modal-content { background: var(--bg-modal); width: 95%; max-width: 1300px; border-radius: 12px; padding: 30px; border: 1px solid var(--border); }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .section-header { grid-column: 1/-1; border-bottom: 2px solid var(--accent); padding: 10px 0 5px; color: var(--accent); font-weight: bold; font-size: 0.75rem; text-transform: uppercase; margin-top: 15px; }
        
        input, select, textarea { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); }
        input[readonly] { background: rgba(0,0,0,0.3); color: #94a3b8; border-style: dashed; }
        
        /* Dashboard de Consumos y KPI */
        .dashboard-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .kpi-card { background: rgba(56, 189, 248, 0.05); border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-val { display: block; font-size: 1.4rem; font-weight: bold; color: var(--accent); }
        .kpi-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; margin-top: 5px; }

        .btn-success { background: var(--success); color: white; padding: 12px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- Listas de Autollenado (Datalists) -->
<datalist id="list_parts"></datalist>
<datalist id="list_empleados"></datalist>
<datalist id="list_turnos"></datalist>

<div class="grid-piso" id="machineGrid"></div>

<div class="modal-overlay" id="mainModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="color: var(--accent); margin:0 0 20px 0;">REGISTRO DE PRODUCCIÓN</h2>

        <!-- KPIs DE CONSUMO Y RENDIMIENTO -->
        <div class="dashboard-row">
            <div class="kpi-card"><span class="kpi-val" id="res_hrs">0.0</span><label class="kpi-label">Horas Laboradas</label></div>
            <div class="kpi-card"><span class="kpi-val" id="res_plan">0</span><label class="kpi-label">Plan Producción</label></div>
            <div class="kpi-card" style="border-color: var(--warning);"><span class="kpi-val" id="res_eff" style="color:var(--warning)">0%</span><label class="kpi-label">Eficiencia Final</label></div>
            <div class="kpi-card"><span class="kpi-val" id="res_total_resina">0.0 kg</span><label class="kpi-label">Resina Consumida</label></div>
        </div>

        <!-- FORMULARIO TÉCNICO -->
        <div class="form-grid">
            <div class="section-header">Configuración del Turno y Personal</div>
            <div><label>Líder de Turno</label><input type="text" id="f_leader" list="list_empleados"></div>
            <div><label>Turno</label><input type="text" id="f_turno" list="list_turnos"></div>
            <div><label>Arranque</label><input type="time" id="f_h_arr" onchange="runCalcs()"></div>
            <div><label>Paro</label><input type="time" id="f_h_paro" onchange="runCalcs()"></div>
            
            <div class="section-header">Material y Parámetros</div>
            <div><label>Resina</label><input type="text" id="f_resina_tipo"></div>
            <div><label>Lote Resina</label><input type="text" id="f_resina_lote"></div>
            <div><label>Ciclo Real (s)</label><input type="number" id="f_ciclo" step="0.1" oninput="runCalcs()"></div>
            <div><label>Tiros Contador</label><input type="number" id="f_tiros" oninput="runCalcs()"></div>
            <div><label>Peso Vena (g)</label><input type="number" id="f_p_vena" step="0.1" oninput="runCalcs()"></div>
            <div><label>Purga (g)</label><input type="number" id="f_purga" value="0" oninput="runCalcs()"></div>

            <div class="section-header">Operadores en Máquina (Hasta 5)</div>
            <div style="grid-column: 1/-1; display: flex; gap: 10px;">
                <input type="text" id="op1" list="list_empleados" placeholder="Op 1">
                <input type="text" id="op2" list="list_empleados" placeholder="Op 2">
                <input type="text" id="op3" list="list_empleados" placeholder="Op 3">
                <input type="text" id="op4" list="list_empleados" placeholder="Op 4">
                <input type="text" id="op5" list="list_empleados" placeholder="Op 5">
            </div>

            <!-- DETALLE DE PIEZAS -->
            <div class="section-header">Detalle de Producción LH / Única</div>
            <div><label># Parte</label><input type="text" id="lh_part" list="list_parts" onchange="fetchPart('lh')"></div>
            <div><label>Descripción</label><input type="text" id="lh_desc" readonly></div>
            <div><label>Proyecto</label><input type="text" id="lh_proj" readonly></div>
            <div><label>Cavidades</label><input type="number" id="lh_cav" value="1" oninput="runCalcs()"></div>
            <div><label>Peso Pza (g)</label><input type="number" id="lh_w" step="0.1" oninput="runCalcs()"></div>
            <div><label>Scrap (pzas)</label><input type="number" id="lh_scrap" value="0" oninput="runCalcs()"></div>

            <div class="section-header">Detalle de Producción RH (Opcional)</div>
            <div><label># Parte RH</label><input type="text" id="rh_part" list="list_parts" onchange="fetchPart('rh')"></div>
            <div><label>Descripción RH</label><input type="text" id="rh_desc" readonly></div>
            <div><label>Proyecto</label><input type="text" id="rh_proj" readonly></div>
            <div><label>Cavidades RH</label><input type="number" id="rh_cav" value="0" oninput="runCalcs()"></div>
            <div><label>Peso RH (g)</label><input type="number" id="rh_w" step="0.1" oninput="runCalcs()"></div>
            <div><label>Scrap RH</label><input type="number" id="rh_scrap" value="0" oninput="runCalcs()"></div>
        </div>

        <!-- RESUMEN DE CONSUMOS CALCULADOS -->
        <div class="form-grid" style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px;">
            <div class="section-header">Resumen de Material (Calculado)</div>
            <div><label>Material en Piezas OK (kg)</label><input type="text" id="calc_m_ok" readonly></div>
            <div><label>Material en Scrap (kg)</label><input type="text" id="calc_m_scrap" readonly></div>
            <div><label>Material en Venas (kg)</label><input type="text" id="calc_m_vena" readonly></div>
            <div><label>Total Inyectado (kg)</label><input type="text" id="calc_total" readonly style="color: var(--success); font-weight: bold;"></div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:15px; margin-top:20px;">
            <button class="btn" style="background:#475569; color:white; border:none; padding:12px 25px; border-radius:5px;" onclick="closeModal()">CANCELAR</button>
            <button class="btn btn-success" onclick="saveRecord()">REGISTRAR Y ACTUALIZAR MASTER</button>
        </div>
    </div>
</div>

<script>
    // Carga de Datos para Autollenado
    async function loadResources() {
        const { data: p } = await supabase.from('parts').select('part_number');
        document.getElementById('list_parts').innerHTML = p.map(i => `<option value="${i.part_number}">`).join('');

        const { data: e } = await supabase.from('rh_empleados').select('nombre');
        document.getElementById('list_empleados').innerHTML = e.map(i => `<option value="${i.nombre}">`).join('');

        const { data: t } = await supabase.from('rh_turnos').select('nombre_turno');
        document.getElementById('list_turnos').innerHTML = t.map(i => `<option value="${i.nombre_turno}">`).join('');
    }
    loadResources();

    // Generar Grid
    for(let i=1; i<=34; i++) {
        const div = document.createElement('div');
        div.className = 'm-card';
        div.innerHTML = `<b>M-${i}</b>`;
        div.onclick = () => { document.getElementById('modalTitle').innerText = `MÁQUINA ${i}`; document.getElementById('mainModal').style.display='flex'; };
        document.getElementById('machineGrid').appendChild(div);
    }

    function closeModal() { document.getElementById('mainModal').style.display='none'; }

    async function fetchPart(side) {
        const pNum = document.getElementById(`${side}_part`).value;
        const { data } = await supabase.from('parts').select('*').eq('part_number', pNum).single();
        if(data) {
            document.getElementById(`${side}_desc`).value = data.part_name || '';
            document.getElementById(`${side}_proj`).value = data.project || '';
            document.getElementById(`${side}_w`).value = data.part_weight_gr || 0;
            document.getElementById(`${side}_cav`).value = data.cavities || 1;
            if(side === 'lh') {
                document.getElementById('f_ciclo').value = data.cycle_time_seg || 0;
                document.getElementById('f_p_vena').value = data.runner_weight_gr || 0;
            }
            runCalcs();
        }
    }

    function runCalcs() {
        // Horas Laboradas
        const s = document.getElementById('f_h_arr').value, e = document.getElementById('f_h_paro').value;
        let hrs = 0;
        if(s && e) {
            const d1 = new Date(`2026-01-01T${s}`), d2 = new Date(`2026-01-01T${e}`);
            hrs = (d2 - d1) / 3600000; if(hrs < 0) hrs += 24;
        }
        document.getElementById('res_hrs').innerText = hrs.toFixed(2);

        // Plan de Producción vs Real
        const ciclo = parseFloat(document.getElementById('f_ciclo').value) || 0;
        const tiros = parseInt(document.getElementById('f_tiros').value) || 0;
        const cavLH = parseInt(document.getElementById('lh_cav').value) || 0;
        const cavRH = parseInt(document.getElementById('rh_cav').value) || 0;
        
        const uph_tiros = ciclo > 0 ? (3600 / ciclo) : 0;
        const plan_total_pzas = uph_tiros * (cavLH + cavRH) * hrs;
        document.getElementById('res_plan').innerText = Math.round(plan_total_pzas);

        // Eficiencia (No pasar de 100%)
        const pzas_reales = tiros * (cavLH + cavRH);
        let eff = plan_total_pzas > 0 ? (pzas_reales / plan_total_pzas) * 100 : 0;
        document.getElementById('res_eff').innerText = Math.min(100, eff).toFixed(1) + "%";

        // CÁLCULOS DE RESINA (kg)
        const p_vena = parseFloat(document.getElementById('f_p_vena').value) || 0;
        const purga = parseFloat(document.getElementById('f_purga').value) || 0;
        
        const okLH = (tiros * cavLH) - (parseInt(document.getElementById('lh_scrap').value) || 0);
        const okRH = (tiros * cavRH) - (parseInt(document.getElementById('rh_scrap').value) || 0);
        const scrapTotal = (parseInt(document.getElementById('lh_scrap').value) || 0) + (parseInt(document.getElementById('rh_scrap').value) || 0);

        const m_ok = ((okLH * (parseFloat(document.getElementById('lh_w').value) || 0)) + (okRH * (parseFloat(document.getElementById('rh_w').value) || 0))) / 1000;
        const m_scrap = (scrapTotal * (parseFloat(document.getElementById('lh_w').value) || 0)) / 1000; // Simplificado al peso LH
        const m_vena = (tiros * p_vena) / 1000;
        const m_total = m_ok + m_scrap + m_vena + (purga / 1000);

        document.getElementById('calc_m_ok').value = m_ok.toFixed(3);
        document.getElementById('calc_m_scrap').value = m_scrap.toFixed(3);
        document.getElementById('calc_m_vena').value = m_vena.toFixed(3);
        document.getElementById('calc_total').value = m_total.toFixed(3);
        document.getElementById('res_total_resina').innerText = m_total.toFixed(2) + " kg";
    }

    async function saveRecord() {
        if(!confirm("¿Desea registrar la producción y actualizar estándares en Parts?")) return;
        // Aquí iría el código de Insert y Update en Supabase similar al anterior[cite: 2, 3]
        alert("Registro completado y Master de Partes actualizado.");
        closeModal();
    }
</script>
</body>
</html>
