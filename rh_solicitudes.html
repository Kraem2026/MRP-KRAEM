<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | RH PRO FINAL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{background:white;padding:20px;border-radius:10px;margin-bottom:20px}
input,select,textarea{width:100%;padding:8px;margin-bottom:10px}
button{padding:10px;cursor:pointer}
.ok{background:green;color:white}
.no{background:red;color:white}

#calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dia{background:white;border:1px solid #ddd;padding:5px;min-height:90px}
.evento{background:#dbeafe;margin:2px;padding:2px;font-size:10px}
</style>
</head>

<body>

<div class="card">
<h3>Solicitud</h3>

<select id="sel_empleado"></select>

<select id="sel_tipo">
<option value="VACACIONES">Vacaciones</option>
<option value="PERMISO">Permiso</option>
<option value="SALIDA_TEMPRANO">Salida temprano</option>
</select>

<input type="date" id="f_ini">
<input type="date" id="f_fin">
<input type="time" id="h_sol">

<select id="sel_autoriza"></select>

<textarea id="obs"></textarea>

<button onclick="guardar()">Guardar</button>
</div>

<div class="card">
<h3>Historial</h3>
<table border="1" width="100%">
<thead><tr><th>Emp</th><th>Tipo</th><th>Estatus</th><th></th></tr></thead>
<tbody id="hist"></tbody>
</table>
</div>

<div class="card">
<h3>Calendario</h3>
<div id="calendario"></div>
</div>

<script>
let empleados=[];

// INIT
async function init(){
const {data}=await client.from('rh_empleados').select('*');
empleados=data||[];

const sel=document.getElementById('sel_empleado');
const selAut=document.getElementById('sel_autoriza');

empleados.forEach(e=>{
sel.innerHTML+=`<option value="${e.id}">${e.nombre_completo}</option>`;
selAut.innerHTML+=`<option value="${e.id}">${e.nombre_completo}</option>`;
});

cargarHist();
cargarCal();
}

// FOLIO
async function generarFolio(){
const {count}=await client.from('rh_solicitudes').select('*',{count:'exact',head:true});
return 'FRH-'+String((count||0)+1).padStart(5,'0');
}

// GUARDAR
async function guardar(){
await client.from('rh_solicitudes').insert([{
empleado_id:sel_empleado.value,
tipo:sel_tipo.value,
fecha_inicio:f_ini.value,
fecha_fin:f_fin.value,
hora_salida:h_sol.value,
observaciones:obs.value,
autorizado_por:sel_autoriza.selectedOptions[0].text,
estatus:'PENDIENTE'
}]);

location.reload();
}

// PDF
async function generarPDF(s){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.text("FORMATO PERMISO RH",70,10);

doc.text(`Folio: ${s.folio}`,10,20);
doc.text(`Empleado: ${s.nombre}`,10,30);
doc.text(`Tipo: ${s.tipo}`,10,40);
doc.text(`Motivo: ${s.motivo}`,10,50);

doc.text("Solicita (Digital)",10,80);
doc.text("✔ AUTORIZADO",10,85);

doc.text("Autoriza (Digital)",80,80);
doc.text(s.autoriza,80,85);

doc.text("Director Operaciones",150,80);
doc.line(150,85,190,85);

doc.save(s.folio+".pdf");
}

// CAMBIAR
async function cambiar(id,estatus){

const {data}=await client
.from('rh_solicitudes')
.select('*,rh_empleados(nombre_completo,telefono)')
.eq('id',id)
.single();

await client.from('rh_solicitudes').update({estatus}).eq('id',id);

if(estatus==="APROBADO"){

const folio=await generarFolio();

await client.from('rh_solicitudes').update({folio}).eq('id',id);

await generarPDF({
folio,
nombre:data.rh_empleados.nombre_completo,
tipo:data.tipo,
motivo:data.observaciones,
autoriza:data.autorizado_por
});

// WHATSAPP
window.open(`https://wa.me/52${data.rh_empleados.telefono}?text=Tu solicitud ${folio} fue aprobada`);
}

if(estatus==="RECHAZADO"){
window.open(`https://wa.me/52${data.rh_empleados.telefono}?text=Tu solicitud fue rechazada`);
}

cargarHist();
cargarCal();
}

// HISTORIAL
async function cargarHist(){
const {data}=await client
.from('rh_solicitudes')
.select('*,rh_empleados(nombre_completo)');

hist.innerHTML=(data||[]).map(s=>`
<tr>
<td>${s.rh_empleados?.nombre_completo}</td>
<td>${s.tipo}</td>
<td>${s.estatus}</td>
<td>
${s.estatus==='PENDIENTE'?`
<button class="ok" onclick="cambiar('${s.id}','APROBADO')">✔</button>
<button class="no" onclick="cambiar('${s.id}','RECHAZADO')">✖</button>
`:''}
</td>
</tr>
`).join('');
}

// CALENDARIO
async function cargarCal(){
const {data}=await client.from('rh_solicitudes').select('*').eq('estatus','APROBADO');

const cont=document.getElementById('calendario');
cont.innerHTML='';

const hoy=new Date();
const año=hoy.getFullYear();
const mes=hoy.getMonth();

const dias=new Date(año,mes+1,0).getDate();

for(let d=1;d<=dias;d++){
let eventos=data.filter(s=>{
return d>=new Date(s.fecha_inicio).getDate() &&
d<=new Date(s.fecha_fin).getDate();
});

cont.innerHTML+=`
<div class="dia">
<b>${d}</b>
${eventos.map(e=>`<div class="evento">${e.tipo}</div>`).join('')}
</div>`;
}
}

init();
</script>

</body>
</html>
