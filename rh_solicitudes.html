<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Solicitudes PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.card { background:white; padding:20px; border-radius:10px; margin-bottom:20px; }
input, select, textarea { width:100%; padding:8px; margin-bottom:10px; }
button { padding:10px; cursor:pointer; }
.ok { background:green; color:white; }
.no { background:red; color:white; }
</style>
</head>

<body>

<div class="card">
<h3>Nueva Solicitud</h3>

<select id="sel_empleado"></select>

<select id="sel_tipo" onchange="ajustarCampos()">
<option value="VACACIONES">VACACIONES</option>
<option value="PERMISO_SIN_GOCE">PERMISO</option>
<option value="SALIDA_TEMPRANO">SALIDA TEMPRANO</option>
<option value="IDA_VUELTA">IDA Y VUELTA</option>
</select>

<input type="date" id="f_ini" onchange="procesarFechas()">
<input type="date" id="f_fin">

<input type="time" id="h_sol" style="display:none;">

<div>Días disponibles: <b id="txt_vacas">0</b></div>

<textarea id="txt_obs" placeholder="Observaciones"></textarea>

<button onclick="guardarRegistro()">GUARDAR</button>
</div>

<div class="card">
<h3>Historial</h3>
<table border="1" width="100%">
<thead>
<tr>
<th>Empleado</th>
<th>Tipo</th>
<th>Días</th>
<th>Estatus</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="lista_sol"></tbody>
</table>
</div>

<script>
let empleados = [];

// INIT
async function init() {
    const { data } = await client.from('rh_empleados').select('*').eq('estatus','ACTIVO');
    empleados = data || [];

    const sel = document.getElementById('sel_empleado');
    sel.innerHTML = '<option value="">Seleccionar</option>';

    empleados.forEach(e => {
        sel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`;
    });

    sel.addEventListener('change', calcularVacaciones);

    cargarHistorial();
}

// CALCULAR VACACIONES
function calcularVacaciones() {
    const id = document.getElementById('sel_empleado').value;
    const emp = empleados.find(e => e.id == id);
    if(!emp) return;

    const ingreso = new Date(emp.fecha_ingreso);
    const hoy = new Date();

    let anios = hoy.getFullYear() - ingreso.getFullYear();
    if (hoy < new Date(hoy.getFullYear(), ingreso.getMonth(), ingreso.getDate())) {
        anios--;
    }

    const tabla = [0,12,14,16,18,20,22,22,22,22,22,24];
    const dias = anios >= 11 ? 24 : (tabla[anios] || 0);

    document.getElementById('txt_vacas').innerText = dias;
}

// CAMPOS DINÁMICOS
function ajustarCampos() {
    const tipo = document.getElementById('sel_tipo').value;
    document.getElementById('h_sol').style.display =
        (tipo === 'SALIDA_TEMPRANO' || tipo === 'IDA_VUELTA') ? 'block':'none';
}

// FECHAS
function procesarFechas() {
    const tipo = document.getElementById('sel_tipo').value;
    const fIni = document.getElementById('f_ini').value;

    if(tipo === 'SALIDA_TEMPRANO' || tipo === 'IDA_VUELTA') {
        document.getElementById('f_fin').value = fIni;
    }
}

// GUARDAR
async function guardarRegistro() {

    const empId = document.getElementById('sel_empleado').value;
    const tipo = document.getElementById('sel_tipo').value;
    const fIni = document.getElementById('f_ini').value;
    const fFin = document.getElementById('f_fin').value || fIni;

    if(!empId) return alert("Selecciona empleado");
    if(!fIni) return alert("Selecciona fecha");

    const d1 = new Date(fIni);
    const d2 = new Date(fFin);

    if(d2 < d1) return alert("Fechas inválidas");

    let dias = Math.floor((d2 - d1)/(1000*60*60*24)) + 1;

    // VALIDAR VACACIONES
    if(tipo === 'VACACIONES') {
        const disponibles = parseInt(document.getElementById('txt_vacas').innerText);
        if(dias > disponibles) return alert("No tiene días suficientes");
    }

    // VALIDAR TRASLAPE
    const { data: existentes } = await client
        .from('rh_solicitudes')
        .select('*')
        .eq('empleado_id', empId)
        .in('estatus',['PENDIENTE','APROBADO']);

    const traslape = (existentes || []).some(s => {
        const ini = new Date(s.fecha_inicio);
        const fin = new Date(s.fecha_fin);
        return (d1 <= fin && d2 >= ini);
    });

    if(traslape) return alert("Ya hay solicitud en esas fechas");

    const payload = {
        empleado_id: empId,
        tipo,
        fecha_inicio: fIni,
        fecha_fin: fFin,
        hora_salida: document.getElementById('h_sol').value || null,
        dias_solicitados: dias,
        observaciones: document.getElementById('txt_obs').value,
        estatus:'PENDIENTE'
    };

    const { error } = await client.from('rh_solicitudes').insert([payload]);

    if(error) return alert(error.message);

    alert("Guardado");
    location.reload();
}

// HISTORIAL
async function cargarHistorial() {
    const { data } = await client
        .from('rh_solicitudes')
        .select('*, rh_empleados(nombre_completo)')
        .order('created_at',{ascending:false});

    const tbody = document.getElementById('lista_sol');

    tbody.innerHTML = (data || []).map(s=>`
        <tr>
        <td>${s.rh_empleados?.nombre_completo || '-'}</td>
        <td>${s.tipo}</td>
        <td>${s.dias_solicitados}</td>
        <td>${s.estatus}</td>
        <td>
            ${s.estatus==='PENDIENTE' ? `
            <button class="ok" onclick="cambiarEstatus('${s.id}','APROBADO')">✔</button>
            <button class="no" onclick="cambiarEstatus('${s.id}','RECHAZADO')">✖</button>
            `:'-'}
        </td>
        </tr>
    `).join('');
}

// CAMBIAR ESTATUS
async function cambiarEstatus(id, estatus) {
    const { error } = await client
        .from('rh_solicitudes')
        .update({estatus})
        .eq('id',id);

    if(error) return alert(error.message);

    alert("Actualizado");
    cargarHistorial();
}

// INICIAR
init();
</script>

</body>
</html>
