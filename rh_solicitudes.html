<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Solicitudes RH PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
    --primary:#0f172a;
    --accent:#2563eb;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
    --purple:#7c3aed;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    margin:0;
    padding:20px;
}

.container {
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns: 420px 1fr;
    gap:20px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    height: fit-content;
}

label {
    font-size:11px;
    font-weight:700;
    color:#64748b;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
}

input, select, textarea {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    margin-bottom:12px;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

.btn {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    text-decoration: none;
}

.tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.tab-btn { padding: 10px 20px; border: none; background: none; font-weight: 700; cursor: pointer; color: #64748b; font-size: 14px; border-radius: 6px; }
.tab-btn.active { background: var(--accent); color: white; }

.solicitud-list { display: flex; flex-direction: column; gap: 12px; }
.solicitud-card { border: 1px solid var(--border); padding: 16px; border-radius: 8px; background: white; display: flex; justify-content: space-between; align-items: center; position: relative; }
.solicitud-info h4 { margin: 0 0 5px 0; font-size: 14px; }
.solicitud-info p { margin: 2px 0; font-size: 12px; color: #64748b; }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
.badge-pendiente { background: #fef3c7; color: #d97706; }
.badge-aprobado { background: #dcfce7; color: #15803d; }
.badge-rechazado { background: #fee2e2; color: #b91c1c; }
.auditoria-firma { font-size: 10px; color: #94a3b8; font-style: italic; margin-top: 5px; display: block; }

.info-badge-dinamico {
    font-size: 12px; font-weight: bold; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; display: none;
}

table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
th { background: #f8fafc; padding: 12px; text-align: left; font-size: 11px; border-bottom: 2px solid var(--border); text-transform: uppercase; color: #64748b; }
td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
</style>
</head>

<body>

<div style="max-width:1400px; margin: auto; display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;"><i class="fas fa-folder-open"></i> Control de Solicitudes Kraem</h2>
    <a href="dashboard.html" class="btn" style="width: auto; background: #64748b;"><i class="fas fa-arrow-left"></i> Dashboard</a>
</div>

<div class="tabs" style="max-width:1400px; margin:auto;">
    <button class="tab-btn active" onclick="switchTab('panel-solicitudes')"><i class="fas fa-clipboard-list"></i> Panel General</button>
    <button class="tab-btn" onclick="switchTab('panel-saldos'); cargarSaldos();"><i class="fas fa-calendar-check"></i> Control de Vacaciones</button>
</div>

<div class="container">

    <div id="panel-solicitudes" style="display: contents;">
        <div class="card">
            <h3 style="margin-top:0; font-size:16px; border-bottom:1px solid var(--border); padding-bottom:10px;"><i class="fas fa-pen-nib"></i> Registrar Solicitud</h3>
            
            <label>Filtros de búsqueda</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <select id="f_area" onchange="filtrarEmpleados()"></select>
                <select id="f_turno" onchange="filtrarEmpleados()">
                    <option value="">Turno</option>
                    <option value="1">Turno 1</option>
