<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Solicitudes RH PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#0f172a;
    --accent:#2563eb;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
    --success:#22c55e;
    --danger:#ef4444;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    margin:0;
    padding:20px;
}

.container {
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns: 420px 1fr;
    gap:20px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

label {
    font-size:11px;
    font-weight:700;
    color:#64748b;
}

input, select, textarea {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    margin-bottom:12px;
}

.btn {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:white;
}

.info-box {
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
    font-size:13px;
}

.badge {
    padding:4px 8px;
    border-radius:6px;
    font-size:10px;
    font-weight:bold;
}

.badge-PENDIENTE { background:#fef9c3; }
.badge-APROBADO { background:#dcfce7; }
.badge-RECHAZADO { background:#fee2e2; }

.table {
    width:100%;
    border-collapse:collapse;
}

.table th, .table td {
    padding:10px;
    border-bottom:1px solid #e2e8f0;
}

.ok { background:var(--success); color:white; }
.no { background:var(--danger); color:white; }

/* calendario */
#calendario {
    display:grid;
    grid-template-columns: repeat(7,1fr);
    gap:5px;
}

.dia {
    background:white;
    border:1px solid #e2e8f0;
    border-radius:8px;
    min-height:100px;
    padding:5px;
    font-size:11px;
}

.dia-header {
    font-weight:bold;
    margin-bottom:5px;
}

.evento {
    background:#dbeafe;
    border-radius:4px;
    padding:2px 4px;
    margin-bottom:2px;
    font-size:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- FORM -->
<div class="card">
<h3>Registrar Solicitud</h3>

<div style="display:flex; gap:10px;">
<select id="f_area" onchange="filtrarEmpleados()"><option value="">Área</option></select>
<select id="f_turno" onchange="filtrarEmpleados()">
<option value="">Turno</option>
<option value="1">Turno 1</option>
<option value="2">Turno 2</option>
</select>
</div>

<select id="sel_empleado" onchange="mostrarInfoEmpleado()"></select>

<div id="info_emp" class="info-box" style="display:none;">
<div><b id="emp_nombre"></b></div>
<div>Puesto: <span id="emp_puesto"></span></div>
<div>Antigüedad: <span id="emp_anti"></span></div>
<div>Vacaciones: <b id="txt_vacas"></b></div>
</div>

<select id="sel_tipo" onchange="ajustarCampos()">
<option value="VACACIONES">Vacaciones</option>
<option value="INCAPACIDAD_ENFERMEDAD">Incapacidad Enfermedad</option>
<option value="INCAPACIDAD_MATERNIDAD">Maternidad</option>
<option value="PERMISO_SIN_GOCE">Permiso</option>
<option value="SUSPENSION">Suspensión</option>
<option value="DEFUNCION">Defunción</option>
<option value="MATRIMONIO">Matrimonio</option>
<option value="SALIDA_TEMPRANO">Salida temprano</option>
<option value="IDA_VUELTA">Ida y vuelta</option>
</select>

<input type="date" id="f_ini" onchange="procesarFechas()">

<div id="box_fin">
<input type="date" id="f_fin">
</div>

<div id="box_hora" style="display:none;">
<input type="time" id="h_sol">
</div>

<div style="display:flex; gap:10px;">
<select id="f_area_aut" onchange="filtrarAutorizadores()"><option value="">Área</option></select>
<select id="f_turno_aut" onchange="filtrarAutorizadores()">
<option value="">Turno</option>
<option value="1">Turno 1</option>
<option value="2">Turno 2</option>
</select>
</div>

<select id="sel_autoriza"></select>

<textarea id="txt_obs" placeholder="Observaciones"></textarea>

<button class="btn" onclick="guardarRegistro()">Guardar</button>
</div>

<!-- TABLA -->
<div class="card">
<h3>Historial</h3>
<table class="table">
<thead>
<tr><th>Empleado</th><th>Tipo</th><th>Días</th><th>Estatus</th><th>Acción</th></tr>
</thead>
<tbody id="lista_sol"></tbody>
</table>
</div>

<!-- CALENDARIO -->
<div class="card" style="grid-column: span 2;">
<h3>Calendario</h3>
<div id="calendario"></div>
</div>

</div>

<script>
let empleados=[];

// INIT
async function init(){
const { data } = await client.from('rh_empleados')
.select('*,rh_puestos(nombre),rh_areas(nombre)')
.eq('estatus','ACTIVO');

empleados=data||[];

cargarFiltros();
filtrarEmpleados();
filtrarAutorizadores();
cargarHistorial();
cargarCalendario();
}

// FOLIO
async function generarFolio(){
const { count } = await client.from('rh_solicitudes')
.select('*',{count:'exact',head:true});
return 'FRH-'+String((count||0)+1).padStart(5,'0');
}

// PDF
function generarPDF(data){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.setFontSize(14);
doc.text("FORMATO RH - PERMISO", 60, 10);

doc.setFontSize(10);
doc.text(`Folio: ${data.folio}`,10,20);
doc.text(`Fecha: ${data.fecha}`,10,25);
doc.text(`Tipo: ${data.tipo}`,10,35);
doc.text(`Empleado: ${data.nombre}`,10,45);
doc.text(`Área: ${data.area}`,10,50);
doc.text(`Motivo: ${data.motivo}`,10,60);

doc.text("Solicita:",10,90);
doc.text("✔ Aprobado digitalmente",10,95);

doc.text("Autoriza:",80,90);
doc.text(data.autoriza,80,95);

doc.text("Director Operaciones:",140,90);
doc.line(140,95,190,95);

doc.save(data.folio+".pdf");
}

// CAMBIAR
async function cambiar(id,estatus){

const { data } = await client
.from('rh_solicitudes')
.select('*,rh_empleados(nombre_completo,telefono,rh_areas(nombre))')
.eq('id',id)
.single();

await client.from('rh_solicitudes')
.update({estatus})
.eq('id',id);

if(estatus==="APROBADO"){
const folio = await generarFolio();

await client.from('rh_solicitudes')
.update({folio})
.eq('id',id);

generarPDF({
folio,
fecha:new Date().toLocaleDateString(),
tipo:data.tipo,
nombre:data.rh_empleados?.nombre_completo,
area:data.rh_empleados?.rh_areas?.nombre,
motivo:data.observaciones,
autoriza:data.autorizado_por
});

if(data.rh_empleados?.telefono){
window.open(`https://wa.me/52${data.rh_empleados.telefono}?text=Tu solicitud ${folio} fue aprobada`);
}
}

if(estatus==="RECHAZADO"){
if(data.rh_empleados?.telefono){
window.open(`https://wa.me/52${data.rh_empleados.telefono}?text=Tu solicitud fue rechazada`);
}
}

cargarHistorial();
cargarCalendario();
}

/* TODO LO DEMÁS ORIGINAL */
</script>

</body>
</html>
