<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KRAEM | Control RH PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary:#0f172a; --accent:#2563eb; --bg:#f8fafc; --border:#e2e8f0; --danger:#ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin:0; padding:20px; }
        .container { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h3>Registrar Solicitud / Ajuste</h3>
        <select id="sel_empleado" onchange="actualizarSaldoVisual()"></select>
        <div id="info_saldo" style="font-size:12px; margin-bottom:10px; color:#64748b;"></div>
        
        <select id="sol_tipo" onchange="toggleInputs()">
            <option value="VACACIONES">Vacaciones</option>
            <option value="AJUSTE HISTORICO (RESTA DE DIAS)">⚠️ Ajuste Histórico (Saldo Inicial)</option>
        </select>

        <div id="grupo-fechas">
            <label>Fecha Inicio</label>
            <input type="date" id="sol_inicio" onchange="calcularDias()">
            <label>Fecha Fin</label>
            <input type="date" id="sol_fin" onchange="calcularDias()">
        </div>

        <div id="grupo-ajuste" style="display:none;">
            <label>Días a descontar (Ajuste)</label>
            <input type="number" id="sol_ajuste_dias" value="0">
        </div>

        <textarea id="sol_motivo" placeholder="Motivo o justificación"></textarea>
        <select id="sel_autoriza"></select>
        <button class="btn" onclick="guardar()">Guardar Registro</button>
    </div>

    <div class="card">
        <h3>Historial y Saldos</h3>
        <table id="tabla-solicitudes">
            <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Tipo</th>
                    <th>Fecha</th>
                    <th>Solicitados</th>
                    <th>Ajustes</th>
                    <th>Estatus</th>
                </tr>
            </thead>
            <tbody id="body-solicitudes"></tbody>
        </table>
    </div>
</div>

<script>
    function toggleInputs() {
        const esAjuste = document.getElementById('sol_tipo').value === 'AJUSTE HISTORICO (RESTA DE DIAS)';
        document.getElementById('grupo-fechas').style.display = esAjuste ? 'none' : 'block';
        document.getElementById('grupo-ajuste').style.display = esAjuste ? 'block' : 'none';
    }

    async function guardar() {
        const tipo = document.getElementById('sol_tipo').value;
        const esAjuste = (tipo === 'AJUSTE HISTORICO (RESTA DE DIAS)');
        
        // Lógica de cálculo estricta
        const inicio = document.getElementById('sol_inicio').value;
        const fin = document.getElementById('sol_fin').value;
        const diasVac = document.getElementById('sol_inicio').value ? 
            Math.ceil((new Date(fin) - new Date(inicio)) / (1000*60*60*24)) + 1 : 0;
        
        const payload = {
            empleado_id: document.getElementById('sel_empleado').value,
            tipo: tipo,
            fecha_inicio: esAjuste ? new Date().toISOString().split('T')[0] : inicio,
            fecha_fin: esAjuste ? new Date().toISOString().split('T')[0] : fin,
            // AQUÍ LA SEPARACIÓN QUE ACORDAMOS:
            dias_solicitados: esAjuste ? 0 : diasVac, 
            dias_ajustados: esAjuste ? parseInt(document.getElementById('sol_ajuste_dias').value) : 0,
            observaciones: document.getElementById('sol_motivo').value,
            autorizador_asignado: document.getElementById('sel_autoriza').value,
            estatus: 'PENDIENTE'
        };

        const { error } = await client.from('rh_solicitudes').insert([payload]);
        if(error) alert("Error: " + error.message);
        else {
            alert("Registrado correctamente");
            location.reload();
        }
    }

    // Inicialización y carga...
    // (Asegúrate de invocar tus funciones de carga aquí)
</script>
</body>
</html>
