<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Solicitudes RH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#0f172a;
    --accent:#2563eb;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    margin:0;
    padding:20px;
}

.container {
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns: 400px 1fr;
    gap:20px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.03);
}

h3 {
    margin-top:0;
    font-size:16px;
}

label {
    font-size:11px;
    font-weight:700;
    color:#64748b;
}

input, select, textarea {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    margin-bottom:12px;
}

.btn {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.btn-primary {
    background:var(--accent);
    color:white;
}

.badge {
    padding:4px 8px;
    border-radius:6px;
    font-size:10px;
    font-weight:bold;
}

.badge-PENDIENTE { background:#fef9c3; color:#92400e; }
.badge-APROBADO { background:#dcfce7; color:#166534; }
.badge-RECHAZADO { background:#fee2e2; color:#991b1b; }

.table {
    width:100%;
    border-collapse:collapse;
}

.table th {
    text-align:left;
    font-size:11px;
    color:#64748b;
    border-bottom:2px solid var(--border);
    padding:10px;
}

.table td {
    padding:10px;
    border-bottom:1px solid #f1f5f9;
}

.actions button {
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

.ok { background:var(--success); color:white; }
.no { background:var(--danger); color:white; }

.info-box {
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- FORM -->
<div class="card">
<h3>Registrar Solicitud</h3>

<label>Empleado</label>
<select id="sel_empleado"></select>

<div class="info-box">
Vacaciones disponibles: <b id="txt_vacas">0</b> días
</div>

<label>Tipo</label>
<select id="sel_tipo" onchange="ajustarCampos()">
<option value="VACACIONES">Vacaciones</option>
<option value="PERMISO_SIN_GOCE">Permiso sin goce</option>
<option value="SALIDA_TEMPRANO">Salida temprano</option>
<option value="IDA_VUELTA">Ida y vuelta</option>
</select>

<label>Fecha inicio</label>
<input type="date" id="f_ini" onchange="procesarFechas()">

<label>Fecha fin</label>
<input type="date" id="f_fin">

<label>Hora (si aplica)</label>
<input type="time" id="h_sol" style="display:none;">

<label>Observaciones</label>
<textarea id="txt_obs"></textarea>

<button class="btn btn-primary" onclick="guardarRegistro()">Guardar solicitud</button>
</div>

<!-- TABLA -->
<div class="card">
<h3>Historial de Solicitudes</h3>

<table class="table">
<thead>
<tr>
<th>Empleado</th>
<th>Tipo</th>
<th>Días</th>
<th>Estatus</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="lista_sol"></tbody>
</table>

</div>

</div>

<script>
let empleados=[];

async function init(){
    const { data } = await client.from('rh_empleados').select('*').eq('estatus','ACTIVO');
    empleados=data||[];

    const sel=document.getElementById('sel_empleado');
    sel.innerHTML='<option value="">Seleccionar</option>';
    empleados.forEach(e=>{
        sel.innerHTML+=`<option value="${e.id}">${e.nombre_completo}</option>`;
    });

    sel.addEventListener('change', calcularVacaciones);

    cargarHistorial();
}

function calcularVacaciones(){
    const id=document.getElementById('sel_empleado').value;
    const emp=empleados.find(e=>e.id==id);
    if(!emp) return;

    const ingreso=new Date(emp.fecha_ingreso);
    const hoy=new Date();
    let anios=hoy.getFullYear()-ingreso.getFullYear();

    const tabla=[0,12,14,16,18,20,22,22,22,22,22,24];
    const dias=anios>=11?24:(tabla[anios]||0);

    document.getElementById('txt_vacas').innerText=dias;
}

function ajustarCampos(){
    const tipo=document.getElementById('sel_tipo').value;
    document.getElementById('h_sol').style.display=
    (tipo==="SALIDA_TEMPRANO"||tipo==="IDA_VUELTA")?"block":"none";
}

function procesarFechas(){
    const tipo=document.getElementById('sel_tipo').value;
    const f=document.getElementById('f_ini').value;
    if(tipo==="SALIDA_TEMPRANO"||tipo==="IDA_VUELTA"){
        document.getElementById('f_fin').value=f;
    }
}

async function guardarRegistro(){
    const empId=document.getElementById('sel_empleado').value;
    const tipo=document.getElementById('sel_tipo').value;
    const fIni=document.getElementById('f_ini').value;
    const fFin=document.getElementById('f_fin').value||fIni;

    if(!empId) return alert("Selecciona empleado");

    const d1=new Date(fIni);
    const d2=new Date(fFin);

    let dias=Math.floor((d2-d1)/(1000*60*60*24))+1;

    if(tipo==="VACACIONES"){
        const disp=parseInt(document.getElementById('txt_vacas').innerText);
        if(dias>disp) return alert("Sin días suficientes");
    }

    const { data:existentes }=await client.from('rh_solicitudes')
    .select('*').eq('empleado_id',empId);

    const traslape=(existentes||[]).some(s=>{
        const i=new Date(s.fecha_inicio);
        const f=new Date(s.fecha_fin);
        return (d1<=f && d2>=i);
    });

    if(traslape) return alert("Fechas ya ocupadas");

    await client.from('rh_solicitudes').insert([{
        empleado_id:empId,
        tipo,
        fecha_inicio:fIni,
        fecha_fin:fFin,
        hora_salida:document.getElementById('h_sol').value||null,
        dias_solicitados:dias,
        observaciones:document.getElementById('txt_obs').value,
        estatus:'PENDIENTE'
    }]);

    location.reload();
}

async function cargarHistorial(){
    const { data }=await client.from('rh_solicitudes')
    .select('*,rh_empleados(nombre_completo)')
    .order('created_at',{ascending:false});

    document.getElementById('lista_sol').innerHTML=(data||[]).map(s=>`
    <tr>
    <td>${s.rh_empleados?.nombre_completo}</td>
    <td>${s.tipo}</td>
    <td>${s.dias_solicitados}</td>
    <td><span class="badge badge-${s.estatus}">${s.estatus}</span></td>
    <td class="actions">
    ${s.estatus==='PENDIENTE'?`
    <button class="ok" onclick="cambiar('${s.id}','APROBADO')">✔</button>
    <button class="no" onclick="cambiar('${s.id}','RECHAZADO')">✖</button>
    `:'-'}
    </td>
    </tr>
    `).join('');
}

async function cambiar(id,estatus){
    await client.from('rh_solicitudes').update({estatus}).eq('id',id);
    cargarHistorial();
}

init();
</script>

</body>
</html>
