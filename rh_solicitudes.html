<script>
let empleados=[];

/* =========================
   🔥 NUEVO: FOLIO
========================= */
async function generarFolio(){
    const { count } = await client
    .from('rh_solicitudes')
    .select('*',{count:'exact',head:true});

    return 'FRH-'+String((count||0)+1).padStart(5,'0');
}

/* =========================
   🔥 NUEVO: PDF PRO
========================= */
function generarPDF(data){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(14);
    doc.text("FORMATO RH - PERMISO", 60, 10);

    doc.setFontSize(10);
    doc.text(`Folio: ${data.folio}`,10,20);
    doc.text(`Fecha: ${data.fecha}`,10,25);
    doc.text(`Tipo: ${data.tipo}`,10,35);

    doc.text(`Empleado: ${data.nombre}`,10,45);
    doc.text(`Área: ${data.area}`,10,50);
    doc.text(`Motivo: ${data.motivo}`,10,60);

    // Firmas
    doc.text("Solicita:",10,90);
    doc.text("✔ Aprobado digitalmente",10,95);

    doc.text("Autoriza:",80,90);
    doc.text(data.autoriza,80,95);

    doc.text("Director Operaciones:",140,90);
    doc.line(140,95,190,95);

    doc.save(data.folio+".pdf");
}

/* =========================
   🔥 MODIFICACIÓN CLAVE
========================= */
async function cambiar(id,estatus){

const { data } = await client
.from('rh_solicitudes')
.select('*,rh_empleados(nombre_completo,telefono,rh_areas(nombre))')
.eq('id',id)
.single();

await client.from('rh_solicitudes')
.update({estatus})
.eq('id',id);

if(estatus==="APROBADO"){

    const folio = await generarFolio();

    await client.from('rh_solicitudes')
    .update({folio})
    .eq('id',id);

    generarPDF({
        folio,
        fecha:new Date().toLocaleDateString(),
        tipo:data.tipo,
        nombre:data.rh_empleados?.nombre_completo,
        area:data.rh_empleados?.rh_areas?.nombre,
        motivo:data.observaciones,
        autoriza:data.autorizado_por
    });

    // WhatsApp aprobación
    if(data.rh_empleados?.telefono){
        window.open(`https://wa.me/52${data.rh_empleados.telefono}?text=Tu solicitud ${folio} fue aprobada`);
    }
}

if(estatus==="RECHAZADO"){
    if(data.rh_empleados?.telefono){
        window.open(`https://wa.me/52${data.rh_empleados.telefono}?text=Tu solicitud fue rechazada`);
    }
}

cargarHistorial();
cargarCalendario();
}
