<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Solicitudes RH PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
    --primary:#0f172a;
    --accent:#2563eb;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
    --purple:#7c3aed;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    margin:0;
    padding:20px;
}

.container {
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns: 420px 1fr;
    gap:20px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    height: fit-content;
}

label {
    font-size:11px;
    font-weight:700;
    color:#64748b;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
}

input, select, textarea {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    margin-bottom:12px;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

.btn {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    text-decoration: none;
}

.tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.tab-btn { padding: 10px 20px; border: none; background: none; font-weight: 700; cursor: pointer; color: #64748b; font-size: 14px; border-radius: 6px; }
.tab-btn.active { background: var(--accent); color: white; }

.solicitud-list { display: flex; flex-direction: column; gap: 12px; }
.solicitud-card { border: 1px solid var(--border); padding: 16px; border-radius: 8px; background: white; display: flex; justify-content: space-between; align-items: center; position: relative; }
.solicitud-info h4 { margin: 0 0 5px 0; font-size: 14px; }
.solicitud-info p { margin: 2px 0; font-size: 12px; color: #64748b; }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
.badge-pendiente { background: #fef3c7; color: #d97706; }
.badge-aprobado { background: #dcfce7; color: #15803d; }
.badge-rechazado { background: #fee2e2; color: #b91c1c; }
.auditoria-firma { font-size: 10px; color: #94a3b8; font-style: italic; margin-top: 5px; display: block; }

.info-badge-dinamico {
    font-size: 12px; font-weight: bold; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; display: none;
}

table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
th { background: #f8fafc; padding: 12px; text-align: left; font-size: 11px; border-bottom: 2px solid var(--border); text-transform: uppercase; color: #64748b; }
td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }

.row-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: 600; }
.row-link:hover { color: #1d4ed8; }

/* MODAL STYLES */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-content {
    background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 700px;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
.close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; }
</style>
</head>

<body>

<div style="max-width:1400px; margin: auto; display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;"><i class="fas fa-folder-open"></i> Control de Solicitudes Kraem</h2>
    <a href="dashboard.html" class="btn" style="width: auto; background: #64748b;"><i class="fas fa-arrow-left"></i> Dashboard</a>
</div>

<div class="tabs" style="max-width:1400px; margin:auto;">
    <button class="tab-btn active" onclick="switchTab('panel-solicitudes')"><i class="fas fa-clipboard-list"></i> Panel General</button>
    <button class="tab-btn" onclick="switchTab('panel-saldos'); cargarSaldos();"><i class="fas fa-calendar-check"></i> Control de Vacaciones</button>
</div>

<div class="container">

    <div id="panel-solicitudes" style="display: contents;">
        <div class="card">
            <h3 style="margin-top:0; font-size:16px; border-bottom:1px solid var(--border); padding-bottom:10px;"><i class="fas fa-pen-nib"></i> Registrar Solicitud</h3>
            
            <label>Filtros de búsqueda</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <select id="f_area" onchange="filtrarEmpleados()"></select>
                <select id="f_turno" onchange="filtrarEmpleados()">
                    <option value="">Turno</option>
                    <option value="1">Turno 1</option>
                    <option value="2">Turno 2</option>
                </select>
            </div>

            <label>Colaborador afectado</label>
            <select id="sel_empleado" onchange="mostrarInfoVacacionesEmpleado()" required></select>
            
            <div id="lbl_vacaciones_disponibles" class="info-badge-dinamico" style="background: #e0f2fe; color: #0369a1;"></div>

            <label>Tipo de Permiso / Ausencia</label>
            <select id="sol_tipo" onchange="toggleCamposTipo(); evaluarDinamicoAlCambiar();" required>
                <option value="VACACIONES">Vacaciones</option>
                <option value="AJUSTE HISTORICO (RESTA DE DIAS)">⚠️ Ajuste Manual (Restar días tomados del pasado)</option>
                <option value="INCAPACIDAD ENFERMEDAD">Incapacidad (Enfermedad)</option>
                <option value="INCAPACIDAD MATERNIDAD/PATERNIDAD">Incapacidad (Maternidad/Paternidad)</option>
                <option value="PERMISO C/GOCE (LEY)">Permiso c/Goce (Leyes/Defunción)</option>
                <option value="PERMISO S/GOCE">Permiso sin Goce de Sueldo</option>
                <option value="SUSPENSION">Suspensión Laboral</option>
                <option value="PERMISO LOCAL (IDA Y VUELTA)">Permiso Local (Ida y Vuelta)</option>
                <option value="LLEGADA TARDE">Permiso de Llegada Tarde</option>
                <option value="SALIDA TEMPRANO">Permiso de Salida Temprano</option>
            </select>

            <div id="grupo-fechas" style="display: block;">
                <label>Fecha Inicio</label>
                <input type="date" id="sol_inicio" onchange="calcularDiasSolicitadosDinamico()">
                <label>Fecha Fin</label>
                <input type="date" id="sol_fin" onchange="calcularDiasSolicitadosDinamico()">
                
                <div id="lbl_dias_calculados" class="info-badge-dinamico" style="background: #fef3c7; color: #d97706; margin-top: 5px;"></div>
            </div>

            <div id="grupo-horas" style="display: none; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px;">
                <label>Fecha Única</label>
                <input type="date" id="sol_fecha_local">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div><label>Hora Salida</label><input type="time" id="sol_hora_salida"></div>
                    <div><label>Hora Regreso</label><input type="time" id="sol_hora_regreso"></div>
                </div>
            </div>

            <label>Motivo / Observaciones de Planta</label>
            <textarea id="sol_motivo" rows="3" placeholder="Detalle la justificación..." required></textarea>

            <h4 style="margin: 10px 0 5px 0; font-size:12px;">Supervisor Solicitante</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <select id="f_area_aut" onchange="filtrarAutorizadores()"></select>
                <select id="f_turno_aut" onchange="filtrarAutorizadores()">
                    <option value="">Turno</option>
                    <option value="1">Turno 1</option>
                    <option value="2">Turno 2</option>
                </select>
            </div>
            <select id="sel_autoriza"></select>

            <button class="btn" onclick="guardar()"><i class="fas fa-paper-plane"></i> Guardar Solicitud</button>
        </div>

        <div>
            <div style="display: flex; gap: 8px; margin-bottom: 15px; background: #e2e8f0; padding: 4px; border-radius: 8px; width: fit-content;">
                <button class="tab-btn active" id="sub-pend" onclick="filtrarLista('PENDIENTE')" style="padding: 6px 14px; font-size:12px; border-radius:6px;">Por Aprobar</button>
                <button class="tab-btn" id="sub-aprob" onclick="filtrarLista('APROBADO')" style="padding: 6px 14px; font-size:12px; border-radius:6px;">Aprobadas</button>
                <button class="tab-btn" id="sub-rech" onclick="filtrarLista('RECHAZADO')" style="padding: 6px 14px; font-size:12px; border-radius:6px;">Rechazadas</button>
            </div>
            <div class="solicitud-list" id="contenedor-solicitudes"></div>
        </div>
    </div>

    <div id="panel-saldos" style="display: none; grid-column: span 2;">
        <div style="background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 13px; color: #1e40af;">
            <i class="fas fa-info-circle"></i> <strong>
        </div>

        <div class="card" style="display: grid; grid-template-columns: 250px 1fr; gap: 12px; padding: 15px; margin-bottom: 15px; background: #f1f5f9;">
            <div>
                <label>Filtrar por Área / Depto</label>
                <select id="f_saldo_area" onchange="aplicarFiltrosSaldos()" style="margin-bottom:0;"></select>
            </div>
            <div>
                <label>Buscar Colaborador por Nombre</label>
                <div style="position: relative;">
                    <input type="text" id="f_saldo_nombre" oninput= "aplicarFiltrosSaldos()" placeholder="Escribe el nombre del operador..." style="margin-bottom:0; padding-left: 35px;">
                    <i class="fas fa-search" style="position: absolute; left: 12px; top: 13px; color: #94a3b8;"></i>
                </div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Colaborador (Ver Historial)</th>
                    <th>Ingreso Planta</th>
                    <th>Días de Ley</th>
                    <th>Tomados / Ajustes</th>
                    <th>Saldo Disponible</th>
                </tr>
            </thead>
            <tbody id="body-saldos"></tbody>
        </table>
    </div>

</div>

<div class="modal-overlay" id="modal-kardex">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="kardex-nombre" style="margin:0; font-size:16px; color:var(--primary);"><i class="fas fa-history"></i> Historial de Días Tomados</h3>
            <button class="close-modal" onclick="cerrarModal()"><i class="fas fa-times"></i></button>
        </div>
        <div style="max-height: 50vh; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Periodo</th>
                        <th>Días</th>
                        <th>Autorizó</th>
                    </tr>
                </thead>
                <tbody id="kardex-tabla-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let empleados = [];
let areas = [];
let solicitudesGlobales = [];
let solicitudesVacAprobadas = []; // Cache exclusivo para rendimiento de saldos
let filtroEstatusActual = 'PENDIENTE';

function calcularDiasLeyMexico(fechaIngresoStr) {
    if(!fechaIngresoStr) return 0;
    const ingreso = new Date(fechaIngresoStr + 'T00:00:00');
    const hoy = new Date();
    let antiguedad = hoy.getFullYear() - ingreso.getFullYear();
    const mes = hoy.getMonth() - ingreso.getMonth();
    if (mes < 0 || (mes === 0 && hoy.getDate() < ingreso.getDate())) {
        antiguedad--;
    }
    return obtenerDiasPorAntiguedad(antiguedad);
}

function calcularDiasLeyMexicoProyectado(fechaIngresoStr, fechaProyeccionStr) {
    if(!fechaIngresoStr || !fechaProyeccionStr) return 0;
    const ingreso = new Date(fechaIngresoStr + 'T00:00:00');
    const fechaProy = new Date(fechaProyeccionStr + 'T00:00:00');
    let antiguedad = fechaProy.getFullYear() - ingreso.getFullYear();
    const mes = fechaProy.getMonth() - ingreso.getMonth();
    if (mes < 0 || (mes === 0 && fechaProy.getDate() < ingreso.getDate())) {
        antiguedad--;
    }
    return obtenerDiasPorAntiguedad(antiguedad);
}

function obtenerDiasPorAntiguedad(antiguedad) {
    if(antiguedad < 1) return 0;
    if(antiguedad === 1) return 12;
    if(antiguedad === 2) return 14;
    if(antiguedad === 3) return 16;
    if(antiguedad === 4) return 18;
    if(antiguedad === 5) return 20;
    if(antiguedad >= 6 && antiguedad <= 10) return 22;
    if(antiguedad >= 11 && antiguedad <= 15) return 24;
    if(antiguedad >= 16 && antiguedad <= 20) return 26;
    if(antiguedad >= 21 && antiguedad <= 25) return 28;
    if(antiguedad >= 26 && antiguedad <= 30) return 30;
    return 32;
}

async function init(){
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('sol_inicio').value = hoy;
    document.getElementById('sol_fin').value = hoy;
    document.getElementById('sol_fecha_local').value = hoy;

    const [resEmp, resAr] = await Promise.all([
        client.from('rh_empleados').select('id, nombre_completo, area_id, turno_id, fecha_ingreso, estatus').eq('estatus','ACTIVO').order('nombre_completo', { ascending: true }),
        client.from('rh_areas').select('*').eq('activo', true)
    ]);

    empleados = resEmp.data || [];
    areas = resAr.data || [];

    cargarAreas();
    filtrarEmpleados();
    filtrarAutorizadores();
    await cargarSolicitudesBase();
    calcularDiasSolicitadosDinamico();
}

function switchTab(id) {
    document.getElementById('panel-solicitudes').style.display = id === 'panel-solicitudes' ? 'contents' : 'none';
    document.getElementById('panel-saldos').style.display = id === 'panel-saldos' ? 'block' : 'none';
    event.target.classList.add('active');
    
    document.querySelectorAll('.tabs .tab-btn').forEach(btn => {
        if(btn !== event.target) btn.classList.remove('active');
    });
}

function toggleCamposTipo() {
    const tipo = document.getElementById('sol_tipo').value;
    const esLocal = tipo.includes('LOCAL') || tipo.includes('TARDE') || tipo.includes('TEMPRANO');
    
    document.getElementById('grupo-fechas').style.display = esLocal ? 'none' : 'block';
    document.getElementById('grupo-horas').style.display = esLocal ? 'block' : 'none';
}

function evaluarDinamicoAlCambiar() {
    const tipo = document.getElementById('sol_tipo').value;
    if(!tipo.includes('LOCAL') && !tipo.includes('TARDE') && !tipo.includes('TEMPRANO')) {
        calcularDiasSolicitadosDinamico();
    }
}

function cargarAreas(){
    const sel1 = document.getElementById('f_area');
    const sel2 = document.getElementById('f_area_aut');
    const sel3 = document.getElementById('f_saldo_area');

    sel1.innerHTML = '<option value="">Área</option>';
    sel2.innerHTML = '<option value="">Área</option>';
    sel3.innerHTML = '<option value="">Todas las Áreas</option>';

    areas.forEach(a=>{
        sel1.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
        sel2.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
        sel3.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
    });
}

function filtrarEmpleados(){
    const area = document.getElementById('f_area').value;
    const turno = document.getElementById('f_turno').value;

    const lista = empleados.filter(e=>
        (!area || e.area_id == area) &&
        (!turno || e.turno_id == turno)
    );

    const sel = document.getElementById('sel_empleado');
    sel.innerHTML = '<option value="">Selecciona Operador...</option>';

    lista.forEach(e=>{
        sel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`;
    });
    document.getElementById('lbl_vacaciones_disponibles').style.display = 'none';
}

function filtrarAutorizadores(){
    const area = document.getElementById('f_area_aut').value;
    const turno = document.getElementById('f_turno_aut').value;

    const lista = empleados.filter(e=>
        (!area || e.area_id == area) &&
        (!turno || e.turno_id == turno)
    );

    const sel = document.getElementById('sel_autoriza');
    sel.innerHTML = '<option value="">Firma Supervisor...</option>';

    lista.forEach(e=>{
        sel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`;
    });
}

async function obtenerSaldoRealEmpleado(empId, fechaReferenciaStr = null) {
    const emp = empleados.find(e => e.id === empId);
    if(!emp) return 0;

    const { data: vacs } = await client.from('rh_solicitudes')
        .select('fecha_inicio, fecha_fin, tipo')
        .eq('empleado_id', empId)
        .in('tipo', ['VACACIONES', 'AJUSTE HISTORICO (RESTA DE DIAS)'])
        .eq('estatus', 'APROBADO');
    
    let diasTomados = 0;
    vacs?.forEach(s => {
        if(s.fecha_inicio && s.fecha_fin) {
            const inicio = new Date(s.fecha_inicio + 'T00:00:00');
            const fin = new Date(s.fecha_fin + 'T00:00:00');
            const diff = Math.ceil(Math.abs(fin - inicio) / (1000 * 60 * 60 * 24)) + 1;
            diasTomados += diff;
        }
    });

    let baseLey = 0;
    if(fechaReferenciaStr) {
        baseLey = calcularDiasLeyMexicoProyectado(emp.fecha_ingreso, fechaReferenciaStr);
    } else {
        baseLey = calcularDiasLeyMexico(emp.fecha_ingreso);
    }

    const saldoReal = baseLey - diasTomados;
    return saldoReal < 0 ? 0 : saldoReal;
}

async function mostrarInfoVacacionesEmpleado() {
    const empId = document.getElementById('sel_empleado').value;
    const lbl = document.getElementById('lbl_vacaciones_disponibles');
    const fInicio = document.getElementById('sol_inicio').value;
    
    if(!empId) {
        lbl.style.display = 'none';
        return;
    }

    const saldoReal = await obtenerSaldoRealEmpleado(empId, fInicio);
    lbl.innerHTML = `<i class="fas fa-calendar-alt"></i> Saldo Vacaciones (A la fecha solicitada): <strong>${saldoReal} días disponibles</strong>`;
    lbl.style.display = 'block';
}

function calcularDiasSolicitadosDinamico() {
    const inicioStr = document.getElementById('sol_inicio').value;
    const finStr = document.getElementById('sol_fin').value;
    const lbl = document.getElementById('lbl_dias_calculados');

    if(!inicioStr || !finStr) {
        lbl.style.display = 'none';
        return;
    }

    const inicio = new Date(inicioStr + 'T00:00:00');
    const fin = new Date(finStr + 'T00:00:00');

    if(fin < inicio) {
        lbl.innerHTML = `<i class="fas fa-exclamation-circle"></i> Error: La fecha fin es menor.`;
        lbl.style.background = '#fee2e2';
        lbl.style.color = '#b91c1c';
        lbl.style.display = 'block';
        return;
    }

    const diffTime = Math.abs(fin - inicio);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

    lbl.innerHTML = `<i class="fas fa-calculator"></i> Período solicitado: <strong>${diffDays} ${diffDays === 1 ? 'día' : 'días'}</strong>`;
    lbl.style.background = '#fef3c7';
    lbl.style.color = '#d97706';
    lbl.style.display = 'block';

    mostrarInfoVacacionesEmpleado();
}

async function cargarSolicitudesBase() {
    const { data } = await client.from('rh_solicitudes').select('*, rh_empleados(nombre_completo)').order('created_at', { ascending: false });
    solicitudesGlobales = data || [];
    renderizarSolicitudes();
}

function filtrarLista(estatus) {
    filtroEstatusActual = estatus;
    document.querySelectorAll('[id^="sub-"]').forEach(btn => btn.classList.remove('active'));
    if(estatus === 'PENDIENTE') document.getElementById('sub-pend').classList.add('active');
    if(estatus === 'APROBADO') document.getElementById('sub-aprob').classList.add('active');
    if(estatus === 'RECHAZADO') document.getElementById('sub-rech').classList.add('active');
    renderizarSolicitudes();
}

function renderizarSolicitudes() {
    const cont = document.getElementById('contenedor-solicitudes');
    const filtradas = solicitudesGlobales.filter(s => s.estatus === filtroEstatusActual);
    
    if(filtradas.length === 0) {
        cont.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8; font-size:13px;">No existen solicitudes registradas en este estatus.</div>`;
        return;
    }

    cont.innerHTML = filtradas.map(s => {
        const esLocal = s.tipo.includes('LOCAL') || s.tipo.includes('TARDE') || s.tipo.includes('TEMPRANO');
        const periodo = esLocal ? `Fecha: ${s.fecha_inicio} (${s.hora_salida || '--:--'} a ${s.hora_regreso || '--:--'})` : `Periodo: ${s.fecha_inicio} al ${s.fecha_fin}`;
        
        let botones = '';
        if(s.estatus === 'PENDIENTE') {
            botones = `
                <div style="display:flex; gap:6px; margin-top: 10px;">
                    <button class="btn" style="padding:6px 12px; font-size:11px; background:var(--success);" onclick="resolverSolicitud('${s.id}', 'APROBADO')"><i class="fas fa-check"></i> Autorizar</button>
                    <button class="btn" style="padding:6px 12px; font-size:11px; background:var(--danger);" onclick="resolverSolicitud('${s.id}', 'RECHAZADO')"><i class="fas fa-times"></i> Denegar</button>
                </div>`;
        }

        const firma = s.autorizado_por ? `<span class="auditoria-firma"><i class="fas fa-user-shield"></i> Validado por: <strong>${s.autorizado_por}</strong> ${s.firma_digital ? `(${s.firma_digital})` : ''}</span>` : '';

        return `
            <div class="solicitud-card">
                <div class="solicitud-info">
                    <h4 style="color:var(--primary); font-size:15px; margin-bottom:6px;">${s.rh_empleados?.nombre_completo || 'Operador Kraem'}</h4>
                    <p style="font-size:13px;"><strong>Tipo:</strong> <span style="color:var(--accent); font-weight:bold;">${s.tipo}</span></p>
                    <p><strong>Rango:</strong> ${periodo}</p>
                    <p style="color:#475569; background:#f1f5f9; padding:6px; border-radius:4px; margin-top:4px;"><strong>Observaciones:</strong> ${s.observaciones || 'Sin detalles capturados'}</p>
                    ${firma}
                </div>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
                    <span class="badge badge-${s.estatus.toLowerCase()}">${s.estatus}</span>
                    ${botones}
                </div>
            </div>`;
    }).join('');
}

async function guardar(){
    const empId = document.getElementById('sel_empleado').value;
    const autId = document.getElementById('sel_autoriza').value;
    const tipo = document.getElementById('sol_tipo').value;
    const motivoText = document.getElementById('sol_motivo').value;

    if(!empId) return alert("Selecciona un empleado de la lista.");
    if(!motivoText.trim()) return alert("Favor de ingresar el motivo u observaciones de la ausencia.");

    const empSeleccionado = empleados.find(e => e.id === empId);

    const esLocal = tipo.includes('LOCAL') || tipo.includes('TARDE') || tipo.includes('TEMPRANO');
    let fInicio = document.getElementById('sol_inicio').value;
    let fFin = document.getElementById('sol_fin').value;

    if(esLocal) {
        fInicio = document.getElementById('sol_fecha_local').value;
        fFin = document.getElementById('sol_fecha_local').value;
    }

    // AUDITORÍA Y CONTROL PROYECTADO PARA VACACIONES Y AJUSTES
    if(tipo === 'VACACIONES' || tipo.includes('AJUSTE')) {
        const saldoDisponible = await obtenerSaldoRealEmpleado(empId, fInicio);
        
        if(tipo === 'VACACIONES' && saldoDisponible <= 0) {
            alert("No se puede registrar la solicitud. Para la fecha de inicio seleccionada, el operador aún no cuenta con días liberados de vacaciones.");
            return;
        }

        const inicio = new Date(fInicio + 'T00:00:00');
        const fin = new Date(fFin + 'T00:00:00');
        
        if(fin < inicio) {
            alert("La fecha de fin no puede ser menor a la fecha de inicio.");
            return;
        }

        const diffTime = Math.abs(fin - inicio);
        const diasSolicitados = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

        if(tipo === 'VACACIONES' && diasSolicitados > saldoDisponible) {
            alert(`Error de validación: El periodo seleccionado equivale a ${diasSolicitados} días, pero para esa fecha de inicio el operador solo tendrá ${saldoDisponible} días disponibles.`);
            return;
        }
    }

    const insertPayload = {
        empleado_id: empId,
        tipo: tipo,
        fecha_inicio: fInicio,
        fecha_fin: fFin,
        hora_salida: esLocal ? (document.getElementById('sol_hora_salida').value || null) : null,
        hora_regreso: esLocal ? (document.getElementById('sol_hora_regreso').value || null) : null,
        observaciones: motivoText,
        estatus: 'PENDIENTE',
        area: empSeleccionado ? empSeleccionado.area_id : null,
        turno: empSeleccionado ? empSeleccionado.turno_id : null,
        autorizador_asignado: autId || null,
        autorizado_por: null,
        firma_digital: null
    };

    const { error } = await client.from('rh_solicitudes').insert([insertPayload]);

    if(error) {
        alert("Error al registrar solicitud: " + error.message);
    } else {
        alert("Solicitud guardada con éxito y en espera de validación.");
        document.getElementById('sol_motivo').value = '';
        await mostrarInfoVacacionesEmpleado();
        await cargarSolicitudesBase();
    }
}

async function resolverSolicitud(id, nuevoEstatus) {
    const supervisorFirma = prompt("Ingresa tu Nombre Completo como Responsable de la Aprobación:", "");
    if (nuevoEstatus === 'APROBADO' && !supervisorFirma) {
        alert("Operación cancelada. Es obligatorio dejar rastro de auditoría para aprobar.");
        return;
    }

    if(nuevoEstatus === 'APROBADO') {
        const solicitudEnRevision = solicitudesGlobales.find(s => s.id === id);
        if(solicitudEnRevision && solicitudEnRevision.tipo === 'VACACIONES') {
            const saldoActual = await obtenerSaldoRealEmpleado(solicitudEnRevision.empleado_id, solicitudEnRevision.fecha_inicio);
            const inicio = new Date(solicitudEnRevision.fecha_inicio + 'T00:00:00');
            const fin = new Date(solicitudEnRevision.fecha_fin + 'T00:00:00');
            const diffDays = Math.ceil(Math.abs(fin - inicio) / (1000 * 60 * 60 * 24)) + 1;

            if(diffDays > saldoActual) {
                alert(`Bloqueo de Auditoría: No se puede aprobar esta solicitud. El saldo proyectado para esa fecha es de ${saldoActual} días, pero la solicitud exige ${diffDays} días.`);
                return;
            }
        }
    }

    const { error } = await client.from('rh_solicitudes').update({ 
        estatus: nuevoEstatus,
        autorizado_por: supervisorFirma || 'Mánager Turno',
        firma_digital: nuevoEstatus === 'APROBADO' ? 'FIRMA_OK' : 'RECHAZADO_PLANTA'
    }).eq('id', id);

    if(error) alert("Error al resolver: " + error.message);
    else {
        alert(`Solicitud procesada como ${nuevoEstatus}.`);
        await cargarSolicitudesBase();
        await mostrarInfoVacacionesEmpleado();
    }
}

// CARGA DE SALDOS GENERAL CON ESTRUCTURA OPTIMIZADA
async function cargarSaldos() {
    const body = document.getElementById('body-saldos');
    body.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">Consultando base de datos unificada...</td></tr>`;

    // Descarga única del histórico aprobado para optimizar velocidad con 300+ registros
    const { data } = await client.from('rh_solicitudes')
        .select('empleado_id, fecha_inicio, fecha_fin, tipo, autorizado_por')
        .in('tipo', ['VACACIONES', 'AJUSTE HISTORICO (RESTA DE DIAS)'])
        .eq('estatus', 'APROBADO')
        .order('fecha_inicio', { ascending: false });

    solicitudesVacAprobadas = data || [];
    aplicarFiltrosSaldos();
}

// FILTRADO DINÁMICO DE ALTA VELOCIDAD (EN MEMORIA DE CLIENTE)
function aplicarFiltrosSaldos() {
    const areaFiltro = document.getElementById('f_saldo_area').value;
    const nombreFiltro = document.getElementById('f_saldo_nombre').value.toLowerCase().trim();
    const body = document.getElementById('body-saldos');

    const empleadosFiltrados = empleados.filter(emp => {
        const cumpleArea = !areaFiltro || emp.area_id == areaFiltro;
        const cumpleNombre = !nombreFiltro || emp.nombre_completo.toLowerCase().includes(nombreFiltro);
        return cumpleArea && cumpleNombre;
    });

    if(empleadosFiltrados.length === 0) {
        body.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">No se encontraron operadores con los filtros seleccionados.</td></tr>`;
        return;
    }

    body.innerHTML = empleadosFiltrados.map(emp => {
        let diasTomados = 0;
        const deEsteEmpleado = solicitudesVacAprobadas.filter(s => s.empleado_id === emp.id);
        
        deEsteEmpleado.forEach(s => {
            if (s.fecha_inicio && s.fecha_fin) {
                const inicio = new Date(s.fecha_inicio + 'T00:00:00');
                const fin = new Date(s.fecha_fin + 'T00:00:00');
                const diffDays = Math.ceil(Math.abs(fin - inicio) / (1000 * 60 * 60 * 24)) + 1;
                diasTomados += diffDays;
            }
        });

        const baseLey = calcularDiasLeyMexico(emp.fecha_ingreso);
        const saldoReal = baseLey - diasTomados;

        return `
            <tr>
                <td><span class="row-link" onclick="abrirKardex('${emp.id}', '${emp.nombre_completo}')"><i class="fas fa-folder-open"></i> ${emp.nombre_completo}</span></td>
                <td style="color:#475569;">${emp.fecha_ingreso || 'Sin registrar'}</td>
                <td>${baseLey} días</td>
                <td style="color:var(--danger); font-weight:bold;">${diasTomados} días</td>
                <td style="color:${saldoReal <= 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:bold; font-size:14px;">${saldoReal} días</td>
            </tr>`;
    }).join('');
}

// CONTROL DEL MODAL INDIVIDUAL (KÁRDEX DIGITAL DE INCIDENCIAS)
function abrirKardex(empId, nombreCompleto) {
    document.getElementById('kardex-nombre').innerHTML = `<i class="fas fa-history"></i> Historial Pro: <strong>${nombreCompleto}</strong>`;
    const tbody = document.getElementById('kardex-tabla-body');
    
    const bitacora = solicitudesVacAprobadas.filter(s => s.empleado_id === empId);

    if(bitacora.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#64748b; padding:20px;">Este operador no cuenta con días tomados o ajustes cargados en el sistema.</td></tr>`;
    } else {
        tbody.innerHTML = bitacora.map(s => {
            const inicio = new Date(s.fecha_inicio + 'T00:00:00');
            const fin = new Date(s.fecha_fin + 'T00:00:00');
            const diffDays = Math.ceil(Math.abs(fin - inicio) / (1000 * 60 * 60 * 24)) + 1;
            
            const esAjuste = s.tipo.includes('AJUSTE');
            const badgeTipo = esAjuste ? `<span style="color:var(--warning); font-weight:700;">⚠️ AJUSTE</span>` : `<span style="color:var(--accent); font-weight:700;">VACACIONES</span>`;

            return `
                <tr>
                    <td>${badgeTipo}</td>
                    <td>${s.fecha_inicio} al ${s.fecha_fin}</td>
                    <td style="font-weight:700; color:var(--danger);">${diffDays} días</td>
                    <td style="font-size:11px; color:#475569;">${s.autorizado_por || 'Sistema'}</td>
                </tr>`;
        }).join('');
    }

    document.getElementById('modal-kardex').style.display = 'flex';
}

function cerrarModal() {
    document.getElementById('modal-kardex').style.display = 'none';
}

// Cerrar modal si hacen clic fuera de la caja blanca
window.onclick = function(event) {
    const modal = document.getElementById('modal-kardex');
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
