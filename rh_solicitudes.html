<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM RH PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.container{display:grid;grid-template-columns:400px 1fr;gap:20px}
.card{background:white;padding:20px;border-radius:12px}
select,input{width:100%;padding:10px;margin-bottom:10px}
button{width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:8px}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h3>Registrar Solicitud</h3>

<select id="f_area"></select>

<select id="f_turno">
<option value="">Turno</option>
<option value="1">Turno 1</option>
<option value="2">Turno 2</option>
</select>

<select id="sel_empleado"></select>

<select id="tipo">
<option value="VACACIONES">Vacaciones</option>
<option value="PERMISO">Permiso</option>
<option value="SALIDA_TEMPRANO">Salida temprano</option>
</select>

<input type="date" id="f_ini">
<input type="date" id="f_fin">
<input type="time" id="h_sol">

<button onclick="guardar()">Guardar</button>

</div>

<div class="card">
<h3>Debug</h3>
<pre id="debug"></pre>
</div>

</div>

<script>
let empleados=[];
let areas=[];

// INIT
async function init(){

// 🔥 TRAER AREAS BIEN
const { data: a } = await client.from('rh_areas').select('*');
areas = a || [];

// 🔥 TRAER EMPLEADOS SIN JOIN
const { data: e } = await client
.from('rh_empleados')
.select('*')
.eq('estatus','ACTIVO');

empleados = e || [];

console.log("EMPLEADOS:", empleados);
console.log("AREAS:", areas);

document.getElementById('debug').innerText =
JSON.stringify({empleados,areas}, null, 2);

// CARGAR AREAS
const selArea = document.getElementById('f_area');
selArea.innerHTML = '<option value="">Área</option>';

areas.forEach(a=>{
selArea.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
});

// FILTRAR
filtrar();

}

// FILTRAR EMPLEADOS
function filtrar(){

const area = document.getElementById('f_area').value;
const turno = document.getElementById('f_turno').value;

const list = empleados.filter(e=>
(!area || e.area_id == area) &&
(!turno || e.turno_id == turno)
);

const sel = document.getElementById('sel_empleado');
sel.innerHTML = '<option value="">Empleado</option>';

list.forEach(e=>{
sel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`;
});

}

document.getElementById('f_area').onchange = filtrar;
document.getElementById('f_turno').onchange = filtrar;

// GUARDAR
async function guardar(){

const emp = document.getElementById('sel_empleado').value;

if(!emp) return alert("Selecciona empleado");

await client.from('rh_solicitudes').insert([{
empleado_id: emp,
tipo: document.getElementById('tipo').value,
fecha_inicio: document.getElementById('f_ini').value,
fecha_fin: document.getElementById('f_fin').value,
hora_salida: document.getElementById('h_sol').value,
estatus: 'PENDIENTE'
}]);

alert("Guardado correctamente");

}

// INIT
init();
</script>

</body>
</html>
