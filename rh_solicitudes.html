<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Solicitudes RH PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#0f172a;
    --accent:#2563eb;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
    --success:#22c55e;
    --danger:#ef4444;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    margin:0;
    padding:20px;
}

.container {
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns: 420px 1fr;
    gap:20px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
}

label {
    font-size:11px;
    font-weight:700;
    color:#64748b;
}

input, select, textarea {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    margin-bottom:12px;
}

.btn {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:white;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h3>Registrar Solicitud</h3>

<select id="f_area" onchange="filtrarEmpleados()"></select>
<select id="f_turno" onchange="filtrarEmpleados()">
<option value="">Turno</option>
<option value="1">Turno 1</option>
<option value="2">Turno 2</option>
</select>

<select id="sel_empleado"></select>

<h4>Autoriza</h4>

<select id="f_area_aut" onchange="filtrarAutorizadores()"></select>
<select id="f_turno_aut" onchange="filtrarAutorizadores()">
<option value="">Turno</option>
<option value="1">Turno 1</option>
<option value="2">Turno 2</option>
</select>

<select id="sel_autoriza"></select>

<button class="btn" onclick="guardar()">Guardar</button>
</div>

</div>

<script>

let empleados = [];
let areas = [];

async function init(){

// EMPLEADOS
const { data:emp } = await client
.from('rh_empleados')
.select('*')
.eq('estatus','ACTIVO');

empleados = emp || [];

console.log("EMPLEADOS:", empleados);

// AREAS
const { data:ar } = await client
.from('rh_areas')
.select('*')
.eq('activo',true);

areas = ar || [];

console.log("AREAS:", areas);

cargarAreas();
filtrarEmpleados();
filtrarAutorizadores();
}

// CARGAR AREAS
function cargarAreas(){

const sel1 = document.getElementById('f_area');
const sel2 = document.getElementById('f_area_aut');

sel1.innerHTML = '<option value="">Área</option>';
sel2.innerHTML = '<option value="">Área</option>';

areas.forEach(a=>{
sel1.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
sel2.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
});
}

// FILTRAR EMPLEADOS
function filtrarEmpleados(){

const area = document.getElementById('f_area').value;
const turno = document.getElementById('f_turno').value;

const lista = empleados.filter(e=>
(!area || e.area_id == area) &&
(!turno || e.turno_id == turno)
);

const sel = document.getElementById('sel_empleado');
sel.innerHTML = '<option value="">Empleado</option>';

lista.forEach(e=>{
sel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`;
});
}

// FILTRAR AUTORIZADORES
function filtrarAutorizadores(){

const area = document.getElementById('f_area_aut').value;
const turno = document.getElementById('f_turno_aut').value;

const lista = empleados.filter(e=>
(!area || e.area_id == area) &&
(!turno || e.turno_id == turno)
);

const sel = document.getElementById('sel_autoriza');
sel.innerHTML = '<option value="">Autoriza</option>';

lista.forEach(e=>{
sel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`;
});
}

// GUARDAR
async function guardar(){

const emp = document.getElementById('sel_empleado').value;
const aut = document.getElementById('sel_autoriza').value;

if(!emp) return alert("Selecciona empleado");

await client.from('rh_solicitudes').insert([{
empleado_id: emp,
autorizado_por: aut,
estatus:'PENDIENTE'
}]);

alert("Guardado");
}

init();

</script>

</body>
</html>
