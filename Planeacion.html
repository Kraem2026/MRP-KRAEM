<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAEM | Redirección a Cockpit de Planeación</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:'Segoe UI',system-ui,sans-serif}
[data-theme="dark"] body{background:#090d16;color:#f1f5f9}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px 28px;max-width:420px;text-align:center}
[data-theme="dark"] .box{background:#111827;border-color:#1f2937}
a{display:inline-block;margin-top:12px;background:#2563eb;color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;text-decoration:none}
p{color:#64748b;font-size:13px;margin:6px 0 0}
</style>
</head>
<body>
<div class="box">
  <h3 style="margin:0">Pantalla retirada</h3>
  <p>Esta pantalla fue unificada en el módulo oficial <strong>Cockpit de Planeación</strong>.</p>
  <a id="fallbackLink" href="planeacion_hub.html">Continuar al módulo oficial →</a>
</div>
<script>
(function(){
  if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark');
  var TARGET_URL = 'planeacion_hub.html' + (window.location.search || '');
  window.__REDIRECT_TARGET = TARGET_URL;
  document.getElementById('fallbackLink').setAttribute('href', TARGET_URL);
  if (!window.__KRAEM_TEST_NO_REDIRECT) window.location.replace(TARGET_URL);
})();
</script>
</body>
</html>
