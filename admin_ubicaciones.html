<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRAEM | Catálogo de Ubicaciones y Contenedores</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#1e293b;
  --border:#e2e8f0;
  --success:#22c55e;
  --danger:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{\n  font-family:'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

.container{\n  max-width:1400px;
  margin:auto;
}

header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background: var(--card); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); }
.btn-nav { background:#6c757d; color:white; border:none; padding:8px 15px; cursor:pointer; border-radius:8px; font-weight:bold; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }

.grid {
  display: grid;
  grid-template-columns: 350px 1fr;
  gap: 20px;
}

@media(max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 5px;
  color: #64748b;
  text-transform: uppercase;
}

input, select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
}

input:disabled, select:disabled {
  background: #e2e8f0;
  color: #94a3b8;
  cursor: not-allowed;
}

.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: #e2e8f0; color: #475569; margin-top: 8px; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

th {
  background: var(--bg);
  font-weight: 600;
  font-size: 13px;
  color: #64748b;
}

.actions {
  display: flex;
  gap: 8px;
}

.btn-action {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 16px;
}
.btn-edit { color: var(--primary); }
.btn-delete { color: var(--danger); }

.badge {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
}
.badge-fijo { background: #e0f2fe; color: #0369a1; }
.badge-movil { background: #fef3c7; color: #b45309; }
</style>
</head>
<body>

<div class="container">
  <header>
    <a href="dashboard.html" class="btn-nav"><i class="fas fa-arrow-left"></i> Volver</a>
    <h2>Gestión de Almacén (Ubicaciones y Contenedores)</h2>
  </header>

  <div class="grid">
    <div class="card">
      <h3 id="formTitle" style="margin-bottom: 15px;">Crear Registro</h3>
      
      <div class="form-group">
        <label>Tipo de Registro</label>
        <select id="regType" onchange="toggleFormFields()">
          <option value="Fijo">📍 Ubicación Fija (Carril / Rack)</option>
          <option value="Móvil">🛒 Contenedor Móvil (Carrito / Palet)</option>
        </select>
      </div>

      <div class="form-group div-control-area">
        <label>Área General</label>
        <select id="area_general_id" onchange="loadAreas()"></select>
      </div>

      <div class="form-group div-control-area">
        <label>Área Específica</label>
        <select id="area_id"></select>
      </div>

      <div class="form-group">
        <label>Código (QR Escaneable)</label>
        <input type="text" id="location_code" placeholder="Ej: P1 o CARRO-001" style="text-transform: uppercase;">
      </div>

      <div class="form-group">
        <label>Nombre / Descripción</label>
        <input type="text" id="location_name" placeholder="Ej: Fila Piso 1 o Carrito de Serigrafía">
      </div>

      <button class="btn btn-primary" onclick="guardar()">Guardar Registro</button>
      <button class="btn btn-secondary" onclick="limpiarFormulario()">Cancelar / Limpiar</button>
    </div>

    <div class="card" style="overflow-x: auto;">
      <h3 style="margin-bottom: 15px;">Registros en Sistema</h3>
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Código</th>
            <th>Descripción</th>
            <th>Área General</th>
            <th>Área Específica</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// Inicialización de Supabase usando tus datos configurados
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editandoId = null;
let areasGenerales = [];
let areasEspecificas = [];

async function init() {
  // Cargar áreas generales
  const { data: ag } = await client.from('areas_generales').select('*').order('nombre', { ascending: true });
  if(ag) {
    areasGenerales = ag;
    area_general_id.innerHTML = '<option value="">-- Seleccione Área General --</option>';
    ag.forEach(item => {
      area_general_id.innerHTML += `<option value="${item.id}">${item.nombre}</option>`;
    });
  }

  // Cargar áreas específicas completas para mapeos rápidos
  const { data: ae } = await client.from('areas').select('*');
  if(ae) areasEspecificas = ae;

  load();
}

async function loadAreas() {
  const agId = area_general_id.value;
  area_id.innerHTML = '<option value="">-- Seleccione Área Específica --</option>';
  if(!agId) return;

  const filtradas = areasEspecificas.filter(a => a.area_general_id == agId);
  filtradas.forEach(item => {
    area_id.innerHTML += `<option value="${item.id}">${item.area_name}</option>`;
  });
}

function toggleFormFields() {
  const type = regType.value;
  const areaFields = document.querySelectorAll('.div-control-area');
  
  if(type === 'Móvil') {
    // Si es móvil/contenedor, no pertenece a un área fija de manera estricta en el catálogo
    area_general_id.value = '';
    area_id.innerHTML = '';
    areaFields.forEach(f => f.style.display = 'none');
  } else {
    areaFields.forEach(f => f.style.display = 'block');
  }
}

async function load() {
  // Traemos todas las ubicaciones y contenedores
  const { data: locs, error } = await client.from('locations').select('*').order('location_code', { ascending: true });
  if(error) return console.error(error);

  tablaBody.innerHTML = '';
  locs.forEach(r => {
    // Buscar nombres de las áreas vinculadas si existen
    const areaEsp = areasEspecificas.find(a => a.id === r.area_id);
    const areaGen = areaEsp ? areasGenerales.find(g => g.id === areaEsp.area_general_id) : null;

    const tr = document.createElement('tr');
    const badgeClass = r.type === 'Móvil' || r.type === 'Contenedor' ? 'badge-movil' : 'badge-fijo';
    const badgeLabel = r.type === 'Móvil' || r.type === 'Contenedor' ? 'MÓVIL' : 'FIJO';

    tr.innerHTML = `
      <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
      <td><b>${r.location_code}</b></td>
      <td>${r.location_name || ''}</td>
      <td>${areaGen ? areaGen.nombre : '<span style="color:#94a3b8">N/A</span>'}</td>
      <td>${areaEsp ? areaEsp.area_name : '<span style="color:#94a3b8">N/A</span>'}</td>
      <td class="actions">
        <button class="btn-action btn-edit" onclick="editar(${JSON.stringify(r).replace(/"/g, '&quot;')})"><i class="fas fa-edit"></i></button>
        <button class="btn-action btn-delete" onclick="eliminar(${r.id})"><i class="fas fa-trash"></i></button>
      </td>
    `;
    tablaBody.appendChild(tr);
  });
}

function editar(r) {
  editandoId = r.id;
  document.getElementById('formTitle').innerText = 'Editar Registro';
  
  // Detectar tipo
  const esMovil = r.type === 'Móvil' || r.type === 'Contenedor';
  regType.value = esMovil ? 'Móvil' : 'Fijo';
  toggleFormFields();

  location_code.value = r.location_code;
  location_name.value = r.location_name || '';

  if (!esMovil && r.area_id) {
    const areaEsp = areasEspecificas.find(a => a.id === r.area_id);
    if(areaEsp) {
      area_general_id.value = areaEsp.area_general_id;
      // Forzar carga de áreas específicas del bloque general seleccionado
      const filtradas = areasEspecificas.filter(a => a.area_general_id == areaEsp.area_general_id);
      area_id.innerHTML = '';
      filtradas.forEach(item => {
        area_id.innerHTML += `<option value="${item.id}">${item.area_name}</option>`;
      });
      area_id.value = r.area_id;
    }
  }
}

async function guardar() {
  if(!location_code.value.trim()) return alert('Ingrese el código identificador (QR)');

  const typeValue = regType.value; // 'Fijo' o 'Móvil'
  const asignaArea = typeValue === 'Fijo' ? area_id.value : null;

  if(typeValue === 'Fijo' && !asignaArea) {
    return alert('Las ubicaciones fijas deben tener un Área Específica asignada.');
  }

  let error;
  const payload = {
    location_code: location_code.value.toUpperCase().trim(),
    location_name: location_name.value.trim(),
    area_id: asignaArea ? parseInt(asignaArea) : null,
    type: typeValue, // Aquí se guarda la separación clave
    qr_code: location_code.value.toUpperCase().trim() // El QR por defecto es su propio código
  };

  if(editandoId){
    const res = await client.from('locations').update(payload).eq('id', editandoId);
    error = res.error;
  } else {
    const res = await client.from('locations').insert([{ ...payload, active: true }]);
    error = res.error;
  }

  if(error){
    alert(error.message);
    return;
  }

  alert(editandoId ? 'Registro actualizado con éxito' : 'Registro creado con éxito');
  limpiarFormulario();
  load();
}

async function eliminar(id) {
  if(!confirm('¿Está seguro de eliminar este registro del almacén?')) return;
  const { error } = await client.from('locations').delete().eq('id', id);
  if(error) alert(error.message);
  else { alert('Registro eliminado'); load(); }
}

function limpiarFormulario(){\n  editandoId = null;
  document.getElementById('formTitle').innerText = 'Crear Registro';
  regType.value = 'Fijo';
  area_general_id.value = '';
  area_id.innerHTML = '';
  location_code.value = '';
  location_name.value = '';
  toggleFormFields();
}

// Arrancar proceso al cargar la página
init();
</script>
</body>
</html>
