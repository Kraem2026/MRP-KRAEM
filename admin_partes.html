<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Maestro de Partes - WMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <a href="catalogos_ingenieria.html" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></a>
            <h1 class="text-xl font-bold">Catálogo Maestro de Números de Parte</h1>
        </div>
        <a href="ingenieria_nuevo_np.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold text-sm flex items-center">
            <i class="fa-solid fa-plus mr-2"></i> Nuevo NP
        </a>
    </header>

    <!-- Content -->
    <main class="flex-1 container mx-auto p-4 sm:p-6 max-w-7xl">
        <!-- Filtros y Búsqueda -->
        <div class="bg-white p-4 rounded-xl shadow mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="search-input" onkeyup="fetchParts()" placeholder="Buscar por NP, Nombre o Proyecto..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <select id="type-filter" onchange="fetchParts()" class="border rounded-lg px-3 py-2 text-sm bg-slate-50">
                    <option value="">Todos los Tipos</option>
                    <option value="PT">Producto Terminado (PT)</option>
                    <option value="COMPONENTE">Componente</option>
                    <option value="RESINA">Resina</option>
                </select>
            </div>
        </div>

        <!-- Tabla -->
        <div class="bg-white rounded-xl shadow overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-3">Tipo</th>
                            <th class="p-3">Número de Parte</th>
                            <th class="p-3">Nombre / Descripción</th>
                            <th class="p-3">Cliente / Prov.</th>
                            <th class="p-3">Proyecto</th>
                            <th class="p-3 text-center">UOM</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="parts-table-body" class="divide-y divide-slate-200 text-sm">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal QR -->
    <div id="qr-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-lg font-bold text-slate-800 mb-2" id="modal-part-num">NP-12345</h3>
            <div class="flex justify-center p-4 bg-slate-50 border rounded-lg mb-4">
                <canvas id="qr-canvas"></canvas>
            </div>
            <div class="flex gap-2 justify-center">
                <button onclick="downloadQR()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">Descargar PNG</button>
                <button onclick="closeQRModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchParts);

        async function fetchParts() {
            const query = document.getElementById('search-input').value.trim();
            const type = document.getElementById('type-filter').value;

            let req = supabaseClient.from('parts').select('*').order('created_at', { ascending: false });

            if(type) req = req.eq('product_type', type);
            if(query) req = req.or(`part_number.ilike.%${query}%,part_name.ilike.%${query}%,project_model.ilike.%${query}%`);

            const { data, error } = await req;
            if(error) return console.error(error);

            const tbody = document.getElementById('parts-table-body');
            tbody.innerHTML = '';

            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3"><span class="px-2 py-1 text-xs font-bold rounded ${getTypeBadge(p.product_type)}">${p.product_type}</span></td>
                    <td class="p-3 font-mono font-bold text-blue-600 hover:underline"><a href="part_ficha_tecnica.html?id=${p.id}">${p.part_number}</a></td>
                    <td class="p-3">${p.part_name}</td>
                    <td class="p-3">${p.customer || p.supplier || '-'}</td>
                    <td class="p-3">${p.project_model || '-'}</td>
                    <td class="p-3 text-center font-bold">${p.unit_of_measure || 'PZA'}</td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="openQR('${p.part_number}')" class="text-slate-600 hover:text-blue-600" title="Ver QR"><i class="fa-solid fa-qrcode text-lg"></i></button>
                        <a href="ingenieria_nuevo_np.html?id=${p.id}" class="text-slate-600 hover:text-amber-600" title="Editar"><i class="fa-solid fa-pen text-lg"></i></a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getTypeBadge(type) {
            if(type === 'PT') return 'bg-emerald-100 text-emerald-800';
            if(type === 'COMPONENTE') return 'bg-blue-100 text-blue-800';
            return 'bg-purple-100 text-purple-800';
        }

        let currentQRNum = '';
        function openQR(partNumber) {
            currentQRNum = partNumber;
            document.getElementById('modal-part-num').innerText = partNumber;
            QRCode.toCanvas(document.getElementById('qr-canvas'), partNumber, { width: 200 }, function (error) {
                if (error) console.error(error);
            });
            document.getElementById('qr-modal').classList.remove('hidden');
            document.getElementById('qr-modal').classList.add('flex');
        }

        function closeQRModal() {
            document.getElementById('qr-modal').classList.add('hidden');
            document.getElementById('qr-modal').classList.remove('flex');
        }

        function downloadQR() {
            const canvas = document.getElementById('qr-canvas');
            const link = document.createElement('a');
            link.download = `QR_${currentQRNum}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
