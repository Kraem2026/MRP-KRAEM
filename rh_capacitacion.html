<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitación y Matriz de Habilidades | KRAEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #4f46e5; --bg: #f3f4f6; --card: #ffffff; 
            --text: #1f2937; --accent: #06b6d4;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        /* Navbar de navegación interna */
        .nav-tabs { background: #fff; display: flex; gap: 20px; padding: 0 30px; border-bottom: 2px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
        .tab-btn { padding: 15px 25px; border: none; background: none; cursor: pointer; font-weight: 600; color: #6b7280; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { padding: 30px; max-width: 1400px; margin: auto; }
        .view { display: none; }
        .view.active { display: block; }

        /* Dashboard Styles */
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }

        /* Matriz Styles */
        .matrix-table-wrapper { background: white; padding: 20px; border-radius: 15px; overflow-x: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; border: 1px solid #e5e7eb; text-align: center; }
        th { background: #f9fafb; color: #4b5563; }
        .skill-level { width: 25px; height: 25px; border-radius: 50%; display: inline-block; }
        .lv-0 { background: #fee2e2; border: 1px solid #ef4444; } /* No sabe */
        .lv-1 { background: #fef9c3; border: 1px solid #eab308; } /* En entrenamiento */
        .lv-2 { background: #dcfce7; border: 1px solid #22c55e; } /* Experto */

        /* Modal */
        .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.5); }
        .modal-content { background:#fff; width:400px; margin: 10% auto; padding:30px; border-radius:15px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchView('dash')"><i class="fas fa-chart-pie"></i> Dashboard Planta</button>
    <button class="tab-btn" onclick="switchView('matrix')"><i class="fas fa-th"></i> Matriz de Conocimientos</button>
</div>

<div class="container">
    
    <div id="view-dash" class="view active">
        <div class="grid-stats">
            <div class="stat-card">
                <div class="stat-icon" style="background: #4f46e5;"><i class="fas fa-graduation-cap"></i></div>
                <div><small>Promedio General</small><h2 id="avg-total">0%</h2></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #06b6d4;"><i class="fas fa-users"></i></div>
                <div><small>Personal Capacitado</small><h2 id="total-staff">0</h2></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #10b981;"><i class="fas fa-certificate"></i></div>
                <div><small>Certificaciones Activas</small><h2 id="total-certs">0</h2></div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div class="matrix-table-wrapper">
                <h3>% Capacitación por Área</h3>
                <canvas id="areaChart"></canvas>
            </div>
            <div class="matrix-table-wrapper">
                <h3>Top 5 Empleados Multihabilidades</h3>
                <canvas id="empChart"></canvas>
            </div>
        </div>
    </div>

    <div id="view-matrix" class="view">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Matriz de Habilidades por Proceso</h2>
            <button class="tab-btn" style="background: var(--primary); color: white; border-radius: 8px;" onclick="openModal()">
                <i class="fas fa-plus"></i> Registrar Competencia
            </button>
        </div>

        <div class="matrix-table-wrapper">
            <table id="matrix-table">
                <thead>
                    <tr id="matrix-header">
                        <th>Operador / Área</th>
                        </tr>
                </thead>
                <tbody id="matrix-body">
                    </tbody>
            </table>
        </div>
    </div>

</div>

<div id="modalSkill" class="modal">
    <div class="modal-content">
        <h3>Registrar Conocimiento</h3>
        <label>Empleado</label>
        <select id="sel-emp"></select>
        
        <label>Habilidad / Máquina / Curso</label>
        <select id="sel-skill">
            <option value="Operación Nissei">Operación Nissei</option>
            <option value="Ajuste de Parámetros">Ajuste de Parámetros</option>
            <option value="Seguridad Industrial">Seguridad Industrial</option>
            <option value="Calidad y Defectos">Calidad y Defectos</option>
        </select>

        <label>Nivel de Dominio</label>
        <select id="sel-level">
            <option value="0">0 - No conoce / Solo teoría</option>
            <option value="1">1 - En formación / Bajo supervisión</option>
            <option value="2">2 - Experto / Puede enseñar</option>
        </select>

        <button onclick="saveSkill()" style="background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px;">Guardar en Matriz</button>
        <button onclick="closeModal()" style="background: #9ca3af; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px;">Cancelar</button>
    </div>
</div>

<script>
let skillsData = [];
let emps = [];

async function init() {
    // 1. Cargar empleados para los selects
    const { data: staff } = await client.from('rh_empleados').select('id, nombre_completo, area').order('nombre_completo');
    emps = staff || [];
    const sel = document.getElementById('sel-emp');
    emps.forEach(e => sel.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`);

    // 2. Cargar datos de la matriz (asumiendo tabla rh_matriz_habilidades)
    loadMatrix();
}

function switchView(view) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById('view-' + view).classList.add('active');
    event.currentTarget.classList.add('active');
}

async function loadMatrix() {
    const { data, error } = await client.from('rh_matriz_habilidades').select('*, rh_empleados(nombre_completo, area)');
    skillsData = data || [];
    
    renderMatrix();
    renderCharts();
}

function renderMatrix() {
    const tableBody = document.getElementById('matrix-body');
    const tableHead = document.getElementById('matrix-header');
    
    // Obtener habilidades únicas para las columnas
    const uniqueSkills = [...new Set(skillsData.map(s => s.habilidad))];
    
    // Limpiar y crear cabecera
    tableHead.innerHTML = '<th>Operador / Área</th>';
    uniqueSkills.forEach(s => tableHead.innerHTML += `<th>${s}</th>`);
    tableHead.innerHTML += '<th>% Cumplimiento</th>';

    // Agrupar por empleado
    const grouped = {};
    emps.forEach(e => {
        grouped[e.id] = { nombre: e.nombre_completo, area: e.area, skills: {} };
    });

    skillsData.forEach(s => {
        if(grouped[s.empleado_id]) grouped[s.empleado_id].skills[s.habilidad] = s.nivel;
    });

    tableBody.innerHTML = '';
    Object.values(grouped).forEach(emp => {
        let row = `<td><strong>${emp.nombre}</strong><br><small>${emp.area || 'Planta'}</small></td>`;
        let points = 0;
        uniqueSkills.forEach(s => {
            const lv = emp.skills[s] !== undefined ? emp.skills[s] : -1;
            const colorClass = lv == 2 ? 'lv-2' : (lv == 1 ? 'lv-1' : (lv == 0 ? 'lv-0' : ''));
            row += `<td><span class="skill-level ${colorClass}"></span></td>`;
            if(lv == 2) points += 100;
            else if(lv == 1) points += 50;
        });
        
        const pct = uniqueSkills.length > 0 ? Math.round(points / uniqueSkills.length) : 0;
        row += `<td style="font-weight:bold; color:var(--primary)">${pct}%</td>`;
        tableBody.innerHTML += `<tr>${row}</tr>`;
    });
}

function renderCharts() {
    // Gráfica por Área (Promedio)
    const areas = [...new Set(emps.map(e => e.area || 'General'))];
    const areaValues = areas.map(a => 75 + Math.floor(Math.random() * 20)); // Simulado para el ejemplo

    new Chart(document.getElementById('areaChart'), {
        type: 'bar',
        data: {
            labels: areas,
            datasets: [{ label: '% Capacitación', data: areaValues, backgroundColor: '#4f46e5' }]
        },
        options: { indexAxis: 'y', scales: { x: { max: 100 } } }
    });
}

// Funciones del Modal
function openModal() { document.getElementById('modalSkill').style.display = 'block'; }
function closeModal() { document.getElementById('modalSkill').style.display = 'none'; }

async function saveSkill() {
    const payload = {
        empleado_id: document.getElementById('sel-emp').value,
        habilidad: document.getElementById('sel-skill').value,
        nivel: parseInt(document.getElementById('sel-level').value),
        actualizado_el: new Date().toISOString()
    };

    const { error } = await client.from('rh_matriz_habilidades').upsert(payload, { onConflict: 'empleado_id,habilidad' });
    
    if(!error) {
        alert("Matriz actualizada correctamente");
        closeModal();
        loadMatrix();
    }
}

window.onload = init;
</script>
</body>
</html>
