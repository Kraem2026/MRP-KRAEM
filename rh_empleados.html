```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRAEM | Gestión Personal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="config.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

:root{
    --primary:#0f172a;
    --accent:#2563eb;
    --bg:#f8fafc;
    --text:#1e293b;
    --border:#e2e8f0;
}

body{
    margin:0;
    padding:15px;
    background:var(--bg);
    font-family:Arial;
    color:var(--text);
}

.container{
    max-width:1600px;
    margin:auto;
}

.nav-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.btn{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:var(--accent);
    color:white;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    border:1px solid var(--border);
    margin-bottom:20px;
}

.inputs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
    color:#64748b;
}

input,select{
    padding:10px;
    border-radius:8px;
    border:1px solid #cbd5e1;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f8fafc;
    padding:12px;
    font-size:11px;
    text-transform:uppercase;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f8fafc;
    cursor:pointer;
}

.status-activo{
    background:#dcfce7;
    color:#166534;
    padding:4px 8px;
    border-radius:6px;
    font-size:11px;
}

.status-baja{
    background:#fee2e2;
    color:#991b1b;
    padding:4px 8px;
    border-radius:6px;
    font-size:11px;
}

.dashboard{
    display:none;
    grid-template-columns:350px 1fr 300px;
    gap:20px;
    margin-bottom:20px;
}

.metric-card{
    background:white;
    border:1px solid #eee;
    padding:15px;
    border-radius:10px;
    text-align:center;
    margin-bottom:10px;
}

.metric-value{
    font-size:24px;
    font-weight:bold;
    color:var(--accent);
}

.metric-label{
    font-size:11px;
    text-transform:uppercase;
    color:#64748b;
}

@media(max-width:1000px){

    .dashboard{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="nav-header">

    <h2>Gestión Personal KRAEM</h2>

    <button class="btn btn-primary"
    onclick="exportarExcel()">

        EXPORTAR

    </button>

</div>

<div id="dashboard" class="dashboard">

    <div class="card">

        <div style="text-align:center;">

            <img
            id="view_foto"
            src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
            style="
                width:110px;
                height:110px;
                border-radius:50%;
                object-fit:cover;
                border:4px solid var(--accent);
            ">

            <h3 id="view_nombre">-</h3>

            <div id="view_puesto_area"></div>

        </div>

        <hr>

        <p><b>NSS:</b> <span id="view_nss"></span></p>

        <p><b>Ingreso:</b> <span id="view_ingreso"></span></p>

        <p><b>Antigüedad:</b> <span id="view_antiguedad"></span></p>

        <p><b>Dirección:</b> <span id="view_direccion"></span></p>

    </div>

    <div class="card">

        <canvas id="chartRadar"></canvas>

    </div>

    <div>

        <div class="metric-card">
            <div class="metric-label">Calidad</div>
            <div class="metric-value" id="val_yield">0%</div>
        </div>

        <div class="metric-card">
            <div class="metric-label">Asistencia</div>
            <div class="metric-value" id="val_asistencia">0%</div>
        </div>

        <div class="metric-card">
            <div class="metric-label">Puntualidad</div>
            <div class="metric-value" id="val_puntualidad">0%</div>
        </div>

        <div class="metric-card">
            <div class="metric-label">5S</div>
            <div class="metric-value" id="val_5s">0%</div>
        </div>

    </div>

</div>

<div class="card">

    <div class="inputs-grid">

        <div class="group">

            <label>Nombre</label>

            <input
            type="text"
            id="f_nombre"
            oninput="aplicarFiltros()">

        </div>

        <div class="group">

            <label>Área</label>

            <select
            id="f_area"
            onchange="aplicarFiltros()"></select>

        </div>

        <div class="group">

            <label>Turno</label>

            <select
            id="f_turno"
            onchange="aplicarFiltros()">

                <option value="">Todos</option>
                <option value="1">1</option>
                <option value="2">2</option>

            </select>

        </div>

        <div class="group">

            <label>Ruta</label>

            <select
            id="f_ruta"
            onchange="aplicarFiltros()"></select>

        </div>

        <div class="group">

            <label>Estatus</label>

            <select
            id="f_estatus"
            onchange="aplicarFiltros()">

                <option value="">Todos</option>
                <option value="ACTIVO">ACTIVO</option>
                <option value="BAJA">BAJA</option>

            </select>

        </div>

    </div>

</div>

<div class="card">

<table>

<thead>

<tr>

    <th>Nombre</th>
    <th>Área</th>
    <th>Puesto</th>
    <th>Turno</th>
    <th>Ruta</th>
    <th>Estatus</th>

</tr>

</thead>

<tbody id="lista_empleados"></tbody>

</table>

</div>

</div>

<script>

let db_empleados = [];
let db_filtrados = [];
let chartRadar = null;

async function init(){

    await cargarFiltros();
    await listarEmpleados();

}

async function cargarFiltros(){

    const { data: areas } =
    await client
    .from('areas_generales')
    .select('*')
    .eq('activo', true)
    .order('nombre');

    const { data: rutas } =
    await client
    .from('rh_rutas')
    .select('*')
    .order('nombre');

    llenarSelect('f_area', areas, true);
    llenarSelect('f_ruta', rutas, true);

}

function llenarSelect(id,data,filtro=false){

    const s =
    document.getElementById(id);

    s.innerHTML =
    `<option value="">${filtro ? 'Todos' : 'Seleccione'}</option>`;

    data?.forEach(d => {

        s.innerHTML +=
        `<option value="${d.id}">${d.nombre}</option>`;

    });

}

async function listarEmpleados(){

    const { data, error } =
    await client
    .from('rh_empleados')
    .select(`
        *,
        areas_generales(nombre),
        rh_puestos(nombre),
        rh_rutas(nombre)
    `)
    .order('nombre_completo');

    if(error){

        console.error(error);
        alert(error.message);
        return;

    }

    db_empleados = data.map(e => ({

        ...e,

        area_txt:
        e.areas_generales?.nombre || '-',

        puesto_txt:
        e.rh_puestos?.nombre || '-',

        ruta_txt:
        e.rh_rutas?.nombre || '-'

    }));

    aplicarFiltros();

}

function aplicarFiltros(){

    const nombre =
    document.getElementById('f_nombre')
    .value
    .toLowerCase();

    const area =
    document.getElementById('f_area').value;

    const turno =
    document.getElementById('f_turno').value;

    const ruta =
    document.getElementById('f_ruta').value;

    const estatus =
    document.getElementById('f_estatus').value;

    db_filtrados =
    db_empleados.filter(e => {

        return (

            (!nombre ||
            e.nombre_completo?.toLowerCase().includes(nombre))

            &&

            (!area ||
            e.area_general_id == area)

            &&

            (!turno ||
            e.turno_id == turno)

            &&

            (!ruta ||
            e.ruta_id == ruta)

            &&

            (!estatus ||
            e.estatus == estatus)

        );

    });

    renderTabla();

}

function renderTabla(){

    document.getElementById('lista_empleados')
    .innerHTML = db_filtrados.map(e => `

        <tr onclick="cargarEmpleado('${e.id}')">

            <td>${e.nombre_completo || '-'}</td>

            <td>${e.area_txt}</td>

            <td>${e.puesto_txt}</td>

            <td>${e.turno_id || '-'}</td>

            <td>${e.ruta_txt}</td>

            <td>

                <span class="
                ${e.estatus == 'ACTIVO'
                    ? 'status-activo'
                    : 'status-baja'}">

                    ${e.estatus || '-'}

                </span>

            </td>

        </tr>

    `).join('');

}

async function cargarEmpleado(id){

    const emp =
    db_empleados.find(e => e.id == id);

    if(!emp) return;

    document.getElementById('dashboard')
    .style.display = 'grid';

    document.getElementById('view_nombre')
    .innerText =
    emp.nombre_completo || '-';

    document.getElementById('view_puesto_area')
    .innerText =
    `${emp.puesto_txt} | ${emp.area_txt}`;

    document.getElementById('view_nss')
    .innerText =
    emp.nss || '-';

    document.getElementById('view_ingreso')
    .innerText =
    emp.fecha_ingreso || '-';

    document.getElementById('view_direccion')
    .innerText =
    emp.direccion || '-';

    document.getElementById('view_antiguedad')
    .innerText =
    calcularAntiguedad(emp.fecha_ingreso);

    document.getElementById('view_foto')
    .src =
    emp.foto_url ||
    'https://cdn-icons-png.flaticon.com/512/149/149071.png';

    await calcularMetricas(emp);

}

async function calcularMetricas(emp){

    const { data: prod } =
    await client
    .from('inspeccion_produccion')
    .select('cant_inspeccionada,cant_defectuosa')
    .eq('operador', emp.nombre_completo);

    let totalIns = 0;
    let totalDef = 0;

    prod?.forEach(p => {

        totalIns += Number(p.cant_inspeccionada || 0);
        totalDef += Number(p.cant_defectuosa || 0);

    });

    const yieldVal =
    totalIns > 0
    ? Number(((1 - totalDef / totalIns) * 100).toFixed(1))
    : 0;

    const { data: asist } =
    await client
    .from('rh_asistencia')
    .select('estado')
    .eq('empleado_id', emp.id);

    const totalDias =
    asist?.length || 0;

    const asistencia =
    totalDias > 0
    ? Number(((asist.filter(a =>
        a.estado !== 'FALTA').length
        / totalDias) * 100).toFixed(1))
    : 0;

    const puntualidad =
    totalDias > 0
    ? Number(((asist.filter(a =>
        a.estado === 'ASISTENCIA').length
        / totalDias) * 100).toFixed(1))
    : 0;

    const { data: fives } =
    await client
    .from('rh_evaluaciones_5s')
    .select('puntuacion')
    .eq('empleado_id', emp.id);

    let promedio5s = 0;

    if(fives?.length > 0){

        promedio5s =
        Number((
            fives.reduce((a,b)=>
            a + Number(b.puntuacion || 0),0)
            / fives.length
        ).toFixed(1));

    }

    document.getElementById('val_yield')
    .innerText =
    yieldVal + '%';

    document.getElementById('val_asistencia')
    .innerText =
    asistencia + '%';

    document.getElementById('val_puntualidad')
    .innerText =
    puntualidad + '%';

    document.getElementById('val_5s')
    .innerText =
    promedio5s + '%';

    renderRadar(
        yieldVal,
        asistencia,
        promedio5s,
        puntualidad
    );

}

function renderRadar(y,a,s,p){

    const ctx =
    document.getElementById('chartRadar')
    .getContext('2d');

    if(chartRadar)
    chartRadar.destroy();

    chartRadar =
    new Chart(ctx, {

        type:'radar',

        data:{

            labels:[
                'Calidad',
                'Asistencia',
                '5S',
                'Puntualidad'
            ],

            datasets:[{

                data:[y,a,s,p],

                backgroundColor:
                'rgba(37,99,235,0.2)',

                borderColor:
                '#2563eb'

            }]
        },

        options:{

            scales:{
                r:{
                    suggestedMin:0,
                    suggestedMax:100
                }
            },

            plugins:{
                legend:{
                    display:false
                }
            }
        }
    });

}

function calcularAntiguedad(fecha){

    if(!fecha) return '-';

    const ini =
    new Date(fecha);

    const hoy =
    new Date();

    let anios =
    hoy.getFullYear()
    - ini.getFullYear();

    return anios + ' años';

}

function exportarExcel(){

    if(db_filtrados.length === 0){

        alert('No hay datos');
        return;

    }

    const ws =
    XLSX.utils.json_to_sheet(db_filtrados);

    const wb =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        'Personal'
    );

    XLSX.writeFile(
        wb,
        `Personal_Kraem_${new Date().toISOString().split('T')[0]}.xlsx`
    );

}

document.addEventListener(
'DOMContentLoaded',
init
);

</script>

</body>
</html>
