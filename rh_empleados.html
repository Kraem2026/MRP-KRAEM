<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAEM | Gestión de Personal 360</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
    --primary:#0f172a;
    --accent:#2563eb;
    --bg:#f8fafc;
    --text:#1e293b;
    --border:#e2e8f0;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
}

.container{
    max-width:1600px;
    margin:auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    border:1px solid var(--border);
    margin-bottom:20px;
}

.nav-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.btn-add{
    background:var(--accent);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.inputs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

input,select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#f1f5f9;
}

tr:hover{
    background:#f8fafc;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    z-index:999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
}

.modal-content{
    background:white;
    width:95%;
    max-width:900px;
    margin:2% auto;
    padding:25px;
    border-radius:15px;
    max-height:90vh;
    overflow:auto;
}
</style>
</head>

<body>

<div class="container">

    <div class="nav-header">
        <h2>Gestión de Personal KRAEM</h2>

        <button class="btn-add" onclick="abrirModal()">
            NUEVO EMPLEADO
        </button>
    </div>

    <div class="card">

        <div class="inputs-grid">

            <div class="group">
                <label>Buscar</label>
                <input type="text" id="f_nombre" oninput="aplicarFiltros()">
            </div>

            <div class="group">
                <label>Área</label>
                <select id="f_area" onchange="aplicarFiltros()"></select>
            </div>

            <div class="group">
                <label>Turno</label>
                <select id="f_turno" onchange="aplicarFiltros()">
                    <option value="">Todos</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="group">
                <label>Estatus</label>
                <select id="f_estatus" onchange="aplicarFiltros()">
                    <option value="">Todos</option>
                    <option value="ACTIVO">ACTIVO</option>
                    <option value="BAJA">BAJA</option>
                </select>
            </div>

        </div>

    </div>

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Área</th>
                    <th>Puesto</th>
                    <th>Turno</th>
                    <th>Estatus</th>
                </tr>
            </thead>

            <tbody id="lista_empleados"></tbody>

        </table>

    </div>

</div>

<div class="modal" id="modalRegistro">

    <div class="modal-content">

        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h3>Empleado</h3>

            <button onclick="cerrarModal()" style="font-size:30px;border:none;background:none;cursor:pointer;">
                &times;
            </button>
        </div>

        <input type="hidden" id="edit_id">

        <div class="inputs-grid">

            <div class="group">
                <label>Nombre</label>
                <input type="text" id="nombre">
            </div>

            <div class="group">
                <label>NSS</label>
                <input type="text" id="nss">
            </div>

            <div class="group">
                <label>Área</label>
                <select id="sel_area"></select>
            </div>

            <div class="group">
                <label>Puesto</label>
                <select id="sel_puesto"></select>
            </div>

            <div class="group">
                <label>Turno</label>
                <select id="sel_turno">
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="group">
                <label>Ruta</label>
                <select id="sel_ruta"></select>
            </div>

            <div class="group">
                <label>Fecha ingreso</label>
                <input type="date" id="fecha_ingreso">
            </div>

            <div class="group">
                <label>Estatus</label>
                <select id="sel_estatus">
                    <option value="ACTIVO">ACTIVO</option>
                    <option value="BAJA">BAJA</option>
                </select>
            </div>

        </div>

        <div style="margin-top:20px;display:flex;gap:10px;">

            <button class="btn-add" onclick="guardarEmpleado()">
                GUARDAR
            </button>

            <button onclick="cerrarModal()">
                CANCELAR
            </button>

        </div>

    </div>

</div>

<script>

let db_empleados = [];
let db_filtrados = [];

async function init(){

    console.log("INICIANDO...");

    // ===== AREAS GENERALES =====
    const { data: areas, error: errAreas } = await client
    .from('areas_generales')
    .select('*')
    .order('nombre');

    console.log("AREAS:", areas);
    console.log("ERROR AREAS:", errAreas);

    // ===== PUESTOS =====
    const { data: puestos, error: errPuestos } = await client
    .from('rh_puestos')
    .select('*')
    .order('nombre');

    console.log("PUESTOS:", puestos);
    console.log("ERROR PUESTOS:", errPuestos);

    // ===== RUTAS =====
    const { data: rutas, error: errRutas } = await client
    .from('rh_rutas')
    .select('*')
    .order('nombre');

    console.log("RUTAS:", rutas);
    console.log("ERROR RUTAS:", errRutas);

    llenarSelect("sel_area", areas);
    llenarSelect("f_area", areas, true);

    llenarSelect("sel_puesto", puestos);
    llenarSelect("sel_ruta", rutas);

    await listarEmpleados();
}

function llenarSelect(id, datos, filtro = false){

    const select = document.getElementById(id);

    if(!select) return;

    select.innerHTML = filtro
    ? '<option value="">Todas</option>'
    : '<option value="">Seleccione...</option>';

    datos?.forEach(item => {

        select.innerHTML += `
            <option value="${item.id}">
                ${item.nombre}
            </option>
        `;
    });
}

async function listarEmpleados(){

    console.log("LISTANDO EMPLEADOS");

    const { data, error } = await client
    .from('rh_empleados')
    .select(`
        *,
        areas_generales(nombre),
        rh_puestos(nombre),
        rh_rutas(nombre)
    `)
    .order('nombre_completo');

    console.log("EMPLEADOS:", data);
    console.log("ERROR EMPLEADOS:", error);

    if(error){
        alert(error.message);
        return;
    }

    db_empleados = data.map(e => ({
        ...e,
        area_txt: e.areas_generales?.nombre || "-",
        puesto_txt: e.rh_puestos?.nombre || "-",
        ruta_txt: e.rh_rutas?.nombre || "-"
    }));

    aplicarFiltros();
}

function aplicarFiltros(){

    const nombre = document.getElementById('f_nombre').value.toLowerCase();
    const area = document.getElementById('f_area').value;
    const turno = document.getElementById('f_turno').value;
    const estatus = document.getElementById('f_estatus').value;

    db_filtrados = db_empleados.filter(e =>

        (!nombre || e.nombre_completo?.toLowerCase().includes(nombre))
        &&
        (!area || e.area_id == area)
        &&
        (!turno || e.turno_id == turno)
        &&
        (!estatus || e.estatus == estatus)

    );

    document.getElementById('lista_empleados').innerHTML = db_filtrados.map(e => `

        <tr onclick="editarEmpleado('${e.id}')">

            <td>${e.nombre_completo || ''}</td>
            <td>${e.area_txt}</td>
            <td>${e.puesto_txt}</td>
            <td>${e.turno_id || ''}</td>
            <td>${e.estatus || ''}</td>

        </tr>

    `).join('');
}

async function guardarEmpleado(){

    const id = document.getElementById('edit_id').value;

    const obj = {

        nombre_completo: document.getElementById('nombre').value,
        nss: document.getElementById('nss').value,

        area_id: document.getElementById('sel_area').value || null,

        puesto_id: document.getElementById('sel_puesto').value || null,

        turno_id: document.getElementById('sel_turno').value || null,

        ruta_id: document.getElementById('sel_ruta').value || null,

        fecha_ingreso: document.getElementById('fecha_ingreso').value || null,

        estatus: document.getElementById('sel_estatus').value
    };

    let res;

    if(id){

        res = await client
        .from('rh_empleados')
        .update(obj)
        .eq('id', id);

    }else{

        res = await client
        .from('rh_empleados')
        .insert([obj]);
    }

    if(res.error){

        alert(res.error.message);
        return;
    }

    alert("Guardado correctamente");

    cerrarModal();

    await listarEmpleados();
}

function editarEmpleado(id){

    const emp = db_empleados.find(x => x.id == id);

    if(!emp) return;

    document.getElementById('edit_id').value = emp.id;
    document.getElementById('nombre').value = emp.nombre_completo || '';
    document.getElementById('nss').value = emp.nss || '';
    document.getElementById('sel_area').value = emp.area_id || '';
    document.getElementById('sel_puesto').value = emp.puesto_id || '';
    document.getElementById('sel_turno').value = emp.turno_id || '1';
    document.getElementById('sel_ruta').value = emp.ruta_id || '';
    document.getElementById('fecha_ingreso').value = emp.fecha_ingreso || '';
    document.getElementById('sel_estatus').value = emp.estatus || 'ACTIVO';

    abrirModal();
}

function abrirModal(){

    document.getElementById('modalRegistro').style.display = 'block';
}

function cerrarModal(){

    document.getElementById('modalRegistro').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', init);

</script>

</body>
</html>
