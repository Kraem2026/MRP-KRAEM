```html

<body>

<div class="container">

    <div class="nav-header">
        <div style="display:flex; gap:15px; align-items:center;">
            <a href="dashboard.html" class="btn-nav">
                <i class="fas fa-arrow-left"></i>
            </a>

            <h2 style="margin:0;">
                Gestión de Personal Kraem
            </h2>
        </div>

        <button class="btn-add" onclick="abrirModal()">
            <i class="fas fa-plus"></i>
            NUEVO REGISTRO
        </button>
    </div>

    <div class="card">

        <div class="inputs-grid">

            <div class="group">
                <label>Nombre</label>
                <input type="text" id="f_nombre" placeholder="Buscar..." oninput="aplicarFiltros()">
            </div>

            <div class="group">
                <label>Área</label>

                <!-- ESTE YA USA AREAS_GENERALES -->
                <select id="f_area" onchange="aplicarFiltros()"></select>
            </div>

            <div class="group">
                <label>Turno</label>

                <select id="f_turno" onchange="aplicarFiltros()">
                    <option value="">Todos</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="group">
                <label>Estatus</label>

                <select id="f_estatus" onchange="aplicarFiltros()">
                    <option value="">Todos</option>
                    <option value="ACTIVO">ACTIVO</option>
                    <option value="BAJA">BAJA</option>
                </select>
            </div>

        </div>

    </div>

    <div class="table-card">

        <table>

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Área</th>
                    <th>Puesto</th>
                    <th>Turno</th>
                    <th>Estatus</th>
                </tr>
            </thead>

            <tbody id="lista_empleados"></tbody>

        </table>

    </div>

</div>

<div id="modalRegistro" class="modal">

    <div class="modal-content">

        <h3>Información del Personal</h3>

        <input type="hidden" id="edit_id">

        <div class="inputs-grid">

            <div class="group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre">
            </div>

            <div class="group">

                <label>Área</label>

                <!-- ESTE YA USA AREAS_GENERALES -->
                <select id="sel_area"></select>

            </div>

            <div class="group">
                <label>Puesto</label>
                <select id="sel_puesto"></select>
            </div>

            <div class="group">
                <label>Turno</label>

                <select id="sel_turno">
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="group">
                <label>Estatus</label>

                <select id="sel_estatus">
                    <option value="ACTIVO">ACTIVO</option>
                    <option value="BAJA">BAJA</option>
                </select>
            </div>

        </div>

        <div style="margin-top:20px;">
            <button class="btn-add" onclick="guardarEmpleado()">
                GUARDAR
            </button>
        </div>

    </div>

</div>

<script>

let db_empleados = [];
let db_filtrados = [];

async function init() {

    // ======== CAMBIO AQUI ========
    const { data: areas } = await client
        .from('areas_generales')
        .select('*')
        .order('nombre');
    // =============================

    const { data: puestos } = await client
        .from('rh_puestos')
        .select('*')
        .order('nombre');

    const fill = (id, data, esFiltro = false) => {

        const s = document.getElementById(id);

        if(!s) return;

        s.innerHTML = `
            <option value="">
                ${esFiltro ? 'Todas' : 'Seleccione...'}
            </option>
        `;

        data?.forEach(d => {
            s.innerHTML += `
                <option value="${d.id}">
                    ${d.nombre}
                </option>
            `;
        });
    };

    fill('sel_area', areas);
    fill('f_area', areas, true);

    fill('sel_puesto', puestos);

    await listarEmpleados();
}

async function listarEmpleados() {

    // ======== CAMBIO AQUI ========
    const { data, error } = await client
        .from('rh_empleados')
        .select(`
            *,
            areas_generales!left(nombre),
            rh_puestos!left(nombre)
        `)
        .order('nombre_completo');
    // =============================

    if(error){
        console.error(error);
        return;
    }

    db_empleados = data.map(e => ({
        ...e,

        // ======== CAMBIO AQUI ========
        area_txt: e.areas_generales?.nombre || '-',
        // =============================

        puesto_txt: e.rh_puestos?.nombre || '-'
    }));

    aplicarFiltros();
}

function aplicarFiltros(){

    const nombre = document
        .getElementById('f_nombre')
        .value
        .toLowerCase();

    const area = document.getElementById('f_area').value;
    const turno = document.getElementById('f_turno').value;
    const estatus = document.getElementById('f_estatus').value;

    db_filtrados = db_empleados.filter(e =>

        (!nombre || e.nombre_completo.toLowerCase().includes(nombre)) &&
        (!area || e.area_id == area) &&
        (!turno || e.turno_id == turno) &&
        (!estatus || e.estatus == estatus)
    );

    document.getElementById('lista_empleados').innerHTML =
        db_filtrados.map(e => `
            <tr>

                <td>${e.nombre_completo}</td>

                <td>${e.area_txt}</td>

                <td>${e.puesto_txt}</td>

                <td>${e.turno_id || '-'}</td>

                <td>
                    <span class="status-badge ${
                        e.estatus === 'ACTIVO'
                        ? 'status-activo'
                        : 'status-baja'
                    }">
                        ${e.estatus}
                    </span>
                </td>

            </tr>
        `).join('');
}

function abrirModal(){
    document.getElementById('modalRegistro').style.display = 'block';
}

async function guardarEmpleado(){

    const id = document.getElementById('edit_id').value;

    const obj = {

        nombre_completo:
            document.getElementById('nombre').value,

        area_id:
            document.getElementById('sel_area').value || null,

        puesto_id:
            document.getElementById('sel_puesto').value || null,

        turno_id:
            document.getElementById('sel_turno').value || null,

        estatus:
            document.getElementById('sel_estatus').value
    };

    let error;

    if(id){

        ({ error } = await client
            .from('rh_empleados')
            .update(obj)
            .eq('id', id));

    } else {

        ({ error } = await client
            .from('rh_empleados')
            .insert([obj]));
    }

    if(error){
        alert(error.message);
        return;
    }

    alert('Guardado');

    document.getElementById('modalRegistro').style.display = 'none';

    await listarEmpleados();
}

document.addEventListener('DOMContentLoaded', init);

</script>

</body>
</html>
