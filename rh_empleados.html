<script>
    let db_empleados = [];
    let db_filtrados = [];
    let chartRadar;
    let currentEmpId = null;

    function obtenerDiasLey(anios) {
        if (anios < 1) return 0;
        if (anios === 1) return 12;
        if (anios === 2) return 14;
        if (anios === 3) return 16;
        if (anios === 4) return 18;
        if (anios === 5) return 20;
        if (anios >= 6 && anios <= 10) return 22;
        if (anios >= 11 && anios <= 15) return 24;
        if (anios >= 16 && anios <= 20) return 26;
        if (anios >= 21 && anios <= 25) return 28;
        if (anios >= 26 && anios <= 30) return 30;
        return 32;
    }

    async function init() {

        // ======================================================
        // AREAS GENERALES DINAMICAS
        // ======================================================

        const { data: areasGenerales } = await client
        .from('areas_generales')
        .select('*')
        .eq('active', true)
        .order('nombre');

        // ======================================================
        // PUESTOS
        // ======================================================

        const { data: puestos } = await client
        .from('rh_puestos')
        .select('*')
        .order('nombre');

        // ======================================================
        // RUTAS
        // ======================================================

        const { data: rutas } = await client
        .from('rh_rutas')
        .select('*')
        .order('nombre');

        // ======================================================
        // FUNCION PARA LLENAR SELECTS
        // ======================================================

        const fill = (id, data, esFiltro = false) => {

            const s = document.getElementById(id);

            if(!s) return;

            s.innerHTML = `
                <option value="">
                    ${esFiltro ? 'Todas' : 'Seleccione...'}
                </option>
            `;

            data?.forEach(d => {

                s.innerHTML += `
                    <option value="${d.id}">
                        ${d.nombre}
                    </option>
                `;

            });

        };

        // ======================================================
        // AREAS GENERALES
        // ======================================================

        fill('sel_area', areasGenerales);
        fill('f_area', areasGenerales, true);

        // ======================================================
        // PUESTOS
        // ======================================================

        fill('sel_puesto', puestos);

        // ======================================================
        // RUTAS
        // ======================================================

        fill('sel_ruta', rutas);
        fill('f_ruta', rutas, true);

        // ======================================================
        // FECHAS
        // ======================================================

        const d = new Date();

        document.getElementById('f_desde').value =
            new Date(
                d.getFullYear(),
                d.getMonth(),
                1
            ).toISOString().split('T')[0];

        document.getElementById('f_hasta').value =
            new Date(
                d.getFullYear(),
                d.getMonth() + 1,
                0
            ).toISOString().split('T')[0];

        await listarEmpleados();

    }

    async function listarEmpleados() {

        // ======================================================
        // EMPLEADOS + AREAS GENERALES
        // ======================================================

        const { data, error } = await client

        .from('rh_empleados')

        .select(`
            *,
            areas_generales!left(nombre),
            rh_puestos!left(nombre),
            rh_rutas!left(nombre)
        `)

        .order('nombre_completo');

        if (error) {

            console.error(error);

            return;

        }

        db_empleados = data.map(e => ({

            ...e,

            // ==================================================
            // AREA GENERAL
            // ==================================================

            area_txt:
                e.areas_generales?.nombre || '-',

            // ==================================================
            // PUESTO
            // ==================================================

            puesto_txt:
                e.rh_puestos?.nombre || '-',

            // ==================================================
            // RUTA
            // ==================================================

            ruta_txt:
                e.rh_rutas?.nombre || '-',

            antiguedad_txt:
                calcularAntiguedadExacta(e.fecha_ingreso)

        }));

        aplicarFiltros();

    }

    function aplicarFiltros() {

        const n =
            document.getElementById('f_nombre')
            .value
            .toLowerCase();

        const a =
            document.getElementById('f_area').value;

        const t =
            document.getElementById('f_turno').value;

        const r =
            document.getElementById('f_ruta').value;

        const s =
            document.getElementById('f_estatus').value;

        db_filtrados = db_empleados.filter(e =>

            (!n ||
                e.nombre_completo
                .toLowerCase()
                .includes(n))

            &&

            (!a ||
                e.area_general_id == a)

            &&

            (!t ||
                e.turno_id == t)

            &&

            (!r ||
                e.ruta_id == r)

            &&

            (!s ||
                e.estatus == s)

        );

        document.getElementById('lista_empleados').innerHTML =

            db_filtrados.map(e => `

                <tr onclick="cargarAnalisis('${e.id}')">

                    <td>
                        <b>${e.nombre_completo}</b>
                    </td>

                    <td>
                        ${e.area_txt}
                    </td>

                    <td>
                        ${e.puesto_txt}
                    </td>

                    <td>
                        ${e.antiguedad_txt}
                    </td>

                    <td>
                        Turno ${e.turno_id || '-'}
                    </td>

                    <td>
                        ${e.ruta_txt}
                    </td>

                    <td>

                        <span class="status-badge
                            ${e.estatus === 'ACTIVO'
                                ? 'status-activo'
                                : 'status-baja'}">

                            ${e.estatus || 'N/A'}

                        </span>

                    </td>

                </tr>

            `).join('');

    }

    async function cargarAnalisis(id) {

        const emp =
            db_empleados.find(e => e.id == id);

        currentEmpId = id;

        document.getElementById('dash_analisis')
            .style.display = 'grid';

        document.getElementById('view_foto').src =
            emp.foto_url ||
            "https://cdn-icons-png.flaticon.com/512/149/149071.png";

        document.getElementById('view_nombre').innerText =
            emp.nombre_completo;

        document.getElementById('view_puesto_area').innerText =
            `${emp.puesto_txt} | ${emp.area_txt}`;

        document.getElementById('view_nss').innerText =
            emp.nss || '--';

        document.getElementById('view_anti').innerText =
            emp.antiguedad_txt;

        document.getElementById('view_talla').innerText =
            emp.talla_playera || '--';

        document.getElementById('view_ingreso').innerText =
            emp.fecha_ingreso || '--';

        document.getElementById('view_direccion').innerText =
            emp.direccion || '--';

        const fIngreso = new Date(emp.fecha_ingreso);

        const fHoy = new Date();

        let anios =
            fHoy.getFullYear() -
            fIngreso.getFullYear();

        if (
            fHoy <
            new Date(
                fHoy.getFullYear(),
                fIngreso.getMonth(),
                fIngreso.getDate()
            )
        ) anios--;

        const diasTotalesDerecho =
            obtenerDiasLey(anios);

        const { data: sol } =
        await client

        .from('rh_solicitudes')

        .select('dias_solicitados')

        .eq('empleado_id', id)

        .eq('tipo', 'VACACIONES')

        .eq('estatus', 'APROBADO');

        const diasTomados =
            sol?.reduce(
                (acc, curr) =>
                    acc + (curr.dias_solicitados || 0),
                0
            ) || 0;

        const saldoVacaciones =
            diasTotalesDerecho - diasTomados;

        document.getElementById('view_dias_disponibles').innerText =
            saldoVacaciones > 0
                ? saldoVacaciones
                : 0;

        const fDesde =
            document.getElementById('f_desde').value;

        const fHasta =
            document.getElementById('f_hasta').value;

        document.getElementById('rango_texto').innerText =
            `${fDesde} a ${fHasta}`;

        const { data: prod } =
        await client

        .from('inspeccion_produccion')

        .select(`
            cant_inspeccionada,
            cant_defectuosa
        `)

        .eq('operador', emp.nombre_completo)

        .gte('fecha', fDesde)

        .lte('fecha', fHasta);

        let ti = 0;
        let td = 0;

        prod?.forEach(p => {

            ti += p.cant_inspeccionada;
            td += p.cant_defectuosa;

        });

        const yieldVal =
            ti > 0
                ? parseFloat(
                    (
                        (1 - (td/ti)) * 100
                    ).toFixed(1)
                )
                : 100;

        const { data: asistData } =
        await client

        .from('rh_asistencia')

        .select('estado')

        .eq('empleado_id', id)

        .gte('fecha', fDesde)

        .lte('fecha', fHasta);

        const totalDias =
            asistData?.length || 0;

        const asistPct =
            totalDias > 0
                ? parseFloat(
                    (
                        (
                            asistData.filter(
                                a => a.estado !== 'FALTA'
                            ).length / totalDias
                        ) * 100
                    ).toFixed(1)
                )
                : 0;

        const puntPct =
            totalDias > 0
                ? parseFloat(
                    (
                        (
                            asistData.filter(
                                a => a.estado === 'ASISTENCIA'
                            ).length / totalDias
                        ) * 100
                    ).toFixed(1)
                )
                : 0;

        const { data: fives } =
        await client

        .from('rh_evaluaciones_5s')

        .select(`
            puntuacion,
            created_at
        `)

        .eq('empleado_id', id)

        .gte('created_at', fDesde)

        .lte('created_at', fHasta);

        let score5s = 0;

        if(fives && fives.length > 0){

            const total =
                fives.reduce(
                    (acc, item) =>
                        acc + (item.puntuacion || 0),
                    0
                );

            score5s =
                parseFloat(
                    (total / fives.length)
                    .toFixed(1)
                );

        }

        const totalAuditorias =
            fives?.length || 0;

        document.getElementById('val_5s').innerText =
            score5s + '% (' + totalAuditorias + ')';

        document.getElementById('val_yield').innerText =
            yieldVal + '%';

        document.getElementById('val_asistencia').innerText =
            asistPct + '%';

        document.getElementById('val_puntualidad').innerText =
            puntPct + '%';

        document.getElementById('val_versatilidad').innerText =
            "80%";

        renderRadar(
            yieldVal,
            asistPct,
            score5s,
            80,
            puntPct
        );

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    }

    function renderRadar(y, a, s, v, p) {

        const ctx =
            document.getElementById('chartRadar')
            .getContext('2d');

        if(chartRadar)
            chartRadar.destroy();

        chartRadar = new Chart(ctx, {

            type: 'radar',

            data: {

                labels: [
                    'Calidad',
                    'Asistencia',
                    '5\'S',
                    'Versatilidad',
                    'Puntualidad'
                ],

                datasets: [{

                    data: [y, a, s, v, p],

                    backgroundColor:
                        'rgba(37, 99, 235, 0.2)',

                    borderColor:
                        '#2563eb',

                    pointBackgroundColor:
                        '#2563eb'

                }]

            },

            options: {

                scales: {

                    r: {

                        suggestedMin: 0,
                        suggestedMax: 100

                    }

                },

                plugins: {

                    legend: {

                        display: false

                    }

                }

            }

        });

    }

    function previewImage(event) {

        const reader =
            new FileReader();

        const file =
            event.target.files[0];

        if(!file) return;

        reader.onload = () => {

            const output =
                document.getElementById('img_preview');

            output.src =
                reader.result;

            output.style.display = 'block';

            document.getElementById('modal_icon_user')
                .style.display = 'none';

        };

        reader.readAsDataURL(file);

    }

    async function subirFoto(archivo, id) {

        try {

            const ext =
                archivo.name.split('.').pop();

            const fileName =
                `foto_${id || 'new'}_${Date.now()}.${ext}`;

            const { data, error } =
            await client.storage

            .from('empleados')

            .upload(fileName, archivo);

            if(error) throw error;

            const { data: url } =
                client.storage
                .from('empleados')
                .getPublicUrl(fileName);

            return url.publicUrl;

        } catch (e) {

            console.error(e);

            return null;

        }

    }

    async function guardarEmpleado() {

        const id =
            document.getElementById('edit_id').value;

        const fotoInput =
            document.getElementById('input_foto');

        let fotoUrl = null;

        if(fotoInput.files[0]) {

            fotoUrl =
                await subirFoto(
                    fotoInput.files[0],
                    id
                );

            if(!fotoUrl)
                return alert("Error al subir imagen.");

        }

        // ======================================================
        // OBJETO EMPLEADO
        // ======================================================

        const obj = {

            nombre_completo:
                document.getElementById('nombre').value,

            nss:
                document.getElementById('nss').value,

            // ==================================================
            // AREA GENERAL
            // ==================================================

            area_general_id:
                document.getElementById('sel_area').value || null,

            puesto_id:
                document.getElementById('sel_puesto').value || null,

            fecha_ingreso:
                document.getElementById('fecha_ingreso').value || null,

            turno_id:
                document.getElementById('sel_turno').value || null,

            ruta_id:
                document.getElementById('sel_ruta').value || null,

            tipo_sangre:
                document.getElementById('tipo_sangre').value,

            talla_playera:
                document.getElementById('sel_talla').value,

            direccion:
                document.getElementById('direccion').value,

            telefono_personal:
                document.getElementById('telefono_personal').value,

            emergencia_nombre:
                document.getElementById('emergencia_nombre').value,

            emergencia_parentesco:
                document.getElementById('emergencia_parentesco').value,

            emergencia_tel:
                document.getElementById('emergencia_tel').value,

            alergias:
                document.getElementById('alergias').value,

            estatus:
                document.getElementById('sel_estatus').value

        };

        if(fotoUrl)
            obj.foto_url = fotoUrl;

        const { error } = id

            ? await client
                .from('rh_empleados')
                .update(obj)
                .eq('id', id)

            : await client
                .from('rh_empleados')
                .insert([obj]);

        if(!error) {

            alert("¡Guardado!");

            cerrarModal();

            await listarEmpleados();

        }
        else {

            alert("Error: " + error.message);

        }

    }

    function editarActual() {

        if(!currentEmpId) return;

        const emp =
            db_empleados.find(
                e => e.id == currentEmpId
            );

        document.getElementById('edit_id').value =
            emp.id;

        document.getElementById('nombre').value =
            emp.nombre_completo || "";

        document.getElementById('nss').value =
            emp.nss || "";

        // ======================================================
        // AREA GENERAL
        // ======================================================

        document.getElementById('sel_area').value =
            emp.area_general_id || "";

        document.getElementById('sel_puesto').value =
            emp.puesto_id || "";

        document.getElementById('fecha_ingreso').value =
            emp.fecha_ingreso || "";

        document.getElementById('sel_turno').value =
            emp.turno_id || "1";

        document.getElementById('sel_ruta').value =
            emp.ruta_id || "";

        document.getElementById('tipo_sangre').value =
            emp.tipo_sangre || "";

        document.getElementById('sel_talla').value =
            emp.talla_playera || "";

        document.getElementById('direccion').value =
            emp.direccion || "";

        document.getElementById('telefono_personal').value =
            emp.telefono_personal || "";

        document.getElementById('emergencia_nombre').value =
            emp.emergencia_nombre || "";

        document.getElementById('emergencia_parentesco').value =
            emp.emergencia_parentesco || "";

        document.getElementById('emergencia_tel').value =
            emp.emergencia_tel || "";

        document.getElementById('alergias').value =
            emp.alergias || "";

        document.getElementById('sel_estatus').value =
            emp.estatus || "ACTIVO";

        if(emp.foto_url) {

            document.getElementById('img_preview').src =
                emp.foto_url;

            document.getElementById('img_preview').style.display =
                'block';

            document.getElementById('modal_icon_user').style.display =
                'none';

        } else {

            document.getElementById('img_preview').style.display =
                'none';

            document.getElementById('modal_icon_user').style.display =
                'block';

        }

        document.getElementById('modalRegistro').style.display =
            'block';

    }

    function abrirModal() {

        document.getElementById('edit_id').value = "";

        document.querySelectorAll(
            '#modalRegistro input, #modalRegistro select, #modalRegistro textarea'
        ).forEach(i => i.value = "");

        document.getElementById('img_preview').style.display =
            'none';

        document.getElementById('modal_icon_user').style.display =
            'block';

        document.getElementById('modalRegistro').style.display =
            'block';

    }

    function cerrarModal() {

        document.getElementById('modalRegistro').style.display =
            'none';

    }

    function calcularAntiguedadExacta(f) {

        if(!f) return "-";

        const ini =
            new Date(f);

        const hoy =
            new Date();

        let anios =
            hoy.getFullYear() -
            ini.getFullYear();

        let meses =
            hoy.getMonth() -
            ini.getMonth();

        if (meses < 0) {

            anios--;
            meses += 12;

        }

        return anios > 0
            ? `${anios} años, ${meses} m`
            : `${meses} meses`;

    }

    async function exportarExcel() {

        if(db_filtrados.length === 0)
            return alert("No hay datos");

        const ws =
            XLSX.utils.json_to_sheet(db_filtrados);

        const wb =
            XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(
            wb,
            ws,
            "Personal"
        );

        XLSX.writeFile(
            wb,
            `Personal_Kraem_${
                new Date()
                .toISOString()
                .split('T')[0]
            }.xlsx`
        );

    }

    function actualizarTodo() {

        if(currentEmpId)
            cargarAnalisis(currentEmpId);

    }

    document.addEventListener(
        'DOMContentLoaded',
        init
    );
</script>
