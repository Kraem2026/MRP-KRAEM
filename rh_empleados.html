<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal - RH</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-slate-800 text-white shadow-md p-4 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-users text-indigo-400"></i> Gestión de Empleados
            </h1>
            <a href="rh_evaluacion_5s.html" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm transition">
                <i class="fa-solid fa-clipboard-check mr-1"></i> Ir a Auditoría 5S
            </a>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Formulario Alta / Edición de Empleados -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 h-fit">
                <h2 id="titulo_form" class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-user-plus text-indigo-600 mr-2"></i> <span id="txt_modo">Registrar Empleado</span></span>
                    <button type="button" onclick="limpiarFormulario()" id="btn_cancelar" class="hidden text-xs text-red-500 hover:underline">Cancelar edición</button>
                </h2>

                <form id="form_empleado" onsubmit="guardarEmpleado(event)" class="space-y-4">
                    <input type="hidden" id="emp_id" value="">

                    <!-- Nombre Completo -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nombre Completo *</label>
                        <input type="text" id="nombre_completo" required class="w-full border-gray-300 rounded-md border p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ej. Juan Pérez López">
                    </div>

                    <!-- Área General -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Área General *</label>
                        <select id="sel_area" required class="w-full border-gray-300 rounded-md border p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">Cargando áreas...</option>
                        </select>
                    </div>

                    <!-- Turno -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Turno Asignado *</label>
                        <select id="sel_turno" required class="w-full border-gray-300 rounded-md border p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">Cargando turnos...</option>
                        </select>
                    </div>

                    <!-- Puesto / Cargo -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Puesto / Cargo</label>
                        <input type="text" id="puesto" class="w-full border-gray-300 rounded-md border p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ej. Operador de Inyección">
                    </div>

                    <!-- Estatus -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Estatus *</label>
                        <select id="sel_estatus" required class="w-full border-gray-300 rounded-md border p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                    <!-- Botones -->
                    <div class="pt-2 flex gap-2">
                        <button type="submit" id="btn_guardar_emp" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md shadow-sm text-sm transition">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> Guardar Empleado
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabla de Empleados -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-2 border-b pb-3">
                    <h2 class="text-lg font-semibold text-gray-700">
                        <i class="fa-solid fa-list text-slate-600 mr-2"></i> Directorio de Personal
                    </h2>
                    <input type="text" id="txt_buscar" onkeyup="filtrarTabla()" placeholder="Buscar por nombre..." class="border border-gray-300 rounded-md px-3 py-1 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none w-full sm:w-64">
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-600 border-collapse">
                        <thead class="bg-slate-100 text-gray-700 uppercase text-xs">
                            <tr>
                                <th class="p-3 border-b">Empleado</th>
                                <th class="p-3 border-b">Área</th>
                                <th class="p-3 border-b">Turno</th>
                                <th class="p-3 border-b">Estatus</th>
                                <th class="p-3 border-b text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla_empleados" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="p-4 text-center text-gray-400">Cargando catálogo de empleados...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
        const SUPABASE_KEY = 'tu-anon-key';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let listaEmpleados = [];
        let mapaAreas = {};
        let mapaTurnos = {};

        document.addEventListener('DOMContentLoaded', async () => {
            await cargarCatalogos();
            await cargarEmpleados();
        });

        async function cargarCatalogos() {
            try {
                // Cargar Áreas
                const { data: areas } = await _supabase.from('areas_generales').select('*').order('nombre');
                if (areas) {
                    const selArea = document.getElementById('sel_area');
                    selArea.innerHTML = '<option value="">Seleccione Área...</option>' + 
                        areas.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');
                    
                    areas.forEach(a => mapaAreas[a.id] = a.nombre);
                }

                // Cargar Turnos
                const { data: turnos } = await _supabase.from('rh_turnos').select('*').order('nombre');
                if (turnos) {
                    const selTurno = document.getElementById('sel_turno');
                    selTurno.innerHTML = '<option value="">Seleccione Turno...</option>' + 
                        turnos.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');

                    turnos.forEach(t => mapaTurnos[t.id] = t.nombre);
                }
            } catch (e) {
                console.error("Error al cargar catálogos:", e);
            }
        }

        async function cargarEmpleados() {
            try {
                const { data: emps, error } = await _supabase.from('rh_empleados').select('*').order('nombre_completo');
                if (error) throw error;

                listaEmpleados = emps || [];
                renderTabla(listaEmpleados);
            } catch (err) {
                console.error("Error al cargar empleados:", err);
            }
        }

        function renderTabla(datos) {
            const tbody = document.getElementById('tabla_empleados');
            if (datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">No hay empleados registrados.</td></tr>';
                return;
            }

            tbody.innerHTML = datos.map(e => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 font-medium text-gray-900">${e.nombre_completo} <span class="block text-xs font-normal text-gray-400">${e.puesto || ''}</span></td>
                    <td class="p-3">${mapaAreas[e.area_general_id] || 'N/A'}</td>
                    <td class="p-3"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs border border-indigo-200">${mapaTurnos[e.turno_id] || 'Sin Turno'}</span></td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${e.estatus === 'activo' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">
                            ${e.estatus}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="editarActual('${e.id}')" class="text-indigo-600 hover:text-indigo-900 mx-1 p-1" title="Editar">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filtrarTabla() {
            const query = document.getElementById('txt_buscar').value.toLowerCase();
            const filtrados = listaEmpleados.filter(e => e.nombre_completo.toLowerCase().includes(query));
            renderTabla(filtrados);
        }

        // CORRECCIÓN CLAVE EN EDITAR: Asignación directa e incondicional de turno_id
        function editarActual(id) {
            const emp = listaEmpleados.find(e => String(e.id) === String(id));
            if (!emp) return;

            document.getElementById('emp_id').value = emp.id;
            document.getElementById('nombre_completo').value = emp.nombre_completo || '';
            document.getElementById('sel_area').value = emp.area_general_id || '';
            
            // CORRECCIÓN: Asignar directamente el ID del turno guardado sin borrar ni transformar a '1' / '2'
            document.getElementById('sel_turno').value = emp.turno_id || '';
            
            document.getElementById('puesto').value = emp.puesto || '';
            document.getElementById('sel_estatus').value = emp.estatus || 'activo';

            document.getElementById('txt_modo').textContent = 'Editar Empleado';
            document.getElementById('btn_cancelar').classList.remove('hidden');
        }

        function limpiarFormulario() {
            document.getElementById('emp_id').value = '';
            document.getElementById('form_empleado').reset();
            document.getElementById('txt_modo').textContent = 'Registrar Empleado';
            document.getElementById('btn_cancelar').classList.add('hidden');
        }

        async function guardarEmpleado(e) {
            e.preventDefault();

            const empId = document.getElementById('emp_id').value;
            const nombreCompleto = document.getElementById('nombre_completo').value.trim();
            const areaGeneralId = document.getElementById('sel_area').value;
            const turnoId = document.getElementById('sel_turno').value;
            const puesto = document.getElementById('puesto').value.trim();
            const estatus = document.getElementById('sel_estatus').value;

            if (!nombreCompleto || !areaGeneralId || !turnoId) {
                alert('Por favor complete los campos obligatorios (*).');
                return;
            }

            const btn = document.getElementById('btn_guardar_emp');
            btn.disabled = true;

            const payload = {
                nombre_completo: nombreCompleto,
                area_general_id: areaGeneralId,
                turno_id: turnoId, // Guardar UUID/ID real del turno de rh_turnos
                puesto: puesto,
                estatus: estatus
            };

            try {
                if (empId) {
                    const { error } = await _supabase.from('rh_empleados').update(payload).eq('id', empId);
                    if (error) throw error;
                    alert('Empleado actualizado correctamente.');
                } else {
                    const { error } = await _supabase.from('rh_empleados').insert([payload]);
                    if (error) throw error;
                    alert('Empleado registrado correctamente.');
                }

                limpiarFormulario();
                await cargarEmpleados();

            } catch (err) {
                console.error("Error al guardar empleado:", err);
                alert("Error al guardar: " + err.message);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
